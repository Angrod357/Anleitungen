<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dokubau — Baustein-Editor für IT-Dokumentation</title>
<style>
/* =====================================================================
   DESIGN-TOKENS — "Lila Schwarz Glass Glow"
   Grundidee: Terminal trifft Rack-Schiene. Bausteine werden wie Module
   auf eine leuchtende Signal-Schiene "aufgesteckt" (Connector-Rail).
   ===================================================================== */
:root{
  --void:        #0a0712;
  --void-deep:   #050308;
  --void-2:      #120b1f;
  --surface:     rgba(255,255,255,0.045);
  --surface-hi:  rgba(255,255,255,0.085);
  --surface-solid: #17101f;
  --edge:        rgba(178,90,243,0.20);
  --edge-hi:     rgba(178,90,243,0.5);
  --glow:        #b24bf3;
  --glow-deep:   #6d4aff;
  --glow-soft:   rgba(178,75,243,0.35);
  --ink:         #f5f1fc;
  --ink-dim:     #ac9fc7;
  --ink-faint:   #6b6280;
  --info:        #4fa8ff;
  --info-bg:     rgba(79,168,255,0.09);
  --info-edge:   rgba(79,168,255,0.35);
  --warn:        #ff8a5b;
  --warn-bg:     rgba(255,107,74,0.1);
  --warn-edge:   rgba(255,138,91,0.4);
  --ok:          #3ddc97;
  --ok-bg:       rgba(61,220,151,0.1);
  --danger:      #ff5470;
  --font-sans:   "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, Arial, sans-serif;
  --font-mono:   "Cascadia Code", "Cascadia Mono", "SF Mono", Consolas, "Fira Code", ui-monospace, monospace;
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --shadow-panel: 0 20px 60px -20px rgba(0,0,0,0.7), 0 1px 0 rgba(255,255,255,0.04) inset;
  --glow-ring: 0 0 0 1px var(--edge-hi), 0 0 24px -4px var(--glow-soft);
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--void);
  color:var(--ink);
  font-family:var(--font-sans);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
::selection{ background:var(--glow-soft); color:#fff; }

/* scrollbars */
*{ scrollbar-width:thin; scrollbar-color:var(--edge-hi) transparent; }
*::-webkit-scrollbar{ width:9px; height:9px; }
*::-webkit-scrollbar-track{ background:transparent; }
*::-webkit-scrollbar-thumb{ background:rgba(178,90,243,0.28); border-radius:20px; border:2px solid transparent; background-clip:padding-box; }
*::-webkit-scrollbar-thumb:hover{ background:rgba(178,90,243,0.5); background-clip:padding-box; }

/* ---------- Ambient background glow ---------- */
.bg-glow{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; background:var(--void); }
.bg-glow::before,.bg-glow::after{
  content:""; position:absolute; width:60vw; height:60vw; border-radius:50%;
  filter:blur(90px); opacity:0.16;
}
.bg-glow::before{ background:var(--glow); top:-20vw; left:-10vw; }
.bg-glow::after{ background:var(--glow-deep); bottom:-25vw; right:-15vw; opacity:0.14; }
@media (prefers-reduced-motion: no-preference){
  .bg-glow::before{ animation:drift1 34s ease-in-out infinite alternate; }
  .bg-glow::after{ animation:drift2 40s ease-in-out infinite alternate; }
}
@keyframes drift1{ from{ transform:translate(0,0) scale(1);} to{ transform:translate(4vw,3vw) scale(1.08);} }
@keyframes drift2{ from{ transform:translate(0,0) scale(1);} to{ transform:translate(-3vw,-4vw) scale(1.1);} }

/* ---------- Focus ---------- */
:focus-visible{ outline:2px solid var(--glow); outline-offset:2px; border-radius:6px; }
button:focus-visible{ outline-offset:2px; }

/* =====================================================================
   APP SHELL
   ===================================================================== */
#app{ position:relative; z-index:1; height:100vh; display:flex; flex-direction:column; }

/* ---------- Topbar ---------- */
.topbar{
  display:flex; align-items:center; gap:18px;
  padding:10px 20px; min-height:60px;
  background:linear-gradient(180deg, rgba(23,16,31,0.9), rgba(18,11,31,0.75));
  backdrop-filter:blur(20px) saturate(140%);
  border-bottom:1px solid var(--edge);
  box-shadow:0 1px 0 rgba(255,255,255,0.03) inset, 0 12px 30px -20px rgba(0,0,0,0.8);
  flex-wrap:wrap;
  position:relative; z-index:10; /* backdrop-filter oeffnet einen eigenen Stacking-Context;
    ohne explizite Positionierung+z-index hier wuerde .main (spaeter im DOM) die Topbar-
    Dropdowns (Export/Navigator) trotz ihres eigenen z-index optisch ueberdecken und deren
    Klicks blockieren. */
}
.brand{ display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:16px; letter-spacing:0.5px; color:var(--ink); flex:none; user-select:none; }
.brand b{ font-weight:600; color:var(--ink); }
.brand .cursor{ display:inline-block; width:8px; height:16px; background:var(--glow); box-shadow:0 0 10px var(--glow-soft); border-radius:2px; }

.doc-meta{ display:flex; align-items:center; gap:10px; flex:1 1 340px; min-width:260px; }
.doc-title-input{
  flex:1 1 auto; min-width:120px;
  background:transparent; border:none; color:var(--ink);
  font-size:15.5px; font-weight:600; padding:7px 10px; border-radius:var(--r-sm);
  border:1px solid transparent;
}
.doc-title-input:hover{ background:var(--surface); }
.doc-title-input:focus{ background:var(--surface); border-color:var(--edge-hi); outline:none; box-shadow:var(--glow-ring); }
.doc-title-input::placeholder{ color:var(--ink-faint); }

.meta-field{ display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); white-space:nowrap; }
.meta-field label{ color:var(--ink-faint); }
.meta-field input{
  background:var(--surface); border:1px solid var(--edge); color:var(--ink);
  font-family:var(--font-mono); font-size:12px; padding:5px 8px; border-radius:var(--r-sm);
  width:64px;
}
.meta-field input[type="date"]{ width:130px; color-scheme:dark; }
.meta-field input:focus{ outline:none; border-color:var(--edge-hi); box-shadow:var(--glow-ring); }

.search-shell{ position:relative; flex:1 1 260px; max-width:360px; min-width:160px; }
.search-shell input{
  width:100%; background:var(--surface); border:1px solid var(--edge); color:var(--ink);
  padding:8px 54px 8px 34px; border-radius:999px; font-size:13.5px;
  text-overflow:ellipsis;
}
.search-shell input:focus{ outline:none; border-color:var(--edge-hi); box-shadow:var(--glow-ring); background:var(--surface-hi); }
.search-shell input::placeholder{ color:var(--ink-faint); }
.search-shell svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-faint); pointer-events:none; }
.search-shell kbd{
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  font-family:var(--font-mono); font-size:10px; color:var(--ink-faint);
  border:1px solid var(--edge); border-radius:5px; padding:2px 5px; pointer-events:none;
}

.topbar-actions{ display:flex; align-items:center; gap:6px; flex:none; }

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--edge); border-radius:var(--r-sm);
  padding:8px 12px; font-size:13px; font-family:var(--font-sans); font-weight:500;
  cursor:pointer; transition:all .15s ease; white-space:nowrap;
}
.btn svg{ width:15px; height:15px; flex:none; }
.btn:hover{ background:var(--surface-hi); border-color:var(--edge-hi); transform:translateY(-1px); box-shadow:0 6px 16px -8px rgba(0,0,0,0.6); }
.btn:active{ transform:translateY(0); }
.btn-icon{ padding:8px; }
#syncStatusBtn{ position:relative; }
#syncStatusBtn .sync-icon-spin{ display:none; }
#syncStatusBtn[data-status="off"]{ opacity:0.4; }
#syncStatusBtn[data-status="ok"]{ color:var(--ok); }
#syncStatusBtn[data-status="error"]{ color:var(--danger); }
#syncStatusBtn[data-status="syncing"] .sync-icon-cloud{ display:none; }
#syncStatusBtn[data-status="syncing"] .sync-icon-spin{ display:block; animation:spin .9s linear infinite; }
.btn-primary{
  background:linear-gradient(135deg, var(--glow), var(--glow-deep));
  border-color:transparent; color:#fff; font-weight:600;
  box-shadow:0 4px 20px -6px var(--glow-soft);
}
.btn-primary:hover{ box-shadow:0 6px 26px -6px var(--glow-soft); filter:brightness(1.08); }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-ghost:hover{ background:var(--surface); border-color:var(--edge); }
.btn-danger{ color:#ffb3c0; }
.btn-danger:hover{ background:rgba(255,84,112,0.12); border-color:rgba(255,84,112,0.4); }
.btn-sm{ padding:5px 9px; font-size:12px; border-radius:7px; }
.btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none !important; }
.btn-menu-wrap{ position:relative; }
.menu{
  position:absolute; top:calc(100% + 6px); right:0; min-width:180px; z-index:40;
  background:var(--surface-solid); border:1px solid var(--edge); border-radius:var(--r-md);
  box-shadow:var(--shadow-panel); padding:6px; display:none; flex-direction:column; gap:2px;
}
.menu.open{ display:flex; }
.menu button{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  background:transparent; border:none; color:var(--ink); padding:8px 10px; border-radius:8px;
  font-size:13px; cursor:pointer; font-family:var(--font-sans);
}
.menu button:hover{ background:var(--surface-hi); color:#fff; }
.menu button svg{ width:15px; height:15px; color:var(--ink-dim); }
.menu-sep{ height:1px; background:var(--edge); margin:4px 2px; }

/* ---------- "Inhalt"-Sidebar: alle Dokumente + ihre Überschriften ---------- */
.nav-doc-group{ margin-bottom:8px; }
.nav-doc-group + .nav-doc-group{ padding-top:8px; border-top:1px solid var(--edge); }
.nav-doc-row{ display:flex; align-items:center; gap:1px; }
.nav-collapse-btn{
  display:flex; align-items:center; justify-content:center; flex:none;
  width:20px; height:28px; background:transparent; border:none; color:var(--ink-faint);
  cursor:pointer; border-radius:6px;
}
.nav-collapse-btn:hover{ background:var(--surface-hi); color:#fff; }
.nav-collapse-btn svg{ width:11px; height:11px; transition:transform .15s; }
.nav-doc-group.collapsed .nav-collapse-btn svg{ transform:rotate(-90deg); }
.nav-doc-title{
  display:flex; align-items:center; gap:8px; flex:1; min-width:0; text-align:left;
  background:transparent; border:none; color:var(--ink); padding:7px 8px; border-radius:8px;
  font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--font-sans);
}
.nav-doc-title:hover{ background:var(--surface-hi); color:#fff; }
.nav-doc-title.current{ color:var(--glow); }
.nav-doc-title .nav-dot{ width:6px; height:6px; border-radius:50%; background:var(--edge); flex:none; }
.nav-doc-title.current .nav-dot{ background:var(--glow); box-shadow:0 0 6px var(--glow-soft); }
.nav-doc-title span.nav-label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav-doc-body{ overflow:hidden; }
.nav-doc-group.collapsed .nav-doc-body{ display:none; }
.nav-empty-sm{ padding:3px 8px 6px 8px; font-size:11.5px; color:var(--ink-faint); font-style:italic; }
.nav-manage-btn{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; margin-top:2px;
  background:transparent; border:none; color:var(--ink-dim); padding:8px; border-radius:8px;
  font-size:12.5px; cursor:pointer; font-family:var(--font-sans);
}
.nav-manage-btn:hover{ background:var(--surface-hi); color:#fff; }
.nav-manage-btn svg{ width:14px; height:14px; }

/* ---------- Main layout ---------- */
.main{ flex:1; display:flex; min-height:0; }

.sidebar{
  width:250px; flex:none; display:flex; flex-direction:column; min-height:0;
  background:linear-gradient(180deg, rgba(18,11,31,0.6), rgba(10,7,18,0.4));
  border-right:1px solid var(--edge);
  backdrop-filter:blur(14px);
}
.sidebar-tabs{ display:flex; gap:2px; padding:12px 12px 0; flex:none; }
.sidebar-tab{
  flex:1; background:transparent; border:none; color:var(--ink-faint);
  font-size:11.5px; font-family:var(--font-mono); letter-spacing:0.6px; text-transform:uppercase;
  padding:9px 6px; cursor:pointer; border-bottom:2px solid transparent; transition:all .15s;
}
.sidebar-tab:hover{ color:var(--ink-dim); }
.sidebar-tab.active{ color:var(--glow); border-bottom-color:var(--glow); }
.sidebar-panel{ flex:1; overflow-y:auto; padding:14px 12px 24px; }
.sidebar-panel[hidden]{ display:none; }

.sidebar-empty{ color:var(--ink-faint); font-size:12.5px; padding:10px 6px; line-height:1.6; }

/* TOC */
.toc-list{ list-style:none; margin:0; padding:0; }
.toc-list li{ margin:1px 0; }
.toc-link{
  display:block; width:100%; text-align:left; background:transparent; border:none; cursor:pointer;
  color:var(--ink-dim); font-size:12.8px; padding:6px 10px; border-radius:7px;
  border-left:2px solid transparent; transition:all .12s; font-family:var(--font-sans);
}
.toc-link:hover{ background:var(--surface); color:var(--ink); }
.toc-link.lvl-1{ font-weight:700; color:var(--ink); text-transform:none; margin-top:8px; }
.toc-link.lvl-2{ padding-left:20px; }
.toc-link.lvl-3{ padding-left:32px; font-size:12px; color:var(--ink-faint); }
.toc-link .num{ font-family:var(--font-mono); color:var(--glow); margin-right:6px; font-size:11px; }

/* Changelog panel (sidebar) */
.changelog-entry{
  border-left:2px solid var(--edge-hi); padding:2px 0 12px 12px; margin-bottom:2px; position:relative;
}
.changelog-entry::before{
  content:""; position:absolute; left:-4.5px; top:4px; width:7px; height:7px; border-radius:50%;
  background:var(--glow); box-shadow:0 0 8px var(--glow-soft);
}
.changelog-entry .cv{ font-family:var(--font-mono); font-size:12px; color:var(--glow); font-weight:700; }
.changelog-entry .cd{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); margin-left:6px; }
.changelog-entry .cn{ font-size:12.5px; color:var(--ink-dim); margin-top:3px; }
.changelog-entry .cactions{ margin-top:4px; }
.changelog-entry .cactions button{ background:none; border:none; color:var(--ink-faint); font-size:11px; cursor:pointer; padding:0; }
.changelog-entry .cactions button:hover{ color:var(--danger); }

.changelog-form{ margin-top:16px; padding-top:14px; border-top:1px solid var(--edge); display:flex; flex-direction:column; gap:7px; }
.changelog-form .row{ display:flex; gap:6px; }
.changelog-form input, .changelog-form textarea{
  background:var(--surface); border:1px solid var(--edge); color:var(--ink);
  border-radius:7px; padding:6px 8px; font-size:12px; font-family:var(--font-sans); width:100%;
}
.changelog-form input[type="text"].cver{ width:70px; flex:none; font-family:var(--font-mono); }
.changelog-form input[type="date"]{ color-scheme:dark; font-family:var(--font-mono); font-size:11.5px; }
.changelog-form textarea{ resize:vertical; min-height:44px; font-family:var(--font-sans); }
.changelog-form input:focus,.changelog-form textarea:focus{ outline:none; border-color:var(--edge-hi); box-shadow:var(--glow-ring); }

/* ---------- Content area ---------- */
.content-area{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }

.mode-tabs{ display:flex; align-items:center; justify-content:space-between; padding:10px 24px 0; flex:none; }
.mode-tab-group{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--edge); border-radius:999px; padding:3px; }
.mode-tab{
  background:transparent; border:none; color:var(--ink-dim); font-size:12.5px; font-weight:600;
  padding:7px 16px; border-radius:999px; cursor:pointer; transition:all .15s; font-family:var(--font-sans);
}
.mode-tab.active{ background:linear-gradient(135deg, var(--glow), var(--glow-deep)); color:#fff; box-shadow:0 3px 14px -4px var(--glow-soft); }
.doc-stats{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); }

.block-toolbar{
  display:flex; gap:6px; flex-wrap:wrap; padding:14px 24px; flex:none;
}
.block-toolbar[hidden]{ display:none; }
.add-block-btn{
  display:flex; align-items:center; gap:7px; background:var(--surface); border:1px dashed var(--edge);
  color:var(--ink-dim); padding:8px 12px; border-radius:10px; cursor:pointer; font-size:12.5px;
  transition:all .15s; font-family:var(--font-sans);
}
.add-block-btn svg{ width:14px; height:14px; }
.add-block-btn:hover{ border-style:solid; border-color:var(--edge-hi); color:var(--ink); background:var(--surface-hi); transform:translateY(-1px); }

.editor-scroll{ flex:1; overflow-y:auto; padding:4px 24px 80px; }
.preview-scroll{ flex:1; overflow-y:auto; padding:0 24px 80px; }

/* ---------- Canvas + signature connector rail ---------- */
.canvas{ position:relative; max-width:880px; margin:0 auto; padding-left:26px; min-height:120px; }
.canvas::before{
  content:""; position:absolute; left:9px; top:6px; bottom:6px; width:2px;
  background:linear-gradient(180deg, var(--glow-soft), rgba(109,74,255,0.12) 60%, transparent);
  border-radius:2px;
}
.canvas-empty{
  margin-left:-26px; text-align:center; padding:60px 20px; color:var(--ink-faint); font-size:13.5px;
  border:1px dashed var(--edge); border-radius:var(--r-lg); background:var(--surface);
}
.canvas-empty svg{ width:34px; height:34px; color:var(--edge-hi); margin-bottom:10px; }

.block{ position:relative; margin-bottom:14px; }
.block-node{
  position:absolute; left:-26px; top:16px; width:11px; height:11px; border-radius:50%;
  background:var(--void); border:2px solid var(--glow); box-shadow:0 0 10px var(--glow-soft);
  z-index:2;
}
.block:hover .block-node{ background:var(--glow); }

.block-card{
  background:var(--surface); border:1px solid var(--edge); border-radius:var(--r-md);
  backdrop-filter:blur(10px); transition:border-color .15s, box-shadow .15s;
  position:relative; overflow:hidden;
}
.block:hover .block-card, .block.focused .block-card{ border-color:var(--edge-hi); box-shadow:0 8px 30px -14px rgba(0,0,0,0.7); }
.block.dragging .block-card{ opacity:0.4; }
.block.drag-over-top .block-card{ box-shadow: 0 -3px 0 0 var(--glow); }
.block.drag-over-bottom .block-card{ box-shadow: 0 3px 0 0 var(--glow); }

.block-controls{
  position:absolute; top:8px; right:8px; display:flex; gap:2px; opacity:0; transition:opacity .12s;
  background:rgba(10,7,18,0.55); border:1px solid var(--edge); border-radius:9px; padding:3px; backdrop-filter:blur(6px);
  z-index:3;
}
.block:hover .block-controls, .block.focused .block-controls{ opacity:1; }
.block-controls button{
  background:transparent; border:none; color:var(--ink-dim); width:24px; height:24px; border-radius:6px;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.block-controls button svg{ width:13px; height:13px; }
.block-controls button:hover{ background:var(--surface-hi); color:#fff; }
.block-controls button.danger:hover{ background:rgba(255,84,112,0.18); color:#ff8fa3; }
.block-controls .handle{ cursor:grab; }
.block-controls .handle:active{ cursor:grabbing; }

.block-type-tag{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:10px;
  text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-faint); padding:9px 14px 0;
}
.block-type-tag svg{ width:11px; height:11px; }

.block-body{ padding:6px 16px 14px; }

.mini-toolbar{ display:flex; gap:2px; padding:6px 14px 0; }
.mini-toolbar button{
  background:transparent; border:1px solid transparent; color:var(--ink-dim); width:26px; height:24px;
  border-radius:6px; cursor:pointer; font-size:12px; font-weight:700; font-family:var(--font-sans);
  display:flex; align-items:center; justify-content:center;
}
.mini-toolbar button:hover{ background:var(--surface-hi); border-color:var(--edge); color:#fff; }
.mini-toolbar .msep{ width:1px; background:var(--edge); margin:3px 4px; }

[contenteditable]{ outline:none; }
[contenteditable]:empty::before{ content:attr(data-placeholder); color:var(--ink-faint); pointer-events:none; }
.rich-content{ min-height:1.4em; font-size:14.5px; color:var(--ink); }
.rich-content ul, .rich-content ol{ margin:6px 0; padding-left:22px; }
.rich-content p{ margin:0 0 8px; }
.rich-content b,.rich-content strong{ color:#fff; }

.heading-row{ display:flex; align-items:center; gap:10px; padding:4px 16px 12px; }
.heading-level-select{
  background:var(--surface-hi); border:1px solid var(--edge); color:var(--glow); font-family:var(--font-mono);
  font-size:11px; font-weight:700; border-radius:7px; padding:5px 6px; cursor:pointer;
}
.heading-content{ font-weight:700; color:#fff; flex:1; }
.heading-content[data-level="1"]{ font-size:22px; }
.heading-content[data-level="2"]{ font-size:18px; }
.heading-content[data-level="3"]{ font-size:15px; color:var(--ink-dim); }

/* Info / Warning */
.block-callout{ margin:6px 16px 14px; padding:12px 14px; border-radius:var(--r-sm); display:flex; gap:10px; }
.block-callout svg{ width:18px; height:18px; flex:none; margin-top:2px; }
.callout-info{ background:var(--info-bg); border:1px solid var(--info-edge); }
.callout-info svg{ color:var(--info); }
.callout-warn{ background:var(--warn-bg); border:1px solid var(--warn-edge); }
.callout-warn svg{ color:var(--warn); }
.callout-body{ flex:1; font-size:14px; }
.callout-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; font-family:var(--font-mono); margin-bottom:3px; opacity:0.8; }
.callout-info .callout-label{ color:var(--info); }
.callout-warn .callout-label{ color:var(--warn); }

/* Code block */
.block-code-wrap{ margin:6px 16px 14px; border-radius:var(--r-sm); overflow:hidden; border:1px solid var(--edge); }
.code-head{ display:flex; align-items:center; justify-content:space-between; background:rgba(0,0,0,0.35); padding:6px 10px; }
.code-head input{
  background:transparent; border:none; color:var(--ink-faint); font-family:var(--font-mono); font-size:11px;
  width:130px;
}
.code-head input:focus{ outline:none; color:var(--ink); }
.copy-code-btn{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:11px; font-family:var(--font-mono); display:flex; align-items:center; gap:4px; }
.copy-code-btn:hover{ color:var(--glow); }
.copy-code-btn svg{ width:12px; height:12px; }
textarea.code-area{
  display:block; width:100%; background:var(--void-deep); color:#c9f7d8; border:none; resize:none;
  font-family:var(--font-mono); font-size:13px; line-height:1.55; padding:12px 14px; min-height:28px;
}
textarea.code-area:focus{ outline:none; }

/* Image block */
.block-image-wrap{ margin:6px 16px 14px; }
.image-dropzone{
  border:1.5px dashed var(--edge); border-radius:var(--r-sm); padding:30px 16px; text-align:center;
  color:var(--ink-faint); cursor:pointer; transition:all .15s; font-size:13px;
}
.image-dropzone:hover, .image-dropzone.drag-active{ border-color:var(--edge-hi); background:var(--surface-hi); color:var(--ink-dim); }
.image-dropzone svg{ width:26px; height:26px; margin-bottom:8px; color:var(--edge-hi); }
.image-dropzone .hint{ font-family:var(--font-mono); font-size:11px; margin-top:4px; color:var(--ink-faint); }
.block-image-wrap img{ max-width:100%; border-radius:var(--r-sm); display:block; border:1px solid var(--edge); }
.image-caption{
  width:100%; margin-top:8px; background:transparent; border:none; border-bottom:1px dashed var(--edge);
  color:var(--ink-dim); font-size:12.5px; font-style:italic; padding:5px 2px; text-align:center;
}
.image-caption:focus{ outline:none; border-color:var(--edge-hi); color:var(--ink); }
.image-actions{ display:flex; justify-content:center; gap:8px; margin-top:8px; }

/* =====================================================================
   PREVIEW MODE
   ===================================================================== */
.preview-doc{ max-width:760px; margin:0 auto; padding-top:10px; }
.preview-doc h1{ font-size:28px; margin:0 0 6px; color:#fff; letter-spacing:-0.3px; }
.preview-doc h2{ font-size:20px; margin:34px 0 10px; color:#fff; border-bottom:1px solid var(--edge); padding-bottom:8px; }
.preview-doc h3{ font-size:16px; margin:22px 0 8px; color:var(--ink); }
.preview-doc p{ margin:0 0 12px; color:var(--ink-dim); font-size:15px; }
.preview-doc ul,.preview-doc ol{ color:var(--ink-dim); padding-left:24px; margin:0 0 12px; }
.preview-doc b,.preview-doc strong{ color:var(--ink); }
.preview-meta{ font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); margin-bottom:26px; padding-bottom:16px; border-bottom:1px solid var(--edge); }
.preview-meta span{ margin-right:16px; }
.preview-meta .pv{ color:var(--glow); }
.preview-doc figure{ margin:18px 0; }
.preview-doc img{ max-width:100%; border-radius:var(--r-sm); border:1px solid var(--edge); display:block; }
.preview-doc figcaption{ font-size:12.5px; color:var(--ink-faint); font-style:italic; text-align:center; margin-top:7px; }
.preview-doc pre{
  background:var(--void-deep); border:1px solid var(--edge); border-radius:var(--r-sm); padding:14px 16px;
  overflow-x:auto; margin:14px 0;
}
.preview-doc code{ font-family:var(--font-mono); font-size:13px; color:#c9f7d8; }
.preview-callout{ padding:14px 16px; border-radius:var(--r-sm); margin:16px 0; display:flex; gap:10px; }
.preview-callout svg{ width:18px; height:18px; flex:none; margin-top:2px; }
.preview-doc .tx{ color:var(--ink-dim); }
.preview-empty{ text-align:center; color:var(--ink-faint); padding:60px 20px; font-size:13.5px; }

/* =====================================================================
   MODALS / OVERLAY
   ===================================================================== */
.overlay{
  position:fixed; inset:0; background:rgba(5,3,8,0.72); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
.modal{
  background:var(--surface-solid); border:1px solid var(--edge); border-radius:var(--r-lg);
  box-shadow:var(--shadow-panel); width:100%; max-height:82vh; display:flex; flex-direction:column;
  animation:popIn .18s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes popIn{ from{ opacity:0; transform:scale(0.96) translateY(6px); } to{ opacity:1; transform:none; } }
.modal-sm{ max-width:420px; }
.modal-md{ max-width:560px; }
.modal-lg{ max-width:680px; }
.modal-header{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--edge); flex:none; }
.modal-header h2{ font-size:16px; margin:0; color:#fff; display:flex; align-items:center; gap:9px; }
.modal-header h2 svg{ width:17px; height:17px; color:var(--glow); }
.modal-close{ background:transparent; border:none; color:var(--ink-faint); cursor:pointer; padding:4px; border-radius:6px; }
.modal-close:hover{ color:#fff; background:var(--surface); }
.modal-close svg{ width:17px; height:17px; }
.modal-body{ padding:20px 22px; overflow-y:auto; }
.modal-footer{ padding:14px 22px; border-top:1px solid var(--edge); display:flex; justify-content:flex-end; gap:8px; flex:none; }
.field-label{ font-size:12px; font-weight:600; color:var(--ink-dim); margin-bottom:6px; display:block; text-transform:uppercase; letter-spacing:0.4px; font-family:var(--font-mono); }
.field-hint{ font-size:12px; color:var(--ink-faint); margin-top:6px; line-height:1.5; }
.text-input, .modal-body textarea, .modal-body select{
  width:100%; background:var(--surface); border:1px solid var(--edge); color:var(--ink);
  padding:9px 11px; border-radius:var(--r-sm); font-size:13.5px; font-family:var(--font-sans);
}
.text-input:focus, .modal-body textarea:focus, .modal-body select:focus{ outline:none; border-color:var(--edge-hi); box-shadow:var(--glow-ring); }
.field-group{ margin-bottom:16px; }
.toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; }
.switch{ position:relative; width:38px; height:22px; flex:none; }
.switch input{ opacity:0; width:0; height:0; }
.switch .track{ position:absolute; inset:0; background:var(--surface-hi); border:1px solid var(--edge); border-radius:999px; cursor:pointer; transition:all .15s; }
.switch .thumb{ position:absolute; top:2px; left:2px; width:16px; height:16px; background:var(--ink-faint); border-radius:50%; transition:all .15s; }
.switch input:checked + .track{ background:linear-gradient(135deg, var(--glow), var(--glow-deep)); border-color:transparent; }
.switch input:checked + .track .thumb{ transform:translateX(16px); background:#fff; }

/* Documents manager */
.doc-list{ display:flex; flex-direction:column; gap:8px; }
.doc-list-item{
  display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--r-sm);
  border:1px solid var(--edge); background:var(--surface); cursor:pointer; transition:all .15s;
}
.doc-list-item:hover{ border-color:var(--edge-hi); background:var(--surface-hi); }
.doc-list-item.current{ border-color:var(--edge-hi); box-shadow:var(--glow-ring); }
.doc-list-item .dli-main{ flex:1; min-width:0; }
.doc-list-item .dli-title{ font-weight:600; color:#fff; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.doc-list-item .dli-sub{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-top:2px; }
.doc-list-item .dli-actions{ display:flex; gap:4px; flex:none; }
.doc-list-item .dli-actions button{ background:transparent; border:none; color:var(--ink-faint); width:26px; height:26px; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.doc-list-item .dli-actions button svg{ width:13.5px; height:13.5px; }
.doc-list-item .dli-actions button:hover{ background:var(--surface-hi); color:#fff; }
.doc-list-item .dli-actions button.danger:hover{ color:#ff8fa3; background:rgba(255,84,112,0.15); }

/* Search modal */
.search-modal .modal-body{ padding:0; }
.search-input-row{ display:flex; align-items:center; gap:10px; padding:16px 22px; border-bottom:1px solid var(--edge); }
.search-input-row svg{ width:17px; height:17px; color:var(--ink-faint); flex:none; }
.search-input-row input{ flex:1; background:transparent; border:none; color:var(--ink); font-size:15px; }
.search-input-row input:focus{ outline:none; }
.search-mode-badge{
  font-family:var(--font-mono); font-size:10px; padding:4px 8px; border-radius:999px; white-space:nowrap; flex:none;
  border:1px solid var(--edge);
}
.badge-ai{ color:var(--glow); border-color:var(--edge-hi); background:rgba(178,90,243,0.1); }
.badge-local{ color:var(--info); border-color:var(--info-edge); background:var(--info-bg); }
.search-results{ max-height:50vh; overflow-y:auto; padding:8px; }
.search-status{ padding:30px 22px; text-align:center; color:var(--ink-faint); font-size:13px; }
.search-status .spinner{ width:22px; height:22px; border:2px solid var(--edge); border-top-color:var(--glow); border-radius:50%; margin:0 auto 12px; animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.result-item{ padding:12px 14px; border-radius:var(--r-sm); cursor:pointer; margin-bottom:4px; transition:background .12s; }
.result-item:hover{ background:var(--surface); }
.result-head{ display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.result-doc{ font-size:11px; color:var(--glow); font-family:var(--font-mono); }
.result-type{ font-size:10px; color:var(--ink-faint); font-family:var(--font-mono); background:var(--surface); border:1px solid var(--edge); border-radius:5px; padding:1px 6px; }
.result-snippet{ font-size:13.5px; color:var(--ink-dim); line-height:1.5; }
.result-snippet mark{ background:rgba(178,90,243,0.35); color:#fff; border-radius:3px; padding:0 2px; }
.result-reason{ font-size:11.5px; color:var(--ink-faint); margin-top:5px; display:flex; gap:5px; align-items:flex-start; }
.result-reason svg{ width:12px; height:12px; flex:none; margin-top:2px; color:var(--glow); }

/* Toasts */
#toastRoot{ position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:8px; }
.toast{
  display:flex; align-items:center; gap:10px; background:var(--surface-solid); border:1px solid var(--edge);
  border-radius:var(--r-sm); padding:11px 16px; box-shadow:var(--shadow-panel); font-size:13px; color:var(--ink);
  animation:toastIn .2s ease; max-width:360px;
}
@keyframes toastIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
.toast svg{ width:16px; height:16px; flex:none; }
.toast.ok svg{ color:var(--ok); }
.toast.err svg{ color:var(--danger); }
.toast.info svg{ color:var(--info); }

/* =====================================================================
   PRINT
   ===================================================================== */
@media print{
  .bg-glow, .topbar, .sidebar, .mode-tabs, .block-toolbar, .block-controls, .block-node,
  .canvas::before, .overlay, #toastRoot, .mini-toolbar{ display:none !important; }
  /* Unabhaengig vom aktuellen App-Modus beim Drucken IMMER die Vorschau zeigen, nie den Editor
     (Absicherung falls ueber Strg+P/Browser-Menü statt ueber den "Drucken"-Button gedruckt wird) */
  #editorScroll{ display:none !important; }
  #previewScroll{ display:block !important; }
  body{ background:#fff !important; color:#111 !important; overflow:visible !important; }
  #app,.main,.content-area{ display:block !important; height:auto !important; }
  .preview-scroll{ overflow:visible !important; padding:0 !important; }
  .preview-doc{ max-width:100% !important; color:#111 !important; }
  .preview-doc h1,.preview-doc h2,.preview-doc h3,.preview-doc strong,.preview-doc b{ color:#000 !important; }
  .preview-doc p,.preview-doc ul,.preview-doc ol{ color:#222 !important; }
  .preview-meta{ color:#555 !important; border-color:#ccc !important; }
  .preview-meta .pv{ color:#000 !important; }
  h2{ page-break-after:avoid; break-after:avoid; }
  figure, .preview-callout, pre{ break-inside:avoid; }
  .preview-doc pre{ background:#f4f4f4 !important; border-color:#ccc !important; }
  .preview-doc code{ color:#111 !important; }
  .preview-callout{ border-width:1.5px !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .callout-info, .preview-callout.callout-info{ background:#eaf4ff !important; border-color:#9cc4ee !important; }
  .callout-warn, .preview-callout.callout-warn{ background:#fff2ea !important; border-color:#f0b58e !important; }
}

/* ---------- Small screens (desktop only, but keep from breaking) ---------- */
@media (max-width: 980px){
  .sidebar{ width:210px; }
  .doc-meta{ flex-basis:100%; order:3; }
  .search-shell{ order:2; }
}
@media (max-width: 680px){
  /* dokubau ist primär ein Desktop-Editor; auf sehr schmalen Screens blenden wir die
     Sidebar aus (Inhaltsverzeichnis bleibt in der Vorschau ohnehin sichtbar), damit
     der Canvas nicht auf eine unbenutzbare Restbreite gequetscht wird. */
  .sidebar{ display:none; }
  .block-toolbar{ gap:6px; }
  .add-block-btn{ padding:6px 9px; font-size:12px; }
  .doc-stats{ display:none; }
}
</style>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<div id="app">

  <!-- ===================== TOPBAR ===================== -->
  <header class="topbar">
    <div class="brand"><b>dokubau</b><span class="cursor" aria-hidden="true"></span></div>

    <div class="doc-meta">
      <input type="text" id="docTitleInput" class="doc-title-input" placeholder="Titel der Anleitung…" />
      <div class="meta-field">
        <label for="docVersionInput">v</label>
        <input type="text" id="docVersionInput" value="1.0" />
      </div>
      <div class="meta-field">
        <label for="docDateInput">Datum</label>
        <input type="date" id="docDateInput" />
      </div>
    </div>

    <div class="search-shell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
      <input type="text" id="globalSearchInput" placeholder="Alle Anleitungen durchsuchen … z. B. „Wie setze ich XY zurück?“" />
      <kbd>Strg+K</kbd>
    </div>

    <div class="topbar-actions">
      <button class="btn btn-ghost btn-icon" id="btnNewDoc" title="Neue Anleitung">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h6l4 4v12H8z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon" id="btnDocs" title="Dokumente verwalten">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="4.2" rx="1"/><rect x="4" y="10.4" width="16" height="4.2" rx="1"/><rect x="4" y="16.8" width="16" height="4.2" rx="1"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon" id="btnSave" title="Jetzt speichern (Strg+S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h8V4"/><rect x="8" y="14" width="8" height="5"/></svg>
      </button>

      <div class="btn-menu-wrap" id="exportMenuWrap">
        <button class="btn btn-ghost" id="btnExport" title="Exportieren">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
          Export
        </button>
        <div class="menu" id="exportMenu">
          <button id="exportJson"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/></svg> Als JSON (.json)</button>
          <button id="exportHtml"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/></svg> Als HTML (.html)</button>
          <div class="menu-sep"></div>
          <button id="btnPrint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9V3h12v6"/><rect x="6" y="14" width="12" height="7"/><path d="M4 9h16a1 1 0 0 1 1 1v6h-4M3 16v-6a1 1 0 0 1 1-1"/></svg> Drucken / PDF</button>
        </div>
      </div>

      <button class="btn btn-ghost btn-icon" id="btnImport" title="JSON importieren">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 19h16"/></svg>
      </button>
      <input type="file" id="importFileInput" accept="application/json" hidden />

      <button class="btn btn-ghost btn-icon" id="syncStatusBtn" data-status="off" title="Cloud-Sync deaktiviert">
        <svg class="sync-icon-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4-1.5A5 5 0 0 0 6.5 19h11z"/></svg>
        <svg class="sync-icon-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      </button>

      <button class="btn btn-ghost btn-icon" id="btnSettings" title="Einstellungen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.7 7.7 0 0 0-1.8-1L15 3.6h-4l-.3 2.4a7.7 7.7 0 0 0-1.8 1l-2.3-.9-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9a7.7 7.7 0 0 0 1.8 1L11 20.4h4l.3-2.4a7.7 7.7 0 0 0 1.8-1l2.3.9 2-3.4z"/></svg>
      </button>
    </div>
  </header>

  <!-- ===================== MAIN ===================== -->
  <div class="main">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" data-tab="toc">Inhalt</button>
        <button class="sidebar-tab" data-tab="changelog">Verlauf</button>
      </div>
      <div class="sidebar-panel" id="tocPanel"></div>
      <div class="sidebar-panel" id="changelogPanel" hidden></div>
    </aside>

    <!-- CONTENT -->
    <section class="content-area">
      <div class="mode-tabs">
        <div class="mode-tab-group">
          <button class="mode-tab active" data-mode="edit">✎ Bearbeiten</button>
          <button class="mode-tab" data-mode="preview">▤ Vorschau</button>
        </div>
        <div class="doc-stats" id="docStats"></div>
      </div>

      <div class="block-toolbar" id="blockToolbar">
        <!-- Baustein-Buttons werden per JS erzeugt -->
      </div>

      <div class="editor-scroll" id="editorScroll">
        <div class="canvas" id="canvas"></div>
      </div>

      <div class="preview-scroll" id="previewScroll" hidden>
        <div class="preview-doc" id="previewDoc"></div>
      </div>
    </section>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   dokubau — Baustein-Editor für IT-Dokumentation
   Reines Vanilla-JS, keine Abhängigkeiten, läuft vollständig offline.
   ===================================================================== */
(function(){

/* ============================================================
   1. ICONS (handgezeichnet, Strich-basiert — kein externes Icon-Set)
   ============================================================ */
const ICONS = {

/* ============================================================
   2. UTILS
   ============================================================ */
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
}
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function plainText(html){
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
function debounce(fn, wait){
  let t;
  return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), wait); };
}
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDateDisplay(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  if(!y||!m||!d) return iso;
  return `${d}.${m}.${y}`;
}
function slugify(text, usedSet){
  let base = (text||'abschnitt').toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'abschnitt';
  let slug = base, i = 2;
  const set = usedSet || new Set();
  while(set.has(slug)){ slug = base+'-'+i; i++; }
  set.add(slug);
  return slug;
}
function levenshtein(a,b){
  if(a===b) return 0;
  const al=a.length, bl=b.length;
  if(!al) return bl; if(!bl) return al;
  let prev = new Array(bl+1); for(let j=0;j<=bl;j++) prev[j]=j;
  for(let i=1;i<=al;i++){
    let cur=[i];
    for(let j=1;j<=bl;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
    }
    prev = cur;
  }
  return prev[bl];
}
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}
function autoResizeTextarea(ta){
  ta.style.height='auto';
  ta.style.height=(ta.scrollHeight+2)+'px';
}
function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
}
function safeFilename(s){
  return (s||'anleitung').toLowerCase().replace(/[^a-z0-9äöüß]+/gi,'-').replace(/^-+|-+$/g,'') || 'anleitung';
}

/* ============================================================
   3. STATE & KONSTANTEN
   ============================================================ */
const LS_DOCS = 'dokubau.documents.v1';
const LS_SETTINGS = 'dokubau.settings.v1';
const LS_LAST = 'dokubau.lastOpen.v1';
const LS_COLLAPSED = 'dokubau.collapsedNav.v1';
const BLOCK_LABELS = { heading:'Überschrift', text:'Text', image:'Bild', info:'Hinweis', warning:'Warnung', code:'Code' };

let state = { doc:null, mode:'edit', focusedBlockId:null, sidebarTab:'toc' };
let settings = { apiKey:'', aiSearchEnabled:false, cloudSyncEnabled:false, firebaseProjectId:'' };
let collapsedDocIds = new Set();
let dragSrcId = null;
let pendingImageBlockId = null;
let searchDebounceTimer = null;

/* ============================================================
   4. STORAGE (localStorage)
   ============================================================ */
function loadAllDocs(){
  try{ const raw = localStorage.getItem(LS_DOCS); return raw ? JSON.parse(raw) : {}; }
  catch(e){ console.error('Konnte Dokumente nicht laden', e); return {}; }
}
function saveAllDocs(docs){
  try{ localStorage.setItem(LS_DOCS, JSON.stringify(docs)); return true; }
  catch(e){ console.error('Speichern fehlgeschlagen', e); toast('err','Speichern fehlgeschlagen — Browser-Speicher evtl. voll.'); return false; }
}
function docHasContent(doc){
  return !!(doc && (doc.title.trim() || doc.blocks.length>0));
}
function persistCurrentDoc(){
  if(!state.doc) return;
  // Komplett leere, unbenannte Dokumente (z. B. direkt nach "Neu" oder nach dem Löschen
  // des zuvor offenen Dokuments) NICHT automatisch in der Dokumentenliste ablegen — sonst
  // taucht nach jedem Löschen/Neu-Klick sofort wieder ein "Ohne Titel"-Dokument auf.
  if(!docHasContent(state.doc)) return;
  const docs = loadAllDocs();
  docs[state.doc.id] = state.doc;
  saveAllDocs(docs);
  localStorage.setItem(LS_LAST, state.doc.id);
  if(cloudSyncReady()) cloudPushDoc(state.doc); // im Hintergrund, blockiert das lokale Speichern nicht
}
const scheduleAutosave = debounce(()=>{ persistCurrentDoc(); updateStats(); }, 600);

const SETTINGS_DEFAULTS = { apiKey:'', aiSearchEnabled:false, cloudSyncEnabled:false, firebaseProjectId:'' };
function loadSettings(){
  try{
    const raw = localStorage.getItem(LS_SETTINGS);
    settings = raw ? Object.assign({}, SETTINGS_DEFAULTS, JSON.parse(raw)) : Object.assign({}, SETTINGS_DEFAULTS);
  }catch(e){ settings = Object.assign({}, SETTINGS_DEFAULTS); }
}
function saveSettings(){ localStorage.setItem(LS_SETTINGS, JSON.stringify(settings)); }

/* ============================================================
   4b. CLOUD-SYNC (optional, geräteübergreifend über Firebase Firestore)
   ============================================================
   Rein clientseitig über die Firestore-REST-API (kein SDK, kein Server von uns).
   Jedes Dokument wird 1:1 als EIN Firestore-Dokument in der Collection
   "dokubau_docs" abgelegt, mit nur einem Feld "json" (der komplette,
   stringifizierte dokubau-Dokument-Objekt) — so brauchen wir keine
   rekursive Umwandlung in Firestores typisiertes Feldformat.
   Konfliktstrategie: pro Dokument "letzter Stand gewinnt" (Vergleich via
   updatedAt) — kein Feld-für-Feld-Merge. Für den Alltag einer Einzelperson
   an mehreren Geräten reicht das; bei echter Gleichzeitigkeit an zwei
   Geräten kann die ältere Version überschrieben werden.
   Läuft komplett robust degradiert: ohne Konfiguration oder bei
   Netzwerkfehlern bleibt alles lokal nutzbar, wie zuvor.
   ============================================================ */
function firestoreCollectionUrl(){
  return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(settings.firebaseProjectId)}/databases/(default)/documents/dokubau_docs`;
}
function cloudSyncReady(){ return !!(settings.cloudSyncEnabled && settings.firebaseProjectId && settings.firebaseProjectId.trim()); }
function setSyncStatus(status){
  const el = document.getElementById('syncStatusBtn');
  if(!el) return;
  el.dataset.status = status;
  const labels = { off:'Cloud-Sync deaktiviert (nur lokal gespeichert)', syncing:'Synchronisiere mit der Cloud …', ok:'Cloud-Sync aktiv — zuletzt erfolgreich synchronisiert', error:'Cloud nicht erreichbar — Änderungen bleiben lokal gespeichert' };
  el.title = labels[status] || '';
}
async function cloudPushDoc(doc){
  if(!cloudSyncReady()) return;
  const controller = new AbortController();
  const t = setTimeout(()=> controller.abort(), 10000);
  try{
    const url = `${firestoreCollectionUrl()}/${encodeURIComponent(doc.id)}`;
    const body = { fields: { json: { stringValue: JSON.stringify(doc) } } };
    const resp = await fetch(url, { method:'PATCH', signal:controller.signal, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    setSyncStatus('ok');
  }catch(e){
    console.warn('Cloud-Push fehlgeschlagen:', e);
    setSyncStatus('error');
  }finally{ clearTimeout(t); }
}
async function cloudDeleteDoc(id){
  if(!cloudSyncReady()) return;
  try{
    await fetch(`${firestoreCollectionUrl()}/${encodeURIComponent(id)}`, { method:'DELETE' });
  }catch(e){ console.warn('Cloud-Delete fehlgeschlagen:', e); }
}
async function cloudPullAllDocs(){
  if(!cloudSyncReady()) return null;
  const controller = new AbortController();
  const t = setTimeout(()=> controller.abort(), 12000);
  try{
    const resp = await fetch(`${firestoreCollectionUrl()}?pageSize=300`, { signal:controller.signal });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const data = await resp.json();
    const docs = (data.documents||[]).map(d=>{
      try{ return JSON.parse(d.fields.json.stringValue); }catch(e){ return null; }
    }).filter(Boolean);
    return docs;
  }catch(e){
    console.warn('Cloud-Pull fehlgeschlagen:', e);
    return null;
  }finally{ clearTimeout(t); }
}
async function syncWithCloud(showToast){
  if(!cloudSyncReady()){ setSyncStatus('off'); return; }
  setSyncStatus('syncing');
  const remoteDocs = await cloudPullAllDocs();
  if(remoteDocs === null){
    setSyncStatus('error');
    if(showToast) toast('err','Cloud nicht erreichbar — Änderungen bleiben lokal gespeichert.');
    return;
  }
  const localDocs = loadAllDocs();
  const merged = Object.assign({}, localDocs);
  const toPush = [];
  remoteDocs.forEach(rd=>{
    const ld = merged[rd.id];
    if(!ld || (rd.updatedAt||0) > (ld.updatedAt||0)) merged[rd.id] = rd;
  });
  Object.values(localDocs).forEach(ld=>{
    const rd = remoteDocs.find(r=>r.id===ld.id);
    if(!rd || (ld.updatedAt||0) > (rd.updatedAt||0)) toPush.push(ld);
  });
  saveAllDocs(merged);
  if(state.doc && merged[state.doc.id] && (merged[state.doc.id].updatedAt||0) > (state.doc.updatedAt||0)){
    state.doc = merged[state.doc.id];
    document.getElementById('docTitleInput').value = state.doc.title||'';
    document.getElementById('docVersionInput').value = state.doc.version||'1.0';
    document.getElementById('docDateInput').value = state.doc.date||todayISO();
    renderCanvas(); renderChangelogPanel();
  }
  renderTOC();
  await Promise.all(toPush.map(d=> cloudPushDoc(d)));
  setSyncStatus('ok');
  if(showToast) toast('ok','Mit der Cloud synchronisiert.');
}

function loadCollapsedDocs(){
  try{ const raw = localStorage.getItem(LS_COLLAPSED); collapsedDocIds = new Set(raw ? JSON.parse(raw) : []); }
  catch(e){ collapsedDocIds = new Set(); }
}
function saveCollapsedDocs(){
  try{ localStorage.setItem(LS_COLLAPSED, JSON.stringify([...collapsedDocIds])); }catch(e){}
}
function toggleDocCollapse(id){
  if(collapsedDocIds.has(id)) collapsedDocIds.delete(id); else collapsedDocIds.add(id);
  saveCollapsedDocs();
  renderTOC();
}

/* ============================================================
   5. DOKUMENT-MODELL
   ============================================================ */
function createBlankDoc(){
  return {
    id: uid(), title:'', version:'1.0', date: todayISO(), author:'',
    changelog:[{ id:uid(), version:'1.0', date:todayISO(), note:'Erste Version erstellt.' }],
    blocks:[], createdAt: Date.now(), updatedAt: Date.now(),
  };
}
function makeBlock(type){
  const base = { id: uid(), type };
  switch(type){
    case 'heading': return Object.assign(base, { level:2, text:'' });
    case 'text': return Object.assign(base, { html:'' });
    case 'image': return Object.assign(base, { src:'', caption:'' });
    case 'info': return Object.assign(base, { html:'' });
    case 'warning': return Object.assign(base, { html:'' });
    case 'code': return Object.assign(base, { text:'', label:'' });
    default: return base;
  }
}
function findBlock(id){ return state.doc.blocks.find(b=>b.id===id); }
function findBlockIndex(id){ return state.doc.blocks.findIndex(b=>b.id===id); }
function touchDoc(){ state.doc.updatedAt = Date.now(); }

function addBlock(type, afterId){
  const block = makeBlock(type);
  if(afterId){ state.doc.blocks.splice(findBlockIndex(afterId)+1, 0, block); }
  else if(state.focusedBlockId && findBlockIndex(state.focusedBlockId)!==-1){ state.doc.blocks.splice(findBlockIndex(state.focusedBlockId)+1, 0, block); }
  else { state.doc.blocks.push(block); }
  state.focusedBlockId = block.id;
  touchDoc(); renderCanvas(); renderTOC(); scheduleAutosave();
  requestAnimationFrame(()=> focusBlock(block.id));
  return block;
}
function removeBlock(id){
  const idx = findBlockIndex(id);
  if(idx===-1) return;
  state.doc.blocks.splice(idx,1);
  touchDoc(); renderCanvas(); renderTOC(); scheduleAutosave();
}
function duplicateBlock(id){
  const idx = findBlockIndex(id);
  if(idx===-1) return;
  const copy = JSON.parse(JSON.stringify(state.doc.blocks[idx]));
  copy.id = uid();
  state.doc.blocks.splice(idx+1,0,copy);
  touchDoc(); renderCanvas(); renderTOC(); scheduleAutosave();
}
function moveBlockBy(id, dir){
  const idx = findBlockIndex(id);
  const newIdx = idx+dir;
  if(idx===-1 || newIdx<0 || newIdx>=state.doc.blocks.length) return;
  const arr = state.doc.blocks;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  touchDoc(); renderCanvas(); renderTOC(); scheduleAutosave();
  requestAnimationFrame(()=> focusBlock(id));
}
function reorderBlocks(srcId, targetId, before){
  const arr = state.doc.blocks;
  const srcIdx = arr.findIndex(b=>b.id===srcId);
  if(srcIdx===-1) return;
  const [item] = arr.splice(srcIdx,1);
  const targetIdx = arr.findIndex(b=>b.id===targetId);
  if(targetIdx===-1) arr.push(item);
  else arr.splice(before?targetIdx:targetIdx+1, 0, item);
  touchDoc(); renderCanvas(); renderTOC(); scheduleAutosave();
}

/* ============================================================
   6. RENDERING — CANVAS / BAUSTEINE
   ============================================================ */
function renderCanvas(){
  const canvas = document.getElementById('canvas');
  const blocks = state.doc.blocks;
  if(!blocks.length){
    canvas.innerHTML = `<div class="canvas-empty">${icon('handle')}<div>Noch keine Bausteine.<br>Wähle oben einen Baustein-Typ, um zu beginnen.</div></div>`;
    updateStats();
    return;
  }
  canvas.innerHTML = blocks.map(renderBlockWrapper).join('');
  canvas.querySelectorAll('textarea.code-area').forEach(autoResizeTextarea);
  updateStats();
}
function renderBlockWrapper(b){
  return `<div class="block" data-id="${b.id}" data-type="${b.type}">
    <div class="block-node"></div>
    <div class="block-card">
      <div class="block-controls">
        <button class="handle" data-action="drag-handle" title="Ziehen zum Verschieben">${icon('handle')}</button>
        <button data-action="moveUp" title="Nach oben">${icon('up')}</button>
        <button data-action="moveDown" title="Nach unten">${icon('down')}</button>
        <button data-action="duplicate" title="Duplizieren">${icon('duplicate')}</button>
        <button data-action="delete" class="danger" title="Löschen">${icon('trash')}</button>
      </div>
      ${renderBlockInner(b)}
    </div>
  </div>`;
}
function renderBlockInner(b){
  switch(b.type){
    case 'heading': return renderHeadingBlock(b);
    case 'text': return renderTextBlock(b);
    case 'image': return renderImageBlock(b);
    case 'info': return renderCalloutBlock(b,'info');
    case 'warning': return renderCalloutBlock(b,'warning');
    case 'code': return renderCodeBlock(b);
    default: return '';
  }
}
function renderHeadingBlock(b){
  return `<div class="heading-row">
    <select class="heading-level-select" data-field="level">
      <option value="1" ${b.level===1?'selected':''}>H1</option>
      <option value="2" ${b.level===2?'selected':''}>H2</option>
      <option value="3" ${b.level===3?'selected':''}>H3</option>
    </select>
    <div class="heading-content" data-field="content" data-level="${b.level}" contenteditable="true" data-placeholder="Überschrift eingeben…">${escapeHtml(b.text)}</div>
  </div>`;
}
function richToolbar(){
  return `<div class="mini-toolbar">
    <button data-format="bold" title="Fett (Strg+B)"><b>B</b></button>
    <button data-format="italic" title="Kursiv (Strg+I)"><i>I</i></button>
    <div class="msep"></div>
    <button data-format="insertUnorderedList" title="Aufzählung">${icon('bullets')}</button>
    <button data-format="insertOrderedList" title="Nummerierte Liste">1.</button>
  </div>`;
}
function renderTextBlock(b){
  return `<div class="block-type-tag">${icon('text')} Text</div>
  ${richToolbar()}
  <div class="block-body">
    <div class="rich-content" data-field="content" contenteditable="true" data-placeholder="Text eingeben…">${b.html||''}</div>
  </div>`;
}

function updateStats(){

  const headings = state.doc.blocks.filter(b=>b.type==='heading').length;

/* ============================================================
   7. INHALTSVERZEICHNIS (Sidebar, live)
   ============================================================ */
function renderTOC(){
  const el = document.getElementById('tocPanel');
  // "Inhalt" zeigt jetzt ALLE gespeicherten Anleitungen samt ihren Überschriften auf einen
  // Blick (statt nur das aktuell offene Dokument) — für das gerade offene Dokument wird
  // immer der LIVE-Stand aus state.doc verwendet (nicht der ggf. wenige hundert ms alte,
  // zuletzt automatisch gespeicherte Stand), damit neu getippte Überschriften sofort erscheinen.
  const stored = loadAllDocs();
  if(state.doc) stored[state.doc.id] = state.doc;
  const docs = Object.values(stored).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(!docs.length){
    el.innerHTML = `<div class="sidebar-empty">Noch keine gespeicherten Anleitungen.</div>`;
    return;
  }
  const groups = docs.map(d=>{
    const isCurrent = state.doc && state.doc.id===d.id;
    const isCollapsed = collapsedDocIds.has(d.id);
    const headings = (d.blocks||[]).filter(b=>b.type==='heading');
    let h1=0,h2=0,h3=0;
    const items = headings.map(h=>{
      let num='';
      if(h.level===1){ h1++; h2=0; h3=0; num=`${h1}`; }
      else if(h.level===2){ h2++; h3=0; num=`${h1||1}.${h2}`; }
      else { h3++; num=`${h1||1}.${h2||1}.${h3}`; }
      const t = escapeHtml(h.text) || '(ohne Titel)';
      return `<li><button class="toc-link lvl-${h.level}" data-nav-doc="${d.id}" data-nav-block="${h.id}"><span class="num">${num}</span>${t}</button></li>`;
    }).join('');
    const headingsHtml = headings.length ? `<ul class="toc-list">${items}</ul>` : `<div class="nav-empty-sm">Keine Überschriften</div>`;
    return `<div class="nav-doc-group ${isCollapsed?'collapsed':''}">
      <div class="nav-doc-row">
        <button class="nav-collapse-btn" data-toggle-doc="${d.id}" title="${isCollapsed?'Ausklappen':'Einklappen'}">${icon('chevron')}</button>
        <button class="nav-doc-title ${isCurrent?'current':''}" data-nav-doc="${d.id}"><span class="nav-dot"></span><span class="nav-label">${escapeHtml(d.title)||'Ohne Titel'}</span></button>
      </div>
      <div class="nav-doc-body">${headingsHtml}</div>
    </div>`;
  }).join('');
  el.innerHTML = groups + `<div class="menu-sep" style="margin:8px 2px"></div><button class="nav-manage-btn" id="tocManageBtn">${icon('duplicate')} Alle Dokumente verwalten…</button>`;
}

   8. VERSIONIERUNG / ÄNDERUNGSPROTOKOLL

function renderChangelogPanel(){

function addChangelogEntry(){

  const date = document.getElementById('clDate').value || todayISO();
  const note = document.getElementById('clNote').value.trim();

}

/* ============================================================
   9. VORSCHAU + EXPORT-HTML (gemeinsame Rendering-Basis)
   ============================================================ */
function docToSemanticHTML(doc){
  const used = new Set();
  let body = '';
  doc.blocks.forEach(b=>{
    switch(b.type){
      case 'heading': {
        const slug = slugify(b.text, used);
        const tag = 'h'+b.level;
        body += `<${tag} id="${slug}">${escapeHtml(b.text)||'&nbsp;'}</${tag}>\n`;
        break;
      }
      case 'text':
        body += `<div class="tx">${b.html||''}</div>\n`;
        break;
      case 'image':
        if(b.src) body += `<figure><img src="${b.src}" alt="${escapeHtml(b.caption||'Screenshot')}">${b.caption?`<figcaption>${escapeHtml(b.caption)}</figcaption>`:''}</figure>\n`;
        break;
      case 'info':
        body += `<div class="preview-callout callout-info">${ICONS.info}<div class="callout-body"><div class="callout-label">Hinweis</div><div>${b.html||''}</div></div></div>\n`;
        break;
      case 'warning':
        body += `<div class="preview-callout callout-warn">${ICONS.warn}<div class="callout-body"><div class="callout-label">Warnung</div><div>${b.html||''}</div></div></div>\n`;
        break;
      case 'code':
        body += `<pre>${b.label?`<div style="color:var(--ink-faint);font-size:11px;margin-bottom:6px;font-family:var(--font-mono)">${escapeHtml(b.label)}</div>`:''}<code>${escapeHtml(b.text||'')}</code></pre>\n`;
        break;
    }
  });
  return body;
}
function buildTocHTML(doc){
  const headings = doc.blocks.filter(b=>b.type==='heading');
  if(!headings.length) return '';
  const used = new Set();
  let h1=0,h2=0,h3=0;
  const items = headings.map(h=>{
    const slug = slugify(h.text, used);
    let num='';
    if(h.level===1){h1++;h2=0;h3=0;num=`${h1}`;}
    else if(h.level===2){h2++;h3=0;num=`${h1||1}.${h2}`;}
    else{h3++;num=`${h1||1}.${h2||1}.${h3}`;}
    const indent = h.level===1?0:h.level===2?18:34;
    const fontStyle = h.level===1?'font-size:14px;font-weight:700':'font-size:13px';
    return `<div style="margin:4px 0;padding-left:${indent}px"><a href="#${slug}" style="color:inherit;text-decoration:none;${fontStyle}"><span style="color:var(--glow);font-family:var(--font-mono);margin-right:6px">${num}</span>${escapeHtml(h.text)||'(ohne Titel)'}</a></div>`;
  }).join('');
  return `<nav style="margin-bottom:28px;padding:16px 18px;border:1px solid var(--edge);border-radius:14px;background:var(--surface)">
    <div style="font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-faint);margin-bottom:8px">Inhaltsverzeichnis</div>
    ${items}
  </nav>`;
}
function renderPreview(){
  const el = document.getElementById('previewDoc');
  const doc = state.doc;
  if(!doc.blocks.length){
    el.innerHTML = `<div class="preview-empty">Diese Anleitung hat noch keinen Inhalt. Wechsle zu „Bearbeiten“, um Bausteine hinzuzufügen.</div>`;
    return;
  }
  const meta = `<div class="preview-meta">
    <span>Version <b class="pv">${escapeHtml(doc.version||'1.0')}</b></span>
    <span>Datum <b class="pv">${formatDateDisplay(doc.date)}</b></span>
    ${doc.author?`<span>Autor <b class="pv">${escapeHtml(doc.author)}</b></span>`:''}
  </div>`;
  el.innerHTML = `<h1>${escapeHtml(doc.title)||'Ohne Titel'}</h1>${meta}${buildTocHTML(doc)}${docToSemanticHTML(doc)}`;
}

/* ============================================================
   10b. KLICK-HANDLING FÜR "INHALT" (Dokument wechseln / zu Überschrift springen)
   ============================================================ */
function onTocPanelClick(e){
  if(e.target.closest('#tocManageBtn')){ openDocsModal(); return; }
  const toggleBtn = e.target.closest('[data-toggle-doc]');
  if(toggleBtn){ toggleDocCollapse(toggleBtn.dataset.toggleDoc); return; }

/* ============================================================
   11. FOKUS / SPRUNG-NAVIGATION
   ============================================================ */
function focusBlock(id){
  const el = document.querySelector(`.block[data-id="${id}"]`);
  if(!el) return;
  el.scrollIntoView({block:'center', behavior:'smooth'});
  const editable = el.querySelector('[contenteditable="true"]');
  if(editable){
    editable.focus();
    const range = document.createRange();
    range.selectNodeContents(editable);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
}
function jumpToBlockId(id){
  if(state.mode!=='edit') setMode('edit');
  const el = document.querySelector(`.block[data-id="${id}"]`);
  if(el){
    el.scrollIntoView({block:'center', behavior:'smooth'});
    el.classList.add('focused');
    setTimeout(()=>el.classList.remove('focused'), 1600);
  }
}

/* ============================================================
   12. CANVAS-INTERAKTION (Event-Delegation)
   ============================================================ */
function wireCanvasEvents(){
  const canvas = document.getElementById('canvas');
  canvas.addEventListener('click', onCanvasClick);
  canvas.addEventListener('input', onCanvasInput);
  canvas.addEventListener('change', onCanvasChange);
  canvas.addEventListener('focusin', onCanvasFocusIn);
  canvas.addEventListener('mousedown', onCanvasMouseDown);
  canvas.addEventListener('keydown', onCanvasKeyDown);
  canvas.addEventListener('paste', onCanvasPaste);
  canvas.addEventListener('dragstart', onCanvasDragStart);
  canvas.addEventListener('dragover', onCanvasDragOver);
  canvas.addEventListener('drop', onCanvasDrop);
  canvas.addEventListener('dragend', onCanvasDragEnd);
}
function syncRichField(blockEl){
  const b = findBlock(blockEl.dataset.id);
  const contentEl = blockEl.querySelector('[data-field="content"]');
  if(!b || !contentEl) return;
  if(b.type==='heading') b.text = contentEl.textContent;
  else b.html = contentEl.innerHTML;
  touchDoc(); scheduleAutosave();
}
function onCanvasClick(e){
  const fmtBtn = e.target.closest('[data-format]');
  const blockEl = e.target.closest('.block');
  if(fmtBtn){
    document.execCommand(fmtBtn.dataset.format, false, null);
    if(blockEl) syncRichField(blockEl);
    return;
  }
  const dz = e.target.closest('.image-dropzone');
  if(dz){ triggerImageUpload(blockEl ? blockEl.dataset.id : null); return; }

  const actionBtn = e.target.closest('[data-action]');
  if(!actionBtn) return;
  const id = blockEl ? blockEl.dataset.id : null;
  switch(actionBtn.dataset.action){
    case 'delete':
      confirmAction('Diesen Baustein löschen?', 'Löschen', ()=> removeBlock(id));
      break;
    case 'duplicate': duplicateBlock(id); break;
    case 'moveUp': moveBlockBy(id,-1); break;
    case 'moveDown': moveBlockBy(id,1); break;
    case 'uploadImage': case 'replaceImage': triggerImageUpload(id); break;
    case 'removeImage': {
      const b = findBlock(id); b.src=''; b.caption='';
      touchDoc(); renderCanvas(); scheduleAutosave();
      break;
    }
    case 'copyCode': {
      const b = findBlock(id); copyToClipboard(b.text||''); toast('ok','Befehl kopiert.');
      break;
    }
  }
}
function onCanvasInput(e){
  const blockEl = e.target.closest('.block');
  if(!blockEl) return;
  const b = findBlock(blockEl.dataset.id);
  if(!b) return;
  const field = e.target.dataset.field;
  if(field==='content'){
    if(b.type==='heading'){ b.text = e.target.textContent; renderTOC(); }
    else b.html = e.target.innerHTML;
  } else if(field==='caption'){ b.caption = e.target.value; }
  else if(field==='label'){ b.label = e.target.value; }
  else if(field==='code'){ b.text = e.target.value; autoResizeTextarea(e.target); }
  touchDoc(); scheduleAutosave();
}
function onCanvasChange(e){
  const blockEl = e.target.closest('.block');
  if(!blockEl || e.target.dataset.field!=='level') return;
  const b = findBlock(blockEl.dataset.id);
  if(!b) return;
  b.level = parseInt(e.target.value,10);
  const contentEl = blockEl.querySelector('.heading-content');
  if(contentEl) contentEl.dataset.level = b.level;
  touchDoc(); renderTOC(); scheduleAutosave();
}
function onCanvasFocusIn(e){
  const blockEl = e.target.closest('.block');
  document.querySelectorAll('.block.focused').forEach(x=>x.classList.remove('focused'));
  if(blockEl){ blockEl.classList.add('focused'); state.focusedBlockId = blockEl.dataset.id; }
}
function onCanvasKeyDown(e){
  const blockEl = e.target.closest('.block');
  if(!blockEl) return;
  const b = findBlock(blockEl.dataset.id);
  if(b && b.type==='heading' && e.target.dataset.field==='content' && e.key==='Enter'){
    e.preventDefault(); e.target.blur();
  }
  if((e.ctrlKey||e.metaKey) && (e.key==='b'||e.key==='i') && e.target.matches('[contenteditable="true"]')){
    setTimeout(()=> syncRichField(blockEl), 0);
  }
}
function onCanvasMouseDown(e){
  const handle = e.target.closest('[data-action="drag-handle"]');
  if(handle){ handle.closest('.block').setAttribute('draggable','true'); }
}
function onCanvasDragStart(e){
  const blockEl = e.target.closest('.block');
  if(!blockEl || blockEl.getAttribute('draggable')!=='true'){ e.preventDefault(); return; }
  dragSrcId = blockEl.dataset.id;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', dragSrcId); }catch(err){}
  requestAnimationFrame(()=> blockEl.classList.add('dragging'));
}
function onCanvasDragOver(e){
  const dz = e.target.closest('.image-dropzone');
  if(dz && !dragSrcId){ e.preventDefault(); dz.classList.add('drag-active'); return; }
  if(!dragSrcId) return;
  const target = e.target.closest('.block');
  if(!target || target.dataset.id===dragSrcId) return;
  e.preventDefault();
  const rect = target.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height/2;
  clearDropIndicators();
  target.classList.add(before?'drag-over-top':'drag-over-bottom');
}
function clearDropIndicators(){
  document.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(x=>x.classList.remove('drag-over-top','drag-over-bottom'));
  document.querySelectorAll('.image-dropzone.drag-active').forEach(x=>x.classList.remove('drag-active'));
}
function onCanvasDrop(e){
  const dz = e.target.closest('.image-dropzone');
  if(dz && !dragSrcId && e.dataTransfer.files && e.dataTransfer.files.length){
    e.preventDefault();
    clearDropIndicators();
    const blockId = e.target.closest('.block').dataset.id;
    handleImageFile(e.dataTransfer.files[0], blockId);
    return;
  }
  if(!dragSrcId) return;
  const target = e.target.closest('.block');
  if(!target || target.dataset.id===dragSrcId){ clearDropIndicators(); return; }
  e.preventDefault();
  const before = target.classList.contains('drag-over-top');
  clearDropIndicators();
  reorderBlocks(dragSrcId, target.dataset.id, before);
}
function onCanvasDragEnd(e){
  const blockEl = e.target.closest('.block');
  if(blockEl) blockEl.setAttribute('draggable','false');
  clearDropIndicators();
  document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));
  dragSrcId = null;
}

/* ============================================================
   13. BILD-HANDLING (Upload / Copy-Paste / Verkleinerung)
   ============================================================ */
function ensureHiddenImageInput(){
  let inp = document.getElementById('hiddenImageInput');
  if(!inp){
    inp = document.createElement('input');
    inp.type='file'; inp.id='hiddenImageInput'; inp.accept='image/*'; inp.hidden=true;
    document.body.appendChild(inp);
    inp.addEventListener('change', ()=>{
      if(inp.files && inp.files[0]) handleImageFile(inp.files[0], pendingImageBlockId);
      inp.value='';
    });
  }
}
function triggerImageUpload(blockId){
  pendingImageBlockId = blockId;
  document.getElementById('hiddenImageInput').click();
}
function handleImageFile(file, blockId){
  if(!file || !file.type.startsWith('image/')) return;
  downscaleImage(file, 1400, 0.85).then(dataUrl=>{
    let b = blockId ? findBlock(blockId) : null;
    if(!b) b = addBlock('image');
    b.src = dataUrl;
    touchDoc(); renderCanvas(); renderTOC(); scheduleAutosave();
    toast('ok','Bild eingefügt.');
  }).catch(()=> toast('err','Bild konnte nicht geladen werden.'));
}
function downscaleImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let {width,height} = img;
        if(width>maxDim || height>maxDim){
          if(width>height){ height = Math.round(height*maxDim/width); width = maxDim; }
          else{ width = Math.round(width*maxDim/height); height = maxDim; }
        }
        const canvasEl = document.createElement('canvas');
        canvasEl.width = width; canvasEl.height = height;
        const ctx = canvasEl.getContext('2d');
        ctx.drawImage(img,0,0,width,height);
        const mime = (file.type==='image/png' && width*height<900000) ? 'image/png' : 'image/jpeg';
        resolve(canvasEl.toDataURL(mime, quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function onCanvasPaste(e){
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const item of items){
    if(item.kind==='file' && item.type.startsWith('image/')){
      e.preventDefault();
      const file = item.getAsFile();
      const blockEl = e.target.closest('.block[data-type="image"]');
      handleImageFile(file, blockEl ? blockEl.dataset.id : null);
      return;
    }
  }
}

/* ============================================================
   14. TOASTS
   ============================================================ */
function toast(kind, msg){
  const root = document.getElementById('toastRoot');
  if(!root) return;
  const el = document.createElement('div');
  el.className = 'toast '+kind;
  const ic = kind==='ok'?'check':kind==='err'?'close':'info';
  el.innerHTML = `${icon(ic)}<span>${escapeHtml(msg)}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),320); }, 3200);
}

/* ============================================================
   15. DOKUMENT ÖFFNEN / WECHSELN
   ============================================================ */
function openDoc(doc){
  state.doc = doc;
  state.focusedBlockId = null;
  document.getElementById('docTitleInput').value = doc.title||'';
  document.getElementById('docVersionInput').value = doc.version||'1.0';
  document.getElementById('docDateInput').value = doc.date||todayISO();
