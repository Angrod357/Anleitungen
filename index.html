<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automatisieren — BashFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
##
html, body {
  height: 100%;
  overflow: hidden;
  background: #0d0f14;
  color: #e2e8f0;
  font-family: 'IBM Plex Sans', sans-serif;
}

/* Make the tool fill the full viewport */
#automatisieren {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(91,138,240,0.3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(91,138,240,0.55); }


      #automatisieren { height:100%; }
      #automatisieren.active { display:flex; flex-direction:column; }
      /* BashFlow styles scoped inside automatisieren */
      #automatisieren * { box-sizing:border-box; }
      .bf-wrap { flex:1; display:flex; flex-direction:column; overflow:hidden; background:#0d0f14; color:#e2e8f0; font-family:'IBM Plex Sans',sans-serif; }
      .bf-topbar { background:#161a22; border-bottom:1px solid #2a3040; padding:9px 14px; display:flex; align-items:center; gap:14px; flex-shrink:0; }
      .bf-title { font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; color:#5b8af0; letter-spacing:.05em; }
      .bf-title span { color:#94a3b8; font-weight:400; }
      .bf-actions { display:flex; gap:7px; margin-left:auto; }
      .bf-btn { padding:5px 12px; border-radius:6px; border:none; font-size:11px; font-weight:600; cursor:pointer; transition:all .15s; font-family:'IBM Plex Sans',sans-serif; }
      .bf-btn-primary { background:#5b8af0; color:#fff; }
      .bf-btn-primary:hover { background:#7aa3f5; }
      .bf-btn-ghost { background:transparent; color:#94a3b8; border:1px solid #2a3040; }
      .bf-btn-ghost:hover { border-color:#5b8af0; color:#5b8af0; }
      .bf-main { display:flex; flex:1; overflow:hidden; }
      /* Sidebar */
      .bf-sidebar { width:190px; background:#161a22; border-right:1px solid #2a3040; padding:10px 7px; overflow-y:auto; flex-shrink:0; }
      .bf-sb-title { font-size:10px; font-weight:600; color:#4a5568; letter-spacing:.1em; text-transform:uppercase; padding:0 7px 7px; }
      .bf-pal-sec { font-size:10px; color:#4a5568; letter-spacing:.08em; text-transform:uppercase; padding:9px 7px 4px; font-weight:600; }
      .bf-pal-item { padding:7px 9px; border-radius:7px; border:1px solid #2a3040; cursor:grab; font-size:11px; font-weight:600; display:flex; align-items:center; gap:7px; transition:all .15s; user-select:none; margin-bottom:3px; }
      .bf-pal-item:hover { border-color:#5b8af0; background:rgba(91,138,240,0.07); }
      .bf-pal-item:active { cursor:grabbing; }
      /* Canvas */
      .bf-canvas-wrap { flex:1; position:relative; overflow:hidden; background:#0d0f14; background-image:radial-gradient(circle,#2a3040 1px,transparent 1px); background-size:28px 28px; }
      .bf-canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
      svg.bf-svg { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; }
      .bf-hint { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); font-size:10px; color:#4a5568; pointer-events:none; letter-spacing:.04em; white-space:nowrap; }
      /* Blocks */
      .bf-block { position:absolute; min-width:175px; max-width:255px; border-radius:10px; border:1.5px solid #2a3040; background:#1e2330; z-index:10; cursor:move; user-select:none; transition:border-color .15s,box-shadow .15s; box-shadow:0 4px 16px rgba(0,0,0,.4); }
      .bf-block:hover { border-color:rgba(91,138,240,.5); }
      .bf-block.bf-selected { border-color:#5b8af0; box-shadow:0 0 0 2px rgba(91,138,240,.25),0 4px 20px rgba(0,0,0,.5); }
      .bf-block.bf-dragging { opacity:.8; z-index:100; box-shadow:0 12px 40px rgba(0,0,0,.7); }
      .bf-blk-hdr { padding:7px 9px; display:flex; align-items:center; gap:7px; border-bottom:1px solid #2a3040; cursor:move; }
      .bf-blk-icon { font-size:12px; }
      .bf-blk-lbl { font-size:11px; font-weight:600; flex:1; letter-spacing:.02em; }
      .bf-blk-btn { background:none; border:none; color:#4a5568; cursor:pointer; padding:2px 4px; border-radius:4px; font-size:11px; transition:all .15s; }
      .bf-blk-btn:hover { color:#e2e8f0; background:#2a3040; }
      .bf-blk-del:hover { color:#f87171!important; }
      .bf-preview { padding:5px 9px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:#94a3b8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:245px; }
      .bf-blk-body { padding:9px; display:none; border-top:1px solid #2a3040; }
      .bf-blk-body.open { display:block; }
      .bf-fg { margin-bottom:7px; }
      .bf-fg:last-child { margin-bottom:0; }
      .bf-fl { font-size:9.5px; color:#4a5568; font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin-bottom:3px; }
      .bf-fi { width:100%; background:#0d0f14; border:1px solid #2a3040; border-radius:5px; color:#e2e8f0; font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:4px 7px; outline:none; transition:border-color .15s; }
      .bf-fi:focus { border-color:#5b8af0; }
      .bf-fs { width:100%; background:#0d0f14; border:1px solid #2a3040; border-radius:5px; color:#e2e8f0; font-size:10.5px; padding:4px 7px; outline:none; cursor:pointer; font-family:'IBM Plex Sans',sans-serif; }
      /* Ports */
      .bf-port { position:absolute; width:11px; height:11px; border-radius:50%; background:#1e2330; border:2px solid #2a3040; cursor:crosshair; transition:all .15s; z-index:20; }
      .bf-port:hover { border-color:#5b8af0; background:#5b8af0; transform:scale(1.35)!important; }
      .bf-port-in  { top:-5.5px; left:50%; transform:translateX(-50%); }
      .bf-port-out { bottom:-5.5px; left:50%; transform:translateX(-50%); }
      .bf-port-yes { bottom:-5.5px; left:28%; }
      .bf-port-no  { bottom:-5.5px; left:72%; }
      .bf-port-lbl { position:absolute; font-size:8px; color:#4a5568; font-weight:600; pointer-events:none; bottom:-16px; white-space:nowrap; }
      /* Block themes */
      .bft-start .bf-blk-hdr { background:rgba(74,222,128,.1); } .bft-start { border-color:rgba(74,222,128,.4); } .bft-start .bf-blk-lbl { color:#4ade80; }
      .bft-end   .bf-blk-hdr { background:rgba(248,113,113,.1); } .bft-end   { border-color:rgba(248,113,113,.4); } .bft-end   .bf-blk-lbl { color:#f87171; }
      .bft-cmd   .bf-blk-hdr { background:rgba(91,138,240,.1); }  .bft-cmd   { border-color:rgba(91,138,240,.4); }  .bft-cmd   .bf-blk-lbl { color:#5b8af0; }
      .bft-var   .bf-blk-hdr { background:rgba(34,211,238,.1); }  .bft-var   { border-color:rgba(34,211,238,.4); }  .bft-var   .bf-blk-lbl { color:#22d3ee; }
      .bft-echo  .bf-blk-hdr { background:rgba(167,139,250,.1); } .bft-echo  { border-color:rgba(167,139,250,.4); } .bft-echo  .bf-blk-lbl { color:#a78bfa; }
      .bft-file  .bf-blk-hdr { background:rgba(45,212,191,.1); }  .bft-file  { border-color:rgba(45,212,191,.4); }  .bft-file  .bf-blk-lbl { color:#2dd4bf; }
      .bft-if    .bf-blk-hdr { background:rgba(251,191,36,.1); }  .bft-if    { border-color:rgba(251,191,36,.4); }  .bft-if    .bf-blk-lbl { color:#fbbf24; }
      .bft-loop  .bf-blk-hdr { background:rgba(251,146,60,.1); }  .bft-loop  { border-color:rgba(251,146,60,.4); }  .bft-loop  .bf-blk-lbl { color:#fb923c; }
      /* Code panel */
      .bf-code-panel { width:300px; background:#161a22; border-left:1px solid #2a3040; display:flex; flex-direction:column; flex-shrink:0; }
      .bf-cp-hdr { padding:9px 13px; border-bottom:1px solid #2a3040; display:flex; align-items:center; gap:7px; flex-shrink:0; }
      .bf-cp-dot { width:7px; height:7px; border-radius:50%; background:#4ade80; }
      .bf-cp-title { font-size:10.5px; font-weight:600; color:#94a3b8; letter-spacing:.05em; text-transform:uppercase; }
      .bf-code-scroll { flex:0 0 auto; overflow-y:auto; padding:12px 13px; max-height:42vh; }
      pre#bf-code { font-family:'IBM Plex Mono',monospace; font-size:10.5px; line-height:1.75; white-space:pre-wrap; word-break:break-all; }
      .bf-cp-actions { padding:9px 13px; border-top:1px solid #2a3040; flex-shrink:0; }
      /* Terminal */
      .bf-term-hdr { display:flex; align-items:center; gap:7px; padding:6px 13px; background:rgba(2,0,6,.95); border-top:1px solid rgba(52,211,153,.15); border-bottom:1px solid rgba(52,211,153,.07); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:rgba(52,211,153,.4); flex-shrink:0; }
      .bf-term-run { margin-left:auto; padding:3px 12px; background:rgba(52,211,153,.12); border:1px solid rgba(52,211,153,.3); border-radius:5px; color:#34d399; font-size:9px; cursor:pointer; transition:all .18s; font-family:'IBM Plex Mono',monospace; }
      .bf-term-run:hover { background:rgba(52,211,153,.22); border-color:#34d399; box-shadow:0 0 10px rgba(52,211,153,.2); }
      .bf-term-out { overflow-y:auto; padding:8px 13px; background:#010004; font-family:'IBM Plex Mono',monospace; font-size:11px; line-height:1.7; white-space:pre-wrap; flex:1; min-height:80px; }
      .bf-term-out .bto { color:#86efac; }
      .bf-term-out .bte { color:#f87171; }
      .bf-term-out .bts { color:rgba(168,85,247,.45); }
      .bf-term-inp-row { display:flex; align-items:center; background:#010004; border-top:1px solid rgba(52,211,153,.08); flex-shrink:0; }
      .bf-term-ps { padding:7px 5px 7px 11px; color:#a855f7; font-family:'IBM Plex Mono',monospace; font-size:12px; text-shadow:0 0 8px rgba(168,85,247,.6); }
      .bf-term-inp { flex:1; background:transparent; border:none; outline:none; color:#d8b4fe; font-family:'IBM Plex Mono',monospace; font-size:11px; padding:7px 4px; caret-color:#a855f7; }
      .bf-term-inp::placeholder { color:rgba(168,85,247,.18); }
      /* SVG lines */
      .bf-conn      { stroke:#5b8af0; stroke-width:2; fill:none; opacity:.7; }
      .bf-conn-yes  { stroke:#4ade80; stroke-width:2; fill:none; opacity:.8; }
      .bf-conn-no   { stroke:#f87171; stroke-width:2; fill:none; opacity:.8; }
      .bf-conn-temp { stroke:#5b8af0; stroke-width:1.5; fill:none; opacity:.45; stroke-dasharray:6 3; }
      /* Toast */
      #bf-toast { position:fixed; bottom:22px; right:22px; background:#1e2330; border:1px solid #2a3040; border-radius:8px; padding:9px 15px; font-size:11.5px; color:#e2e8f0; z-index:9999; opacity:0; transform:translateY(7px); transition:all .2s; pointer-events:none; }
      #bf-toast.bf-show { opacity:1; transform:translateY(0); }
    
</style>
</head>
<body>

<div id="automatisieren">
    <!-- ══════════════════════════════════
         SECTION: AUTOMATISIEREN (BashFlow)
    ══════════════════════════════════ -->
    

    <div class="bf-wrap">
      <div class="bf-topbar">
        <div class="bf-title">bash<span>flow</span> — Automatisieren</div>
        <div class="bf-actions">
          <button class="bf-btn bf-btn-ghost" onclick="bfClear()">Leeren</button>
          <button class="bf-btn bf-btn-ghost" onclick="bfLoadExample()">Beispiel</button>
          <button class="bf-btn bf-btn-primary" onclick="bfCopyCode()">Code kopieren</button>
        </div>
      </div>

      <div class="bf-main">
        <!-- SIDEBAR -->
        <div class="bf-sidebar">
          <div class="bf-sb-title">Blöcke</div>
          <div class="bf-pal-sec">Ablauf</div>
          <div class="bf-pal-item" draggable="true" ondragstart="bfPalDrag(event,'start')" style="border-color:rgba(74,222,128,.4);color:#4ade80">▶ START</div>
          <div class="bf-pal-item" draggable="true" ondragstart="bfPalDrag(event,'end')"   style="border-color:rgba(248,113,113,.4);color:#f87171">⏹ ENDE</div>
          <div class="bf-pal-sec">Befehle</div>
          <div class="bf-pal-item" draggable="true" ondragstart="bfPalDrag(event,'cmd')"   style="border-color:rgba(91,138,240,.4);color:#5b8af0">⚙ Befehl</div>
          <div class="bf-pal-item" draggable="true" ondragstart="bfPalDrag(event,'var')"   style="border-color:rgba(34,211,238,.4);color:#22d3ee">$ Variable</div>
          <div class="bf-pal-item" draggable="true" ondragstart="bfPalDrag(event,'echo')"  style="border-color:rgba(167,139,250,.4);color:#a78bfa">💬 Ausgabe</div>
          <div class="bf-pal-item" draggable="true" ondragstart="bfPalDrag(event,'file')"  style="border-color:rgba(45,212,191,.4);color:#2dd4bf">📄 Datei</div>
          <div class="bf-pal-sec">Logik</div>
          <div class="bf-pal-item" draggable="true" ondragstart="bfPalDrag(event,'if')"    style="border-color:rgba(251,191,36,.4);color:#fbbf24">◇ IF</div>
          <div class="bf-pal-item" draggable="true" ondragstart="bfPalDrag(event,'loop')"  style="border-color:rgba(251,146,60,.4);color:#fb923c">↻ Schleife</div>
        </div>

        <!-- CANVAS -->
        <div class="bf-canvas-wrap" id="bf-canvas-wrap"
          ondragover="event.preventDefault()"
          ondrop="bfCanvasDrop(event)"
          onmousemove="bfMouseMove(event)"
          onmouseup="bfMouseUp(event)">
          <svg class="bf-svg" id="bf-svg"></svg>
          <div class="bf-canvas" id="bf-canvas"></div>
          <div class="bf-hint">Blöcke ziehen · Port anklicken zum Verbinden · Block aufklappen zum Bearbeiten</div>
        </div>

        <!-- CODE PANEL -->
        <div class="bf-code-panel">
          <div class="bf-cp-hdr"><div class="bf-cp-dot"></div><div class="bf-cp-title">Bash Code</div></div>
          <div class="bf-code-scroll"><pre id="bf-code"><span style="color:#4a5568"># Blöcke hinzufügen...</span></pre></div>
          <div class="bf-cp-actions"><button class="bf-btn bf-btn-ghost" style="width:100%" onclick="bfCopyCode()">📋 Code kopieren</button></div>
          <!-- TERMINAL -->
          <div class="bf-term-hdr">Testumgebung <button class="bf-term-run" onclick="bfRunCode()">▶ Run</button></div>
          <div class="bf-term-out" id="bf-term-out"><span class="bts">— Ausgabe erscheint hier —</span></div>
          <div class="bf-term-inp-row">
            <span class="bf-term-ps">$</span>
            <input class="bf-term-inp" id="bf-term-inp" placeholder="Befehl testen…" onkeydown="bfTermKey(event)">
          </div>
        </div>
      </div>
    </div>
    <div id="bf-toast"></div>

</div>

<script>
// ══════════════════════════════════
// BASHFLOW — Automatisieren
// ══════════════════════════════════
let bfBlocks = [];
let bfConns  = [];
let bfDragBlock = null, bfDragOX = 0, bfDragOY = 0;
let bfConnFrom  = null;
let bfTempLine  = null;
let bfIdCtr = 0;

const BF_DEFS = {
  start:{ label:'START',    icon:'▶', theme:'bft-start', ports:{in:false,out:true},   fields:[],
    code:()=>'#!/bin/bash\n# Generiert von BashFlow\n' },
  end:  { label:'ENDE',     icon:'⏹', theme:'bft-end',   ports:{in:true, out:false},  fields:[],
    code:()=>'exit 0' },
  cmd:  { label:'Befehl',   icon:'⚙', theme:'bft-cmd',   ports:{in:true, out:true},   fields:[
    {key:'command',label:'Befehl',type:'text',ph:'z.B. df -h /'},
    {key:'save_to',label:'Ergebnis in Variable',type:'text',ph:'z.B. RESULT (optional)'}],
    code:(b)=>b.data.save_to ? `${b.data.save_to}=$(${b.data.command||'echo ""'})` : (b.data.command||'# Befehl fehlt') },
  var:  { label:'Variable', icon:'$', theme:'bft-var',   ports:{in:true, out:true},   fields:[
    {key:'name', label:'Name', type:'text',ph:'z.B. DATUM'},
    {key:'value',label:'Wert', type:'text',ph:'z.B. $(date +%Y-%m-%d)'}],
    code:(b)=>`${b.data.name||'VAR'}="${b.data.value||''}"` },
  echo: { label:'Ausgabe',  icon:'💬',theme:'bft-echo',  ports:{in:true, out:true},   fields:[
    {key:'message',label:'Text',type:'text',ph:'z.B. Fertig! oder $VAR'}],
    code:(b)=>`echo "${b.data.message||''}"` },
  file: { label:'Datei',    icon:'📄',theme:'bft-file',  ports:{in:true, out:true},   fields:[
    {key:'mode',   label:'Modus',   type:'select',opts:['Schreiben (>)','Anhängen (>>)','Lesen (<)']},
    {key:'content',label:'Inhalt',  type:'text',ph:'z.B. $RESULT'},
    {key:'filename',label:'Datei',  type:'text',ph:'z.B. bericht.txt'}],
    code:(b)=>{ const op=b.data.mode?.includes('>>')?'>>':b.data.mode?.includes('<')?'<':'>'; return `echo ${b.data.content||'""'} ${op} ${b.data.filename||'output.txt'}`; } },
  if:   { label:'IF',       icon:'◇',theme:'bft-if',    ports:{in:true,outYes:true,outNo:true}, fields:[
    {key:'left', label:'Linker Wert', type:'text',ph:'z.B. $WERT'},
    {key:'op',   label:'Operator',    type:'select',opts:['-gt (>)','-lt (<)','-eq (==)','-ne (!=)','-ge (>=)','-le (<=)']},
    {key:'right',label:'Rechter Wert',type:'text',ph:'z.B. 80'}],
    code:(b)=>{ const op=(b.data.op||'-gt (>)').split(' ')[0]; return `if [ "${b.data.left||'$VAR'}" ${op} "${b.data.right||'0'}" ]; then\n  # JA\nelse\n  # NEIN\nfi`; } },
  loop: { label:'Schleife', icon:'↻',theme:'bft-loop',  ports:{in:true, out:true},   fields:[
    {key:'type', label:'Typ',        type:'select',opts:['for','while']},
    {key:'var',  label:'Variable',   type:'text',ph:'z.B. i'},
    {key:'range',label:'In/Bedingung',type:'text',ph:'z.B. {1..10}'}],
    code:(b)=>b.data.type==='while' ? `while ${b.data.range||'true'}; do\n  # Körper\ndone` : `for ${b.data.var||'i'} in ${b.data.range||'{1..10}'}; do\n  # Körper\ndone` }
};

// ── Palette drag ──
function bfPalDrag(e,type){ e.dataTransfer.setData('bftype',type); }

function bfCanvasDrop(e){
  e.preventDefault();
  const type=e.dataTransfer.getData('bftype'); if(!type)return;
  const r=document.getElementById('bf-canvas-wrap').getBoundingClientRect();
  bfAddBlock(type, e.clientX-r.left-88, e.clientY-r.top-28);
}

// ── Add block ──
function bfAddBlock(type,x,y){
  const id='bf'+(++bfIdCtr);
  const def=BF_DEFS[type];
  const block={id,type,x,y,data:{},expanded:false};
  def.fields.forEach(f=>{ block.data[f.key]=f.opts?f.opts[0]:''; });
  bfBlocks.push(block);
  bfRenderBlock(block);
  bfGenCode();
}

// ── Render block ──
function bfRenderBlock(block){
  const def=BF_DEFS[block.type];
  document.getElementById(block.id)?.remove();
  const el=document.createElement('div');
  el.id=block.id;
  el.className=`bf-block ${def.theme}`;
  el.style.cssText=`left:${block.x}px;top:${block.y}px`;

  // Header
  const hdr=document.createElement('div');
  hdr.className='bf-blk-hdr';
  hdr.innerHTML=`<span class="bf-blk-icon">${def.icon}</span><span class="bf-blk-lbl">${def.label}</span>
    <button class="bf-blk-btn" onclick="bfToggle('${block.id}')">${block.expanded?'▲':'▼'}</button>
    <button class="bf-blk-btn bf-blk-del" onclick="bfDeleteBlock('${block.id}')">✕</button>`;
  el.appendChild(hdr);

  // Preview
  const prev=document.createElement('div');
  prev.className='bf-preview'; prev.id=block.id+'-prev';
  prev.textContent=def.code(block).split('\n')[0];
  el.appendChild(prev);

  // Body
  if(def.fields.length){
    const body=document.createElement('div');
    body.className='bf-blk-body'+(block.expanded?' open':''); body.id=block.id+'-body';
    def.fields.forEach(f=>{
      const fg=document.createElement('div'); fg.className='bf-fg';
      fg.innerHTML=`<div class="bf-fl">${f.label}</div>`;
      if(f.type==='select'){
        const s=document.createElement('select'); s.className='bf-fs';
        (f.opts||[]).forEach(o=>{ const op=document.createElement('option'); op.value=o; op.textContent=o; if(block.data[f.key]===o)op.selected=true; s.appendChild(op); });
        s.onchange=e=>{ block.data[f.key]=e.target.value; bfUpdatePrev(block.id); bfGenCode(); };
        fg.appendChild(s);
      } else {
        const i=document.createElement('input'); i.className='bf-fi'; i.type='text';
        i.placeholder=f.ph||''; i.value=block.data[f.key]||'';
        i.oninput=e=>{ block.data[f.key]=e.target.value; bfUpdatePrev(block.id); bfGenCode(); };
        fg.appendChild(i);
      }
      body.appendChild(fg);
    });
    el.appendChild(body);
  }

  // Ports
  if(def.ports.in){    const p=bfMakePort('bf-port-in','Eingang'); p.onclick=e=>{e.stopPropagation();bfPortClick(block.id,'in')}; el.appendChild(p); }
  if(def.ports.out){   const p=bfMakePort('bf-port-out','Ausgang'); p.onclick=e=>{e.stopPropagation();bfPortClick(block.id,'out')}; el.appendChild(p); }
  if(def.ports.outYes){const p=bfMakePort('bf-port-yes','JA'); p.innerHTML+='<span class="bf-port-lbl" style="left:-4px">JA</span>'; p.onclick=e=>{e.stopPropagation();bfPortClick(block.id,'yes')}; el.appendChild(p); }
  if(def.ports.outNo){ const p=bfMakePort('bf-port-no','NEIN'); p.innerHTML+='<span class="bf-port-lbl" style="right:-4px">NEIN</span>'; p.onclick=e=>{e.stopPropagation();bfPortClick(block.id,'no')}; el.appendChild(p); }

  hdr.onmousedown=e=>bfStartDrag(e,block.id);
  document.getElementById('bf-canvas').appendChild(el);
}

function bfMakePort(cls,title){ const p=document.createElement('div'); p.className='bf-port '+cls; p.title=title; return p; }
function bfUpdatePrev(id){ const b=bfBlocks.find(x=>x.id===id); if(!b)return; const p=document.getElementById(id+'-prev'); if(p)p.textContent=BF_DEFS[b.type].code(b).split('\n')[0]; }
function bfToggle(id){ const b=bfBlocks.find(x=>x.id===id); if(!b)return; b.expanded=!b.expanded; const bd=document.getElementById(id+'-body'); if(bd)bd.className='bf-blk-body'+(b.expanded?' open':''); document.querySelector(`#${id} .bf-blk-btn`).textContent=b.expanded?'▲':'▼'; }
function bfDeleteBlock(id){ bfBlocks=bfBlocks.filter(b=>b.id!==id); bfConns=bfConns.filter(c=>c.from!==id&&c.to!==id); document.getElementById(id)?.remove(); bfRenderConns(); bfGenCode(); }

// ── Drag ──
function bfStartDrag(e,id){
  if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;
  e.preventDefault(); bfDragBlock=id;
  const b=bfBlocks.find(x=>x.id===id);
  const r=document.getElementById('bf-canvas-wrap').getBoundingClientRect();
  bfDragOX=e.clientX-r.left-b.x; bfDragOY=e.clientY-r.top-b.y;
  document.getElementById(id).classList.add('bf-dragging');
}
function bfMouseMove(e){
  if(bfDragBlock){
    const r=document.getElementById('bf-canvas-wrap').getBoundingClientRect();
    const x=Math.max(0,e.clientX-r.left-bfDragOX), y=Math.max(0,e.clientY-r.top-bfDragOY);
    const b=bfBlocks.find(x=>x.id===bfDragBlock); b.x=x; b.y=y;
    const el=document.getElementById(bfDragBlock); el.style.left=x+'px'; el.style.top=y+'px';
    bfRenderConns();
  }
  if(bfConnFrom) bfUpdateTempLine(e);
}
function bfMouseUp(){ if(bfDragBlock){ document.getElementById(bfDragBlock)?.classList.remove('bf-dragging'); bfDragBlock=null; } }

// ── Connections ──
function bfPortClick(blockId,portType){
  if(!bfConnFrom){
    if(portType==='in')return;
    bfConnFrom={blockId,portType};
    bfShowToast('Port gewählt — jetzt Eingang eines anderen Blocks klicken');
  } else {
    if(portType!=='in'||bfConnFrom.blockId===blockId){ bfConnFrom=null; bfRemoveTempLine(); return; }
    bfConns.push({from:bfConnFrom.blockId,fromPort:bfConnFrom.portType,to:blockId});
    bfConnFrom=null; bfRemoveTempLine(); bfRenderConns(); bfGenCode();
  }
}

function bfPortCenter(blockId,portType){
  const el=document.getElementById(blockId); if(!el)return null;
  const cr=document.getElementById('bf-canvas-wrap').getBoundingClientRect();
  const br=el.getBoundingClientRect();
  if(portType==='in')  return{x:br.left-cr.left+br.width/2,   y:br.top-cr.top};
  if(portType==='out') return{x:br.left-cr.left+br.width/2,   y:br.top-cr.top+br.height};
  if(portType==='yes') return{x:br.left-cr.left+br.width*.28,  y:br.top-cr.top+br.height};
  if(portType==='no')  return{x:br.left-cr.left+br.width*.72,  y:br.top-cr.top+br.height};
}

function bfRenderConns(){
  const svg=document.getElementById('bf-svg'); svg.innerHTML='';
  bfConns.forEach((conn,i)=>{
    const fr=bfPortCenter(conn.from,conn.fromPort), to=bfPortCenter(conn.to,'in');
    if(!fr||!to)return;
    const cls=conn.fromPort==='yes'?'bf-conn-yes':conn.fromPort==='no'?'bf-conn-no':'bf-conn';
    const cy=(fr.y+to.y)/2;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M ${fr.x} ${fr.y} C ${fr.x} ${cy}, ${to.x} ${cy}, ${to.x} ${to.y}`);
    path.setAttribute('class',cls); path.style.cursor='pointer';
    path.onclick=()=>{ bfConns.splice(i,1); bfRenderConns(); bfGenCode(); };
    const clr=conn.fromPort==='yes'?'#4ade80':conn.fromPort==='no'?'#f87171':'#5b8af0';
    const arr=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    arr.setAttribute('points',`${to.x},${to.y} ${to.x-5},${to.y-8} ${to.x+5},${to.y-8}`);
    arr.setAttribute('fill',clr); arr.setAttribute('opacity','0.8');
    svg.appendChild(path); svg.appendChild(arr);
  });
}

function bfUpdateTempLine(e){
  const svg=document.getElementById('bf-svg');
  svg.querySelectorAll('.bf-conn-temp').forEach(x=>x.remove());
  const fr=bfPortCenter(bfConnFrom.blockId,bfConnFrom.portType); if(!fr)return;
  const cr=document.getElementById('bf-canvas-wrap').getBoundingClientRect();
  const mx=e.clientX-cr.left, my=e.clientY-cr.top;
  const cy=(fr.y+my)/2;
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',`M ${fr.x} ${fr.y} C ${fr.x} ${cy}, ${mx} ${cy}, ${mx} ${my}`);
  path.setAttribute('class','bf-conn-temp'); svg.appendChild(path);
}
function bfRemoveTempLine(){ document.getElementById('bf-svg')?.querySelectorAll('.bf-conn-temp').forEach(x=>x.remove()); }

// ── Code generation ──
function bfGenCode(){
  if(!bfBlocks.length){ document.getElementById('bf-code').innerHTML='<span style="color:#4a5568"># Blöcke hinzufügen...</span>'; return; }
  const ordered=bfTopoSort();
  const html=ordered.map(b=>{
    const code=BF_DEFS[b.type].code(b);
    return code.split('\n').map(line=>{
      if(line.startsWith('#')) return `<span style="color:#4a5568">${bfEsc(line)}</span>`;
      if(/^(if|fi|else|for|while|done|exit)/.test(line)) return `<span style="color:#5b8af0">${bfEsc(line)}</span>`;
      if(line.startsWith('echo')) return `<span style="color:#a78bfa">${bfEsc(line)}</span>`;
      if(/^[A-Z_]+=/.test(line)) return `<span style="color:#22d3ee">${bfEsc(line)}</span>`;
      return `<span style="color:#e2e8f0">${bfEsc(line)}</span>`;
    }).join('\n');
  }).join('\n');
  document.getElementById('bf-code').innerHTML=html;
}

function bfTopoSort(){
  const visited=new Set(), result=[];
  function visit(b){ if(visited.has(b.id))return; visited.add(b.id); result.push(b); bfConns.filter(c=>c.from===b.id).map(c=>bfBlocks.find(x=>x.id===c.to)).filter(Boolean).forEach(visit); }
  bfBlocks.filter(b=>b.type==='start').forEach(visit);
  bfBlocks.forEach(b=>{ if(!visited.has(b.id))visit(b); });
  return result;
}

function bfClear(){ bfBlocks=[]; bfConns=[]; document.getElementById('bf-canvas').innerHTML=''; document.getElementById('bf-svg').innerHTML=''; bfIdCtr=0; bfGenCode(); }
function bfCopyCode(){ navigator.clipboard.writeText(document.getElementById('bf-code').innerText).then(()=>bfShowToast('Code kopiert! ✓')); }

let bfTermHistory=[], bfTermHistIdx=-1;

function bfRunCode(){
  const out=document.getElementById('bf-term-out');
  const code=document.getElementById('bf-code')?.innerText||'';
  if(!code.trim().replace(/^#.*/gm,'').trim()){ out.innerHTML='<span class="bts">— Kein Code vorhanden —</span>'; return; }
  out.innerHTML='';
  const vars={};
  let html='';
  const app=(txt,cls)=>{ html+=`<span class="${cls||'bto'}">${bfEsc(txt)}\n</span>`; };
  app(`[bash] Ausführen (simuliert)…`,'bts');
  const lines=code.split('\n');
  for(const line of lines){
    const t=line.trim();
    if(!t||t.startsWith('#')||t==='#!/bin/bash')continue;
    // Variable assignment
    const vm=t.match(/^([A-Z_a-z]\w*)=(?:\$\((.+)\)|"?([^"]*)"?)$/);
    if(vm){ if(vm[2]){ vars[vm[1]]='[Befehlsausgabe]'; }else{ vars[vm[1]]=vm[3]||''; } continue; }
    // echo
    const em=t.match(/^echo\s+"?(.+)"?$/);
    if(em){ app(em[1].replace(/\$([A-Z_a-z]\w*)/g,(_,k)=>vars[k]||`$${k}`),'bto'); continue; }
    // if/fi/else/done/for/while
    if(/^(if\s|fi|else|done|for\s|while\s)/.test(t)){ app('  '+t,'bts'); continue; }
    // exit
    if(/^exit\s*\d*/.test(t)){ app(`[Prozess beendet mit Code ${t.match(/\d+/)?.[0]||'0'}]`,'bts'); break; }
    app('  '+t,'bts');
  }
  app('\n[Fertig]','bts');
  out.innerHTML=html;
  out.scrollTop=out.scrollHeight;
}

function bfTermKey(e){
  const inp=document.getElementById('bf-term-inp');
  const out=document.getElementById('bf-term-out');
  if(e.key==='ArrowUp'){ if(bfTermHistIdx<bfTermHistory.length-1){bfTermHistIdx++;inp.value=bfTermHistory[bfTermHistIdx];}return; }
  if(e.key==='ArrowDown'){ if(bfTermHistIdx>0){bfTermHistIdx--;inp.value=bfTermHistory[bfTermHistIdx];}else{bfTermHistIdx=-1;inp.value='';}return; }
  if(e.key!=='Enter')return;
  const cmd=inp.value.trim(); if(!cmd)return;
  bfTermHistory.unshift(cmd); bfTermHistIdx=-1; inp.value='';
  out.innerHTML+='<span style="color:#a855f7">$ '+bfEsc(cmd)+'</span>\n';
  const c=cmd.toLowerCase();
  let r='';
  if(c==='clear'){out.innerHTML='';return;}
  else if(c.startsWith('echo '))r=cmd.slice(5).replace(/"/g,'');
  else if(c==='ls'||c==='dir')r='datei1.sh  datei2.sh  backup/';
  else if(c==='pwd')r='/home/user/scripts';
  else if(c==='whoami')r='user';
  else if(c==='date')r=new Date().toString();
  else if(c==='uname -a')r='Linux simterm 5.15.0 x86_64 GNU/Linux';
  else if(c==='help')r='Verfügbar: echo, ls, pwd, whoami, date, uname, clear, help';
  else r=`bash: ${cmd.split(' ')[0]}: Befehl nicht gefunden`;
  if(r)out.innerHTML+='<span class="bto">'+bfEsc(r)+'</span>\n';
  out.scrollTop=out.scrollHeight;
}
function bfShowToast(msg){ const t=document.getElementById('bf-toast'); t.textContent=msg; t.classList.add('bf-show'); setTimeout(()=>t.classList.remove('bf-show'),2200); }
function bfEsc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function bfLoadExample(){
  bfClear();
  const add=(t,x,y,data)=>{ bfAddBlock(t,x,y); const b=bfBlocks[bfBlocks.length-1]; if(data)Object.assign(b.data,data); bfUpdatePrev(b.id); return b; };
  const b1=add('start',55,30);
  const b2=add('var',55,145,{name:'SCHWELLE',value:'80'});
  const b3=add('cmd',55,265,{command:"df / | awk 'NR==2 {print $5}' | tr -d '%'",save_to:'NUTZUNG'});
  const b4=add('if',55,395,{left:'$NUTZUNG',op:'-gt (>)',right:'$SCHWELLE'});
  const b5=add('echo',320,510,{message:'WARNUNG: Disk-Nutzung bei $NUTZUNG%!'});
  const b6=add('end',55,610);
  setTimeout(()=>{
    bfConns.push({from:b1.id,fromPort:'out',to:b2.id});
    bfConns.push({from:b2.id,fromPort:'out',to:b3.id});
    bfConns.push({from:b3.id,fromPort:'out',to:b4.id});
    bfConns.push({from:b4.id,fromPort:'yes',to:b5.id});
    bfConns.push({from:b5.id,fromPort:'out',to:b6.id});
    bfConns.push({from:b4.id,fromPort:'no', to:b6.id});
    bfRenderConns(); bfGenCode(); bfShowToast('Beispiel geladen!');
  },100);
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ bfConnFrom=null; bfRemoveTempLine(); } });

// Auto-init
window.addEventListener('load', () => {
  bfRenderConns();
  bfGenCode();
});
</script>
