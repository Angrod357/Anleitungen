/* ============================================================
   18. SUCHE — Lokal (Synonyme + Fuzzy) & KI-gestützt
   ============================================================ */
const SYNONYMS = [
  ['passwort','kennwort','zugang','login','anmeldung','credentials'],
  ['zurücksetzen','reset','neu einrichten','zurückgesetzt','neu vergeben'],
  ['netzwerk','lan','wlan','verbindung','internet','ethernet'],
  ['drucker','printer','druckerwarteschlange','ausdruck'],
  ['e-mail','email','mail','outlook','postfach'],
  ['installieren','installation','einrichten','setup','bereitstellen'],
  ['deinstallieren','entfernen','löschen','deaktivieren'],
  ['fehler','problem','störung','bug','fehlermeldung','absturz'],
  ['neustart','neu starten','reboot','restart','herunterfahren'],
  ['backup','sicherung','datensicherung','wiederherstellung'],
  ['aktualisieren','update','updaten','patch','upgrade'],
  ['sperren','blockieren','gesperrt','lock','deaktiviert'],
  ['konto','account','benutzerkonto','benutzer','profil'],
  ['vpn','fernzugriff','remote','remotedesktop','homeoffice'],
  ['berechtigung','rechte','zugriffsrechte','freigabe','admin','administrator'],
  ['festplatte','speicher','laufwerk','speicherplatz'],
  ['bildschirm','monitor','display','anzeige'],
  ['tastatur','maus','peripherie'],
  ['software','programm','anwendung','app'],
  ['hardware','gerät','geräte'],
  ['langsam','performance','leistung','träge'],
  ['virus','malware','sicherheit','antivirus'],
  ['browser','chrome','edge','firefox'],
  ['synchronisieren','sync','abgleich'],
  ['lizenz','aktivierung','key','produktschlüssel'],
];
function expandTerms(tokens){
  const out = new Set(tokens);
  tokens.forEach(t=>{
    SYNONYMS.forEach(group=>{
      if(group.some(g=> g===t || g.includes(t) || t.includes(g))) group.forEach(g=> out.add(g));
    });
  });
  return out;
}
function tokenize(str){
  return (str||'').toLowerCase().replace(/[.,;:!?()"„“”‚'/\\_\-–—]/g,' ').split(/\s+/).filter(w=> w.length>1);
}
function buildSearchIndex(){
  const docs = loadAllDocs();
  const entries = [];
  Object.values(docs).forEach(doc=>{
    let currentHeading = '';
    (doc.blocks||[]).forEach(b=>{
      let text = '';
      if(b.type==='heading'){ text = b.text||''; currentHeading = text; }
      else if(b.type==='text'||b.type==='info'||b.type==='warning'){ text = plainText(b.html); }
      else if(b.type==='code'){ text = (b.label?b.label+' ':'')+(b.text||''); }
      else if(b.type==='image'){ text = b.caption||''; }
      if(!text.trim()) return;
      entries.push({ docId:doc.id, docTitle:doc.title||'Ohne Titel', blockId:b.id, blockType:b.type, text, isHeading:b.type==='heading' });
    });
  });
  return entries;
}
function buildSnippet(text, tokens){
  const lower = text.toLowerCase();
  let idx=-1, matchLen=0;
  for(const t of tokens){ const i = lower.indexOf(t); if(i!==-1){ idx=i; matchLen=t.length; break; } }
  let snippet;
  if(idx===-1) snippet = text.slice(0,140);
  else{
    const start = Math.max(0, idx-60);
    const end = Math.min(text.length, idx+matchLen+80);
    snippet = (start>0?'… ':'')+text.slice(start,end)+(end<text.length?' …':'');
  }
  let escaped = escapeHtml(snippet);
  tokens.forEach(t=>{
    if(t.length<2) return;
    escaped = escaped.replace(new RegExp('('+escapeRegex(t)+')','gi'), '<mark>$1</mark>');
  });
  return escaped;
}
function localSearch(query, limit){
  limit = limit || 8;
  const qTokensRaw = tokenize(query);
  if(!qTokensRaw.length) return [];
  const qTokens = expandTerms(qTokensRaw);
  const index = buildSearchIndex();
  const qLower = query.toLowerCase().trim();

  const scored = index.map(entry=>{
    const textLower = entry.text.toLowerCase();
    let score = 0, matchedSynonym = null;
    if(qLower.length>2 && textLower.includes(qLower)) score += 12;
    const entryTokens = tokenize(entry.text);
    qTokens.forEach(qt=>{
      if(textLower.includes(qt)){
        score += qTokensRaw.includes(qt) ? 4 : 2.2;
        if(!qTokensRaw.includes(qt) && !matchedSynonym) matchedSynonym = qt;
      } else if(qt.length>=4){
        for(const et of entryTokens){
          if(et.length>=4 && Math.abs(et.length-qt.length)<=2 && levenshtein(qt,et)<=1){ score += 1.3; break; }
        }
      }
    });
    if(entry.isHeading) score *= 1.6;
    return { entry, score, matchedSynonym };
  }).filter(r=> r.score>0).sort((a,b)=> b.score-a.score).slice(0, limit);

  return scored.map(r=>{
    const { entry, matchedSynonym } = r;
    const origQuery = qTokensRaw.find(t=> entry.text.toLowerCase().includes(t));
    let reason;
    if(matchedSynonym && !origQuery) reason = `Gefunden über verwandten Begriff „${matchedSynonym}“.`;
    else if(entry.isHeading) reason = 'Treffer in der Überschrift.';
    else reason = 'Volltext-Treffer im Baustein-Inhalt.';
    return { docId:entry.docId, docTitle:entry.docTitle, blockId:entry.blockId, blockType:entry.blockType,
      snippet: buildSnippet(entry.text, qTokensRaw), reason, mode:'local' };
  });
}
async function aiSearch(query){
  const index = buildSearchIndex();
  if(!index.length) return [];
  const compact = index.slice(0,400).map((e,i)=>({ i, doc:e.docTitle, typ:e.blockType, txt: e.text.length>320?e.text.slice(0,320)+'…':e.text }));
  const sys = `Du bist die semantische Suche in "dokubau", einem Werkzeug für IT-Support-Dokumentation.
Du bekommst eine Liste von Text-Bausteinen aus mehreren Anleitungen (jeweils mit Index "i") sowie eine Suchanfrage in natürlicher Sprache.
Finde die relevantesten Treffer — auch wenn die exakten Wörter nicht vorkommen, aber der Inhalt sinngemäss passt.
Antworte AUSSCHLIESSLICH mit kompaktem JSON, ohne Markdown-Codeblock, in diesem Format:
{"results":[{"i":<index>,"reason":"<einsatziger Grund auf Deutsch, max 15 Wörter>"}]}
Maximal 6 Treffer, nach Relevanz sortiert. Wenn nichts passt: {"results":[]}`;
  const userMsg = `Suchanfrage: "${query}"\n\nBausteine:\n${JSON.stringify(compact)}`;

  const controller = new AbortController();
  const timeoutId = setTimeout(()=> controller.abort(), 15000);
  let resp;
  try{
    resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', signal: controller.signal,
      headers:{
        'Content-Type':'application/json',
        'x-api-key': settings.apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1000, system:sys, messages:[{role:'user', content:userMsg}] }),
    });
  } finally { clearTimeout(timeoutId); }

  if(!resp.ok){
    const errText = await resp.text().catch(()=> '');
    throw new Error('API-Fehler '+resp.status+' '+errText.slice(0,200));
  }
  const data = await resp.json();
  const textBlock = (data.content||[]).find(c=>c.type==='text');
  if(!textBlock) throw new Error('Keine Antwort erhalten');
  let clean = textBlock.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const parsed = JSON.parse(clean);
  return (parsed.results||[]).map(r=>{
    const entry = compact[r.i] ? index[r.i] : null;
    if(!entry) return null;
    return { docId:entry.docId, docTitle:entry.docTitle, blockId:entry.blockId, blockType:entry.blockType,
      snippet: escapeHtml(entry.text.slice(0,180))+(entry.text.length>180?' …':''), reason:r.reason||'', mode:'ai' };
  }).filter(Boolean);
}

function openSearchModal(initialQuery){
  const root = document.getElementById('modalRoot');
  const useAI = settings.aiSearchEnabled && settings.apiKey;
  root.innerHTML = `
  <div class="overlay" id="searchOverlay">
    <div class="modal modal-md search-modal">

      </div>
      <div class="modal-body">
        <div class="search-input-row">
          ${icon('search')}
          <input type="text" id="searchModalInput" placeholder="z. B. „Wie setze ich XY zurück?“" value="${escapeHtml(initialQuery||'')}" />
          <span class="search-mode-badge ${useAI?'badge-ai':'badge-local'}" id="searchModeBadge">${useAI? icon('sparkle')+' KI-Suche' : '🔍 Volltextsuche'}</span>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
  </div>`;
  document.getElementById('searchClose').addEventListener('click', closeModal);
  document.getElementById('searchOverlay').addEventListener('click', e=>{ if(e.target.id==='searchOverlay') closeModal(); });
  const input = document.getElementById('searchModalInput');
  input.addEventListener('input', ()=>{
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(()=> runSearch(input.value), 320);
  });
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
  if(initialQuery) runSearch(initialQuery);
  else document.getElementById('searchResults').innerHTML = `<div class="search-status">Tippe eine Frage oder Stichwörter ein — es wird über alle gespeicherten Anleitungen gesucht.</div>`;
}
async function runSearch(query){
  const resultsEl = document.getElementById('searchResults');
  if(!resultsEl) return;
  if(!query || !query.trim()){ resultsEl.innerHTML = `<div class="search-status">Tippe eine Frage oder Stichwörter ein.</div>`; return; }
  const useAI = settings.aiSearchEnabled && settings.apiKey;
  if(useAI){
    resultsEl.innerHTML = `<div class="search-status"><div class="spinner"></div>KI durchsucht alle Anleitungen …</div>`;
    try{
      const results = await aiSearch(query.trim());
      if(!document.getElementById('searchModalInput')) return;
      renderSearchResults(results.length ? results : localSearch(query.trim()), results.length===0);
    }catch(err){
      console.warn('KI-Suche fehlgeschlagen, Fallback auf Volltextsuche:', err);
      if(!document.getElementById('searchModalInput')) return;
      const badge = document.getElementById('searchModeBadge');
      if(badge){ badge.className='search-mode-badge badge-local'; badge.textContent='🔍 Volltextsuche (Fallback)'; }
      renderSearchResults(localSearch(query.trim()));
    }
  } else {
    renderSearchResults(localSearch(query.trim()));
  }
}
function renderSearchResults(results, noAiHitsFallback){
  const el = document.getElementById('searchResults');
  if(!el) return;
  if(!results.length){ el.innerHTML = `<div class="search-status">Keine Treffer gefunden. Versuch andere Begriffe oder prüfe die Schreibweise.</div>`; return; }
  el.innerHTML = (noAiHitsFallback ? `<div class="field-hint" style="padding:6px 14px 10px">KI fand keine eindeutigen Treffer — hier die Volltext-Ergebnisse:</div>` : '')
    + results.map(r=>`
    <div class="result-item" data-doc="${r.docId}" data-block="${r.blockId}">
      <div class="result-head">
        <span class="result-doc">${escapeHtml(r.docTitle)}</span>
        <span class="result-type">${BLOCK_LABELS[r.blockType]||r.blockType}</span>
      </div>
      <div class="result-snippet">${r.snippet}</div>
      ${r.reason ? `<div class="result-reason">${icon(r.mode==='ai'?'sparkle':'bulb')}${escapeHtml(r.reason)}</div>` : ''}
    </div>`).join('');
  el.querySelectorAll('.result-item').forEach(item=>{
    item.addEventListener('click', ()=>{ openDocFromSearch(item.dataset.doc, item.dataset.block); closeModal(); });
  });
}
function openDocFromSearch(docId, blockId){
  const needsSwitch = !state.doc || state.doc.id!==docId;
  if(needsSwitch){
    const target = loadAllDocs()[docId];
    if(!target){ toast('err','Dokument nicht gefunden.'); return; }
    openDoc(target);
  }
  setTimeout(()=> jumpToBlockId(blockId), needsSwitch ? 250 : 50);
}

      <div class="modal-header">
        <h2>${icon('sparkle')} Einstellungen</h2>
        <button class="modal-close" id="settingsClose">${icon('close')}</button>
      </div>
      <div class="modal-body">
        <div style="font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-faint);margin-bottom:8px">KI-Suche</div>
        <div class="toggle-row">
          <div>
            <div style="font-weight:600;font-size:13.5px;color:#fff">KI-gestützte Suche aktivieren</div>
            <div class="field-hint" style="margin-top:2px">Findet Treffer auch ohne exakte Suchbegriffe. Ohne aktivierte KI-Suche (oder falls sie fehlschlägt) wird automatisch die lokale Volltextsuche verwendet.</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="aiToggle" ${settings.aiSearchEnabled?'checked':''}>
            <span class="track"><span class="thumb"></span></span>
          </label>
        </div>
        <div class="field-group" style="margin-top:14px">
          <label class="field-label" for="apiKeyInput">Anthropic API-Key (eigener Key)</label>
          <input type="password" class="text-input" id="apiKeyInput" placeholder="sk-ant-…" value="${escapeHtml(settings.apiKey||'')}" autocomplete="off">
          <div class="field-hint">Der Key wird ausschliesslich lokal in diesem Browser gespeichert (localStorage) und nur direkt an <code>api.anthropic.com</code> gesendet — nie an einen anderen Server. Da dieses Tool eine reine Offline-Datei ohne Backend ist, liegt der Key clientseitig vor: Nutze diese Funktion nur auf einem vertrauenswürdigen Gerät, nicht in einer geteilten Kopie der Datei. Ohne Key, ohne Internetzugang oder bei Firewall-Einschränkungen greift automatisch die lokale Suche.</div>
        </div>

        <div class="menu-sep" style="margin:20px 2px 16px"></div>
        <div style="font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-faint);margin-bottom:8px">Cloud-Sync (geräteübergreifend)</div>
        <div class="toggle-row">
          <div>
            <div style="font-weight:600;font-size:13.5px;color:#fff">Cloud-Sync aktivieren</div>
            <div class="field-hint" style="margin-top:2px">Speichert alle Anleitungen zusätzlich in einer kostenlosen Firebase-Datenbank, damit sie auf jedem Gerät abrufbar sind. Lokal funktioniert dokubau weiterhin genauso ohne diese Funktion.</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="cloudToggle" ${settings.cloudSyncEnabled?'checked':''}>
            <span class="track"><span class="thumb"></span></span>
          </label>
        </div>
        <div class="field-group" style="margin-top:14px">
          <label class="field-label" for="firebaseProjectIdInput">Firebase-Projekt-ID</label>
          <input type="text" class="text-input" id="firebaseProjectIdInput" placeholder="z. B. mein-dokubau-12345" value="${escapeHtml(settings.firebaseProjectId||'')}" autocomplete="off">
          <div class="field-hint">Benötigt ein <b>eigenes, kostenloses</b> Firebase-Projekt (Google-Konto, wenige Minuten Einrichtung) — Anleitung dazu im Chat. <b>Wichtig:</b> Bei einfacher Einrichtung ohne Login kann jeder mit dieser Projekt-ID mitlesen/schreiben — Projekt-ID wie ein Passwort behandeln und diese konfigurierte Datei nicht mit Unbekannten teilen. Synchronisation braucht eine Internetverbindung; offline wird weiterhin lokal gespeichert und beim nächsten Online-Sein automatisch nachgeglichen.</div>
        </div>
        <button class="nav-manage-btn" id="settingsSyncNowBtn" style="margin-top:2px">${icon('jump')} Jetzt synchronisieren</button>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="settingsCancel">Abbrechen</button>
        <button class="btn btn-primary" id="settingsSave">${icon('check')} Speichern</button>
      </div>
    </div>
  </div>`;
  document.getElementById('settingsClose').addEventListener('click', closeModal);
  document.getElementById('settingsCancel').addEventListener('click', closeModal);
  document.getElementById('settingsOverlay').addEventListener('click', e=>{ if(e.target.id==='settingsOverlay') closeModal(); });
  document.getElementById('settingsSyncNowBtn').addEventListener('click', ()=>{
    settings.cloudSyncEnabled = document.getElementById('cloudToggle').checked;
    settings.firebaseProjectId = document.getElementById('firebaseProjectIdInput').value.trim();
    saveSettings();
    if(!cloudSyncReady()){ toast('info','Bitte zuerst Projekt-ID eintragen und aktivieren.'); return; }
    syncWithCloud(true);
  });
  document.getElementById('settingsSave').addEventListener('click', ()=>{
    settings.aiSearchEnabled = document.getElementById('aiToggle').checked;
    settings.apiKey = document.getElementById('apiKeyInput').value.trim();
    const wasCloudReady = cloudSyncReady();
    settings.cloudSyncEnabled = document.getElementById('cloudToggle').checked;
    settings.firebaseProjectId = document.getElementById('firebaseProjectIdInput').value.trim();
    saveSettings(); closeModal(); toast('ok','Einstellungen gespeichert.');
    if(cloudSyncReady() && !wasCloudReady) syncWithCloud(true);
    else setSyncStatus(cloudSyncReady() ? 'ok' : 'off');
  });
}

/* ============================================================
   21. DOKUMENTE-MANAGER
   ============================================================ */
function openDocsModal(){
  const root = document.getElementById('modalRoot');
  const docs = Object.values(loadAllDocs()).sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0));
  root.innerHTML = `
  <div class="overlay" id="docsOverlay">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h2>${icon('duplicate')} Dokumente</h2>
        <button class="modal-close" id="docsClose">${icon('close')}</button>
      </div>
      <div class="modal-body">
        ${docs.length ? `<div class="doc-list" id="docListEl"></div>` : `<div class="sidebar-empty">Noch keine gespeicherten Anleitungen. Vergib oben einen Titel und klicke „Speichern“.</div>`}
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="docsNewBtn">${icon('plus')} Neue Anleitung</button>
      </div>
    </div>
  </div>`;
  if(docs.length){
    const listEl = document.getElementById('docListEl');
    listEl.innerHTML = docs.map(d=>{
      const n = (d.blocks||[]).length;
      const isCurrent = state.doc && state.doc.id===d.id;
      return `<div class="doc-list-item ${isCurrent?'current':''}" data-id="${d.id}">
        <div class="dli-main">
          <div class="dli-title">${escapeHtml(d.title)||'Ohne Titel'}${isCurrent?' <span style="color:var(--glow);font-family:var(--font-mono);font-size:10px">· offen</span>':''}</div>
          <div class="dli-sub">v${escapeHtml(d.version||'1.0')} · ${formatDateDisplay(d.date)} · ${n} Baustein${n===1?'':'e'}</div>
        </div>
        <div class="dli-actions">
          <button data-act="open" title="Öffnen">${icon('jump')}</button>
          <button data-act="dup" title="Duplizieren">${icon('duplicate')}</button>
          <button data-act="del" class="danger" title="Löschen">${icon('trash')}</button>
        </div>
      </div>`;
    }).join('');
    listEl.addEventListener('click', e=>{
      const item = e.target.closest('.doc-list-item');
      if(!item) return;
      const id = item.dataset.id;
      const actBtn = e.target.closest('[data-act]');
      const docs2 = loadAllDocs();
      if(!actBtn || actBtn.dataset.act==='open'){ openDoc(docs2[id]); closeModal(); return; }
      if(actBtn.dataset.act==='dup'){
        const copy = JSON.parse(JSON.stringify(docs2[id]));
        copy.id = uid(); copy.title = (copy.title||'Ohne Titel')+' (Kopie)'; copy.updatedAt = Date.now();
        const all = loadAllDocs(); all[copy.id]=copy; saveAllDocs(all);
        openDocsModal(); toast('ok','Anleitung dupliziert.');
      }
      if(actBtn.dataset.act==='del'){
        const delTitle = docs2[id].title||'Ohne Titel';
        confirmAction(`„${delTitle}“ wirklich löschen? Das kann nicht rückgängig gemacht werden.`, 'Löschen', ()=>{
          const all = loadAllDocs(); delete all[id]; saveAllDocs(all);
          collapsedDocIds.delete(id); saveCollapsedDocs();
          if(cloudSyncReady()) cloudDeleteDoc(id);
          if(state.doc && state.doc.id===id) openDoc(createBlankDoc());
          openDocsModal(); toast('ok','Anleitung gelöscht.');
        });
      }
    });
  }
  document.getElementById('docsClose').addEventListener('click', closeModal);
  document.getElementById('docsOverlay').addEventListener('click', e=>{ if(e.target.id==='docsOverlay') closeModal(); });
  document.getElementById('docsNewBtn').addEventListener('click', ()=>{ openDoc(createBlankDoc()); closeModal(); toast('info','Neue Anleitung angelegt.'); });
}

/* ============================================================
   22. BEISPIEL-DOKUMENT (nur beim allerersten Start)
   ============================================================ */
function buildSampleDoc(){
  const doc = createBlankDoc();
  doc.title = 'Beispiel: Passwort eines Benutzerkontos zurücksetzen';
  const B = (type, props) => Object.assign(makeBlock(type), props);
  doc.blocks = [
    B('heading', { level:1, text:'Passwort eines Benutzerkontos zurücksetzen' }),
    B('text', { html:'<p>Diese Anleitung zeigt, wie du als <b>ICT-Supporter</b> das Passwort eines Active-Directory-Benutzerkontos zurücksetzt. <i>Geschätzte Dauer: 5 Minuten.</i></p>' }),
    B('heading', { level:2, text:'Voraussetzungen' }),
    B('text', { html:'<ul><li>Zugriff auf Active Directory Users and Computers (ADUC)</li><li>Administrative Berechtigung</li><li>Identität des Benutzers wurde verifiziert</li></ul>' }),
    B('info', { html:'Dies ist ein <b>Hinweis-Baustein</b> — nutze ihn für Tipps und ergänzende Informationen, die visuell hervorgehoben werden sollen.' }),
    B('heading', { level:2, text:'Schritt-für-Schritt' }),
    B('heading', { level:3, text:'1. ADUC öffnen' }),
    B('text', { html:'<p>Öffne <b>Active Directory Users and Computers</b> auf dem Domain-Controller oder über RSAT.</p>' }),
    B('heading', { level:3, text:'2. Benutzer suchen und zurücksetzen' }),
    B('text', { html:'<p>Rechtsklick auf den Benutzer → <b>„Kennwort zurücksetzen…“</b> → neues temporäres Passwort vergeben.</p>' }),
    B('code', { label:'PowerShell (Alternative)', text:'Set-ADAccountPassword -Identity "mmuster" -Reset -NewPassword (ConvertTo-SecureString "Temp1234!" -AsPlainText -Force)\nSet-ADUser -Identity "mmuster" -ChangePasswordAtLogon $true' }),
    B('warning', { html:'Setze immer die Option <b>„Benutzer muss Kennwort bei der nächsten Anmeldung ändern“</b>. Teile das temporäre Passwort niemals per unverschlüsselter E-Mail mit.' }),
    B('image', {}),
    B('heading', { level:2, text:'Kontrolle' }),
    B('text', { html:'<p>Bitte den Benutzer, sich testweise anzumelden und das Passwort zu ändern. Dokumentiere den Vorgang im Ticket-System.</p>' }),
  ];
  return doc;
}

/* ============================================================
   23. INIT
   ============================================================ */
function init(){
  try{ document.execCommand('defaultParagraphSeparator', false, 'p'); }catch(e){}
  loadSettings();
  loadCollapsedDocs();
  ensureHiddenImageInput();
  renderBlockToolbar();
  wireCanvasEvents();
  wireHeader();

  const docs = loadAllDocs();
  const lastId = localStorage.getItem(LS_LAST);
  let startDoc;
  if(lastId && docs[lastId]) startDoc = docs[lastId];
  else if(Object.keys(docs).length) startDoc = Object.values(docs).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
  else{
    startDoc = buildSampleDoc();
    const all = loadAllDocs(); all[startDoc.id] = startDoc; saveAllDocs(all);
  }
  openDoc(startDoc);
  setSidebarTab('toc');
  setSyncStatus(cloudSyncReady() ? 'syncing' : 'off');
  if(cloudSyncReady()) syncWithCloud(false); // im Hintergrund; App startet sofort mit lokalem Stand
}
document.addEventListener('DOMContentLoaded', init);

})();
</script>
