<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocuTool — IT Dokumentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0c0018;
  --surface: rgba(20,0,45,0.85);
  --surface2:#221f35;
  --border:  rgba(168,85,247,0.2);
  --border2: rgba(168,85,247,0.35);
  --purple:  #6d28d9;
  --purple2: #c084fc;
  --purple3: #7c3aed;
  --text:    #e2d9f3;
  --muted:   rgba(192,132,252,0.5);
  --green:   #34d399;
  --red:     #f87171;
  --cyan:    #38bdf8;
  --yellow:  #fbbf24;
  --mono:    'IBM Plex Mono', monospace;
  --sans:    'IBM Plex Sans', sans-serif;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
}

/* Make the docutool section fill the full viewport */
#docutool {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
}

/* Scrollbars */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(168,85,247,0.55); }


        /* ══ DOCUTOOL – Lila Glow Glass ══ */
        #docutool { height: calc(100vh - 60px); }
        #docutool.active { display: flex; flex-direction: column; }

        .dg-wrap {
          flex: 1; display: flex; overflow: hidden;
          background: #0c0018;
          font-family: 'IBM Plex Sans', sans-serif;
        }

        /* ── Sidebar ── */
        .dg-sidebar {
          width: 220px; min-width: 220px; flex-shrink: 0;
          display: flex; flex-direction: column;
          background: rgba(20, 0, 45, 0.85);
          border-right: 1px solid rgba(168, 85, 247, 0.2);
          backdrop-filter: blur(12px);
          height: 100%; overflow: hidden;
          transition: width .25s ease, min-width .25s ease;
        }
        .dg-sidebar.dg-sb-closed {
          width: 0; min-width: 0;
          border-right: none;
        }
        .dg-sidebar.dg-sb-closed > * { display: none; }
        .dg-sb-toggle {
          position: absolute; top: 50%; transform: translateY(-50%);
          left: 0; z-index: 10;
          width: 18px; height: 44px;
          background: rgba(124,58,237,0.25);
          border: 1px solid rgba(168,85,247,0.3);
          border-left: none;
          border-radius: 0 8px 8px 0;
          cursor: pointer; display: flex; align-items: center; justify-content: center;
          color: rgba(168,85,247,0.7); font-size: 11px;
          transition: all .2s; backdrop-filter: blur(8px);
        }
        .dg-sb-toggle:hover { background: rgba(124,58,237,0.45); color: #c084fc; width: 22px; }
        .dg-main-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .dg-sb-hdr { padding: 14px 14px 10px; border-bottom: 1px solid rgba(168,85,247,0.15); }
        .dg-logo {
          display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
        }
        .dg-logo-icon {
          width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
          background: linear-gradient(135deg, #7c3aed, #a855f7);
          display: flex; align-items: center; justify-content: center;
          font-size: 14px;
          box-shadow: 0 0 14px rgba(168,85,247,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
        }
        .dg-logo-text {
          font-size: 13px; font-weight: 700; letter-spacing: .02em;
          background: linear-gradient(90deg, #c084fc, #e2d9f3);
          -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .dg-btn-new {
          width: 100%; padding: 8px 12px; border: none; border-radius: 8px;
          background: linear-gradient(135deg, #7c3aed, #6d28d9);
          color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
          display: flex; align-items: center; gap: 6px; justify-content: center;
          box-shadow: 0 0 18px rgba(124,58,237,0.45), inset 0 1px 0 rgba(255,255,255,0.1);
          transition: all .2s;
        }
        .dg-btn-new:hover { box-shadow: 0 0 28px rgba(168,85,247,0.65); transform: translateY(-1px); }
        .dg-search { padding: 8px 12px; border-bottom: 1px solid rgba(168,85,247,0.1); position: relative; }
        .dg-search input {
          width: 100%; padding: 6px 10px 6px 28px;
          background: rgba(124,58,237,0.08); border: 1px solid rgba(168,85,247,0.2);
          border-radius: 7px; color: #e2d9f3; font-size: 12px; outline: none;
          transition: border-color .2s;
        }
        .dg-search input:focus { border-color: rgba(168,85,247,0.5); }
        .dg-search input::placeholder { color: rgba(168,85,247,0.35); }
        .dg-search-ico { position:absolute; left:20px; top:50%; transform:translateY(-50%); color:rgba(168,85,247,0.4); font-size:12px; pointer-events:none; }
        .dg-doc-list { flex: 1; overflow-y: auto; padding: 6px 0; }
        .dg-doc-item {
          padding: 8px 14px; cursor: pointer;
          border-left: 3px solid transparent; transition: all .15s;
        }
        .dg-doc-item:hover { background: rgba(168,85,247,0.07); }
        .dg-doc-item.dg-active {
          background: rgba(168,85,247,0.13);
          border-left-color: #a855f7;
        }
        .dg-doc-name { font-size: 12.5px; font-weight: 500; color: #e2d9f3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .dg-doc-item.dg-active .dg-doc-name { color: #c084fc; }
        .dg-doc-meta { font-size: 10.5px; color: rgba(192,132,252,0.5); margin-top: 1px; }

        /* ── Main ── */
        .dg-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* ── Topbar ── */
        .dg-topbar {
          display: flex; align-items: center; gap: 10px;
          padding: 10px 18px;
          background: rgba(20,0,45,0.9);
          border-bottom: 1px solid rgba(168,85,247,0.18);
          backdrop-filter: blur(12px); flex-shrink: 0; flex-wrap: wrap;
        }
        .dg-vtoggle {
          display: flex; background: rgba(124,58,237,0.1);
          border: 1px solid rgba(168,85,247,0.2); border-radius: 8px; overflow: hidden;
        }
        .dg-vbtn {
          padding: 5px 13px; background: none; border: none;
          color: rgba(192,132,252,0.6); font-size: 11.5px; font-weight: 500;
          cursor: pointer; transition: all .15s;
        }
        .dg-vbtn.dg-von { background: linear-gradient(135deg,#7c3aed,#6d28d9); color: #fff; box-shadow: 0 0 10px rgba(124,58,237,0.4); }
        .dg-topbar-right { display: flex; gap: 6px; align-items: center; margin-left: auto; }
        .dg-status { font-family: 'IBM Plex Mono',monospace; font-size: 10.5px; color: rgba(192,132,252,0.5); }
        .dg-tbtn {
          padding: 5px 11px; border-radius: 7px;
          background: rgba(124,58,237,0.1); border: 1px solid rgba(168,85,247,0.2);
          color: rgba(192,132,252,0.8); font-size: 11.5px; cursor: pointer; transition: all .2s;
        }
        .dg-tbtn:hover { border-color: rgba(168,85,247,0.5); color: #c084fc; box-shadow: 0 0 10px rgba(168,85,247,0.2); }
        .dg-save {
          padding: 5px 14px; border: none; border-radius: 7px;
          background: linear-gradient(135deg,#7c3aed,#6d28d9); color: #fff;
          font-size: 11.5px; font-weight: 600; cursor: pointer; transition: all .2s;
          box-shadow: 0 0 12px rgba(124,58,237,0.35);
        }
        .dg-save:hover { box-shadow: 0 0 20px rgba(168,85,247,0.55); }

        /* ── Pages bar ── */
        .dg-pages-bar {
          display: flex; align-items: center; gap: 6px;
          padding: 8px 18px; flex-shrink: 0;
          background: rgba(12,0,24,0.7);
          border-bottom: 1px solid rgba(168,85,247,0.1);
          overflow-x: auto; flex-wrap: nowrap;
        }
        .dg-page-tab {
          padding: 4px 14px; border-radius: 6px; font-size: 11.5px; font-weight: 500;
          background: rgba(124,58,237,0.08); border: 1px solid rgba(168,85,247,0.18);
          color: rgba(192,132,252,0.6); cursor: pointer; white-space: nowrap;
          transition: all .15s; display: flex; align-items: center; gap: 5px;
        }
        .dg-page-tab:hover { border-color: rgba(168,85,247,0.4); color: #c084fc; }
        .dg-page-tab.dg-page-active {
          background: rgba(124,58,237,0.22); border-color: rgba(168,85,247,0.5);
          color: #c084fc; box-shadow: 0 0 10px rgba(168,85,247,0.2);
        }
        .dg-page-tab-del {
          color: rgba(168,85,247,0.4); font-size: 10px; cursor: pointer; padding: 0 1px;
          transition: color .15s;
        }
        .dg-page-tab-del:hover { color: #f87171; }
        .dg-add-page {
          padding: 4px 10px; border-radius: 6px; font-size: 11.5px;
          background: none; border: 1px dashed rgba(168,85,247,0.25);
          color: rgba(168,85,247,0.5); cursor: pointer; white-space: nowrap; transition: all .15s;
        }
        .dg-add-page:hover { border-color: rgba(168,85,247,0.5); color: #c084fc; }

        /* ── Editor scroll (the grey area around A4) ── */
        .dg-editor-scroll {
          flex: 1; overflow-y: auto; overflow-x: hidden;
          background: radial-gradient(ellipse at 50% 0%, rgba(124,58,237,0.12) 0%, #0c0018 60%);
          padding: 32px 0; display: flex; flex-direction: column; align-items: center;
        }
        .dg-editor-scroll.dg-hidden { display: none; }

        /* ── A4 Sheet — Lila Glow Glass ── */
        .dg-a4 {
          width: 210mm;
          min-height: 297mm;
          background: rgba(255,255,255,0.97);
          border-radius: 4px;
          box-shadow:
            0 0 0 1px rgba(168,85,247,0.3),
            0 0 40px rgba(168,85,247,0.25),
            0 0 80px rgba(124,58,237,0.12),
            0 20px 60px rgba(0,0,0,0.5);
          padding: 20mm 20mm 24mm 25mm;
          color: #1a0535;
          font-family: 'IBM Plex Sans', sans-serif;
          display: flex; flex-direction: column; gap: 0;
          position: relative;
          flex-shrink: 0;
        }

        /* subtle purple glow line at top of A4 */
        .dg-a4::before {
          content: '';
          position: absolute; top: 0; left: 0; right: 0; height: 3px;
          background: linear-gradient(90deg, transparent, #a855f7, #7c3aed, transparent);
          border-radius: 4px 4px 0 0;
        }

        /* ── A4 elements ── */
        .dg-title {
          width: 100%; border: none; outline: none; background: transparent;
          font-size: 22pt; font-weight: 700; color: #2d0b5a;
          border-bottom: 2px solid rgba(124,58,237,0.3);
          padding-bottom: 6px; margin-bottom: 16px;
          font-family: 'IBM Plex Sans', sans-serif;
          transition: border-color .2s;
        }
        .dg-title:focus { border-bottom-color: #7c3aed; }
        .dg-title::placeholder { color: rgba(124,58,237,0.25); }

        .dg-meta-strip {
          display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
          padding-bottom: 12px; border-bottom: 1px solid rgba(124,58,237,0.12);
        }
        .dg-mf { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 90px; }
        .dg-ml { font-size: 7pt; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #7c3aed; }
        .dg-mi {
          border: none; border-bottom: 1px solid rgba(124,58,237,0.18); outline: none;
          font-size: 9pt; color: #2d0b5a; background: transparent;
          padding: 2px 0; font-family: 'IBM Plex Sans', sans-serif; transition: border-color .2s;
        }
        .dg-mi:focus { border-bottom-color: #7c3aed; }
        .dg-mi::placeholder { color: rgba(124,58,237,0.25); }
        .dg-ms {
          border: none; border-bottom: 1px solid rgba(124,58,237,0.18); outline: none;
          font-size: 9pt; color: #2d0b5a; background: transparent;
          padding: 2px 0; font-family: 'IBM Plex Sans', sans-serif; cursor: pointer;
        }
        .dg-ms option { background: #f5f0ff; }

        /* Tags in A4 */
        .dg-tags-wrap {
          display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
          margin-bottom: 16px; min-height: 26px;
        }
        .dg-tag {
          display: inline-flex; align-items: center; gap: 3px;
          padding: 2px 8px; border-radius: 20px; font-size: 8pt;
          background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.25); color: #7c3aed;
        }
        .dg-tag-x { cursor: pointer; color: rgba(124,58,237,0.4); font-size: 9px; }
        .dg-tag-x:hover { color: #dc2626; }
        .dg-tag-inp {
          background: none; border: none; outline: none;
          font-size: 8pt; color: #2d0b5a; min-width: 70px; font-family: 'IBM Plex Sans', sans-serif;
        }
        .dg-tag-inp::placeholder { color: rgba(124,58,237,0.25); }

        /* Sections container */
        .dg-sections { display: flex; flex-direction: column; gap: 12px; flex: 1; }

        /* Block */
        .dg-block {
          border: 1px solid rgba(124,58,237,0.15); border-radius: 6px; overflow: hidden;
          page-break-inside: avoid; transition: border-color .2s;
        }
        .dg-block:hover { border-color: rgba(124,58,237,0.3); }
        .dg-block-hdr {
          display: flex; align-items: center; justify-content: space-between;
          padding: 5px 10px;
          background: rgba(124,58,237,0.05);
          border-bottom: 1px solid rgba(124,58,237,0.1);
        }
        .dg-block-lbl { font-size: 7.5pt; font-weight: 700; color: #7c3aed; letter-spacing: .06em; text-transform: uppercase; }
        .dg-block-del {
          background: none; border: none; color: rgba(124,58,237,0.3); cursor: pointer;
          font-size: 12px; padding: 2px 5px; border-radius: 4px; transition: all .15s;
        }
        .dg-block-del:hover { background: rgba(220,38,38,0.08); color: #dc2626; }
        .dg-block-body { padding: 10px 12px; }

        .dg-sec-title {
          width: 100%; border: none; outline: none; background: transparent;
          font-size: 13pt; font-weight: 700; color: #2d0b5a;
          border-bottom: 1px solid rgba(124,58,237,0.12); padding-bottom: 4px; margin-bottom: 8px;
          font-family: 'IBM Plex Sans', sans-serif;
        }
        .dg-sec-title::placeholder { color: rgba(124,58,237,0.25); }

        .dg-ta {
          width: 100%; border: none; outline: none; background: transparent;
          font-size: 10pt; color: #1a0535; line-height: 1.8;
          resize: none; min-height: 56px; font-family: 'IBM Plex Sans', sans-serif;
        }
        .dg-ta::placeholder { color: rgba(124,58,237,0.25); }

        /* Terminal block */
        .dg-terminal {
          background: #0d001a; border-radius: 6px; overflow: hidden;
          border: 1px solid rgba(124,58,237,0.4); margin-top: 4px;
          box-shadow: 0 0 20px rgba(168,85,247,0.1), inset 0 0 30px rgba(168,85,247,0.03);
        }
        .dg-term-bar {
          display: flex; align-items: center; gap: 6px; padding: 5px 10px;
          background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(124,58,237,0.2);
        }
        .dg-dot { width: 9px; height: 9px; border-radius: 50%; }
        .dg-dot-r { background: #f87171; box-shadow: 0 0 5px rgba(248,113,113,0.5); }
        .dg-dot-y { background: #fbbf24; box-shadow: 0 0 5px rgba(251,191,36,0.5); }
        .dg-dot-g { background: #34d399; box-shadow: 0 0 5px rgba(52,211,153,0.5); }
        .dg-term-title { flex:1; font-size:9pt; color:rgba(168,85,247,0.4); text-align:center; font-family:'IBM Plex Mono',monospace; }
        .dg-copy-btn {
          background: none; border: 1px solid rgba(124,58,237,0.3); border-radius: 4px;
          color: rgba(168,85,247,0.5); font-size: 10px; padding: 2px 7px; cursor: pointer; transition: all .2s;
        }
        .dg-copy-btn:hover { border-color: #a855f7; color: #a855f7; }
        .dg-lbl-inp {
          width: 100%; border: none; border-bottom: 1px solid rgba(124,58,237,0.15); outline: none;
          background: transparent; color: rgba(168,85,247,0.5); font-size: 9pt;
          font-family: 'IBM Plex Mono',monospace; padding: 4px 0; margin-bottom: 4px;
        }
        .dg-lbl-inp::placeholder { color: rgba(124,58,237,0.2); }
        .dg-cmd-row { display: flex; gap: 8px; padding: 8px 12px; align-items: flex-start; }
        .dg-prompt { font-family:'IBM Plex Mono',monospace; font-size:11pt; color:#a855f7; text-shadow:0 0 8px rgba(168,85,247,0.7); flex-shrink:0; padding-top:2px; }
        .dg-cmd-ta {
          flex:1; background:transparent; border:none; outline:none;
          color:#d8b4fe; font-family:'IBM Plex Mono',monospace; font-size:10pt;
          line-height:1.6; resize:none; min-height:22px; caret-color:#a855f7;
        }
        .dg-cmd-ta::placeholder { color:rgba(124,58,237,0.2); }
        .dg-out-wrap { padding:0 12px 8px 34px; }
        .dg-out-lbl { font-size:8pt; color:rgba(52,211,153,0.3); margin-bottom:3px; font-family:'IBM Plex Mono',monospace; }
        .dg-out-ta {
          width:100%; background:transparent; border:none; outline:none;
          color:#86efac; font-family:'IBM Plex Mono',monospace; font-size:9pt;
          line-height:1.6; resize:none; min-height:28px;
        }
        .dg-out-ta::placeholder { color:rgba(52,211,153,0.15); }

        /* Screenshot */
        .dg-sz {
          border: 2px dashed rgba(124,58,237,0.2); border-radius: 6px;
          padding: 20px; text-align: center; cursor: pointer; transition: all .2s;
          position: relative; overflow: hidden; margin-top: 4px;
        }
        .dg-sz:hover { border-color: rgba(124,58,237,0.5); background: rgba(124,58,237,0.03); }
        .dg-sz.has-img { border-style:solid; border-color:rgba(124,58,237,0.25); padding:0; }
        .dg-sz img { max-width:100%; border-radius:4px; display:block; }
        .dg-sz input[type=file] { position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%; }
        .dg-sz-icon { font-size:22px; margin-bottom:5px; opacity:.3; }
        .dg-sz-txt { font-size:9pt; color:rgba(124,58,237,0.5); }
        .dg-caption { width:100%; border:none; border-bottom:1px solid rgba(124,58,237,0.12); outline:none; background:transparent; font-size:8.5pt; color:rgba(124,58,237,0.5); padding:4px 0; margin-top:6px; font-style:italic; }
        .dg-caption::placeholder { color:rgba(124,58,237,0.2); }

        /* Steps */
        .dg-step-row { display:flex; align-items:flex-start; gap:8px; padding:7px 0; border-bottom:1px solid rgba(124,58,237,0.07); }
        .dg-step-row:last-child { border-bottom:none; }
        .dg-step-num { min-width:20px; height:20px; border-radius:50%; flex-shrink:0; background:linear-gradient(135deg,#7c3aed,#6d28d9); display:flex;align-items:center;justify-content:center; font-size:8.5pt; font-weight:700; color:#fff; box-shadow:0 0 8px rgba(124,58,237,0.35); }
        .dg-step-ta { flex:1; border:none; outline:none; background:transparent; font-size:9.5pt; color:#1a0535; line-height:1.65; resize:none; min-height:32px; font-family:'IBM Plex Sans',sans-serif; }
        .dg-step-ta::placeholder { color:rgba(124,58,237,0.25); }

        /* Note */
        .dg-note-info { background:#eff6ff; border-left:3px solid #60a5fa; border-radius:4px; padding:9px 12px; }
        .dg-note-warn { background:#fffbeb; border-left:3px solid #fbbf24; border-radius:4px; padding:9px 12px; }
        .dg-note-ok   { background:#f0fdf4; border-left:3px solid #34d399; border-radius:4px; padding:9px 12px; }

        /* Adder */
        .dg-adder { display:flex; gap:7px; flex-wrap:wrap; margin-top:12px; }
        .dg-add-btn {
          padding:5px 12px; background:rgba(124,58,237,0.06); border:1px dashed rgba(124,58,237,0.25);
          border-radius:6px; color:rgba(124,58,237,0.6); font-size:8.5pt; cursor:pointer;
          transition:all .2s; display:flex; align-items:center; gap:4px;
        }
        .dg-add-btn:hover { background:rgba(124,58,237,0.12); border-color:rgba(124,58,237,0.5); color:#7c3aed; box-shadow:0 0 8px rgba(124,58,237,0.15); }

        /* Del */
        .dg-del { background:none; border:none; color:rgba(124,58,237,0.25); cursor:pointer; font-size:11px; padding:2px 4px; border-radius:4px; transition:all .15s; }
        .dg-del:hover { background:rgba(220,38,38,0.08); color:#dc2626; }

        /* Preview */
        .dg-preview-scroll { flex:1; overflow-y:auto; overflow-x:hidden; background:radial-gradient(ellipse at 50% 0%, rgba(124,58,237,0.12) 0%, #0c0018 60%); padding:32px 0; display:none; flex-direction:column; align-items:center; }
        .dg-preview-scroll.dg-prev-on { display:flex; }

        .dg-prev-a4 {
          width:210mm; min-height:297mm; margin-bottom:24px;
          background:rgba(255,255,255,0.97); border-radius:4px;
          box-shadow:0 0 0 1px rgba(168,85,247,0.3),0 0 40px rgba(168,85,247,0.2),0 20px 60px rgba(0,0,0,0.5);
          padding:20mm 20mm 24mm 25mm; color:#1a1a2e;
          font-family:'IBM Plex Sans',sans-serif; position:relative;
        }
        .dg-prev-a4::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,#a855f7,#7c3aed,transparent); border-radius:4px 4px 0 0; }
        .dg-prev-title { font-size:22pt; font-weight:800; color:#2d0b5a; border-bottom:2px solid rgba(124,58,237,0.3); padding-bottom:7px; margin-bottom:12px; }
        .dg-prev-meta { display:flex; gap:16px; flex-wrap:wrap; font-size:9pt; color:#5c4d7a; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid rgba(124,58,237,0.1); }
        .dg-prev-tags { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:14px; }
        .dg-prev-sec-title { font-size:11pt; font-weight:700; color:#7c3aed; text-transform:uppercase; letter-spacing:.06em; margin:14px 0 6px; padding-bottom:3px; border-bottom:1px solid rgba(124,58,237,0.1); }
        .dg-prev-text { font-size:10pt; line-height:1.8; color:#1a0535; white-space:pre-wrap; }
        .dg-prev-cmd { background:#0d001a; border:1px solid rgba(124,58,237,0.35); border-radius:6px; padding:10px 14px; font-family:'IBM Plex Mono',monospace; font-size:9.5pt; color:#d8b4fe; white-space:pre-wrap; margin:4px 0; box-shadow:0 0 16px rgba(168,85,247,0.1); }
        .dg-prev-img { max-width:100%; border-radius:4px; border:1px solid rgba(124,58,237,0.15); margin:4px 0; display:block; }
        .dg-prev-caption { font-size:8pt; color:#9b89c4; margin-top:3px; font-style:italic; }

        /* Page separator in preview */
        .dg-prev-pagesep { width:210mm; text-align:center; padding:16px 0; color:rgba(168,85,247,0.3); font-size:11px; font-family:'IBM Plex Mono',monospace; letter-spacing:.1em; }

        /* Toast */
        #dg-toast { position:fixed;bottom:20px;right:20px;z-index:9999; background:rgba(20,0,45,0.95); border:1px solid rgba(168,85,247,0.5); border-radius:9px; padding:10px 18px; font-size:12px; color:#c084fc; box-shadow:0 0 24px rgba(168,85,247,0.35); transform:translateY(60px);opacity:0; transition:all .3s cubic-bezier(.34,1.56,.64,1); display:flex;align-items:center;gap:7px; pointer-events:none; }
        #dg-toast.dg-toast-on { transform:translateY(0);opacity:1; }

        /* ── Inhaltsverzeichnis ── */
        .dg-toc-a4 {
          width: 210mm; min-height: auto;
          background: rgba(255,255,255,0.97);
          border-radius: 4px;
          box-shadow:
            0 0 0 1px rgba(168,85,247,0.3),
            0 0 40px rgba(168,85,247,0.25),
            0 0 80px rgba(124,58,237,0.12),
            0 20px 60px rgba(0,0,0,0.5);
          padding: 16mm 20mm 18mm 25mm;
          color: #1a0535;
          font-family: 'IBM Plex Sans', sans-serif;
          position: relative; flex-shrink: 0;
          margin-bottom: 24px;
        }
        .dg-toc-a4::before {
          content: '';
          position: absolute; top: 0; left: 0; right: 0; height: 3px;
          background: linear-gradient(90deg, transparent, #a855f7, #7c3aed, transparent);
          border-radius: 4px 4px 0 0;
        }
        .dg-toc-heading {
          font-size: 14pt; font-weight: 700; color: #7c3aed;
          text-transform: uppercase; letter-spacing: .1em;
          margin-bottom: 14px; padding-bottom: 6px;
          border-bottom: 2px solid rgba(124,58,237,0.2);
          display: flex; align-items: center; gap: 8px;
        }
        .dg-toc-entry {
          display: flex; align-items: baseline; gap: 0;
          padding: 5px 0; border-bottom: 1px solid rgba(124,58,237,0.06);
          font-size: 10pt;
        }
        .dg-toc-entry:last-child { border-bottom: none; }
        .dg-toc-entry a {
          color: #2d0b5a; text-decoration: none; font-weight: 500;
          transition: color .15s; white-space: nowrap; overflow: hidden;
          text-overflow: ellipsis; max-width: 70%;
        }
        .dg-toc-entry a:hover { color: #7c3aed; }
        .dg-toc-dots {
          flex: 1; border-bottom: 1px dotted rgba(124,58,237,0.25);
          margin: 0 8px; position: relative; top: -3px;
        }
        .dg-toc-page {
          font-family: 'IBM Plex Mono', monospace; font-size: 9pt;
          color: rgba(124,58,237,0.5); white-space: nowrap;
        }
        .dg-toc-group { margin-bottom: 10px; }
        .dg-toc-group-title {
          font-size: 8pt; font-weight: 700; text-transform: uppercase;
          letter-spacing: .1em; color: rgba(124,58,237,0.4);
          margin: 10px 0 4px;
        }
        .dg-toc-entry.dg-toc-sub { padding-left: 14px; }
        .dg-toc-entry.dg-toc-sub a { font-weight: 400; color: #5c4d7a; font-size: 9.5pt; }

        @media print {
          html, body { background:#ffffff!important; color:#000000!important; }
          body > *:not(#docutool) { display:none!important; }
          #docutool .dg-sidebar, #docutool .dg-sb-toggle,
          .dg-topbar, .dg-pages-bar, #dg-toast { display:none!important; }
          #docutool, .dg-wrap, .dg-main-wrap, .dg-main { display:block!important; height:auto!important; overflow:visible!important; background:#ffffff!important; }
          .dg-editor-scroll { display:none!important; }
          .dg-preview-scroll { display:block!important; overflow:visible!important; background:#ffffff!important; padding:0!important; height:auto!important; }
          .dg-prev-a4, .dg-toc-a4 { box-shadow:none!important; margin:0 auto!important; width:100%!important; background:#ffffff!important; color:#000000!important; page-break-after:always; break-after:page; }
          .dg-prev-a4::before, .dg-toc-a4::before { display:none!important; }
          .dg-prev-pagesep { display:none!important; }
          .dg-prev-text, .dg-prev-sec-title, .dg-prev-title, .dg-prev-meta, .dg-toc-heading, .dg-toc-entry, .dg-toc-entry a, .dg-prev-caption { color:#1a0535!important; }
          .dg-prev-cmd { background:#f3f0ff!important; border:1px solid #c4b5d4!important; color:#2d0b5a!important; }
          .dg-step-row { color:#1a0535!important; }
          .dg-step-num { background:#7c3aed!important; color:#fff!important; }
          * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
        }
      
</style>
</head>
<body>

    <div id="docutool" class="section">

      

      <div class="dg-wrap">

        <!-- SIDEBAR -->
        <div class="dg-sidebar" id="dg-sidebar">
          <div class="dg-sb-hdr">
            <div class="dg-logo">
              <div class="dg-logo-icon">D</div>
              <div class="dg-logo-text">DocuTool</div>
            </div>
            <button class="dg-btn-new" onclick="dgNew()">＋ Neue Anleitung</button>
          </div>
          <div class="dg-search">
            <span class="dg-search-ico">&#x2315;</span>
            <input type="text" id="dg-search" placeholder="Suchen…" oninput="dgFilterDocs()">
          </div>
          <div class="dg-doc-list" id="dg-doc-list"></div>
        </div>

        <!-- MAIN WRAP (for toggle button positioning) -->
        <div class="dg-main-wrap">
          <!-- SIDEBAR TOGGLE -->
          <button class="dg-sb-toggle" id="dg-sb-toggle" onclick="dgToggleSidebar()" title="Ablage ein/ausblenden">‹</button>

        <!-- MAIN -->
        <div class="dg-main">

          <!-- TOPBAR -->
          <div class="dg-topbar">
            <div class="dg-vtoggle">
              <button class="dg-vbtn dg-von" id="dg-btn-ed" onclick="dgSetView('editor')">Editor</button>
              <button class="dg-vbtn" id="dg-btn-pr" onclick="dgSetView('preview')">Vorschau</button>
            </div>
            <label style="display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(192,132,252,0.6);cursor:pointer;user-select:none;">
              <input type="checkbox" id="dg-toc-toggle" checked onchange="dgRenderPreview()" style="accent-color:#7c3aed;width:13px;height:13px;cursor:pointer;">
              Inhaltsverzeichnis
            </label>
            <div class="dg-topbar-right">
              <span class="dg-status" id="dg-status">—</span>
              <button class="dg-tbtn" onclick="dgExport()">Export</button>
              <button class="dg-tbtn" onclick="dgPrint()">Drucken</button>
              <button class="dg-save" onclick="dgSave()">Speichern</button>
            </div>
          </div>

          <!-- PAGES BAR -->
          <div class="dg-pages-bar" id="dg-pages-bar">
            <button class="dg-add-page" onclick="dgAddPage()">＋ Seite</button>
          </div>

          <!-- EDITOR AREA -->
          <div class="dg-editor-scroll" id="dg-editor-scroll">
            <!-- A4 pages rendered here by JS -->
          </div>

          <!-- PREVIEW AREA -->
          <div class="dg-preview-scroll" id="dg-preview-scroll">
            <!-- preview A4 pages rendered here by JS -->
          </div>

        </div><!-- /dg-main -->
        </div><!-- /dg-main-wrap -->
      </div><!-- /dg-wrap -->

      <div id="dg-toast">✅ <span id="dg-toast-msg">Gespeichert!</span></div>

    </div><!-- /docutool -->

<script>
// ══════════════════════════════════
// DOCUTOOL (dg) – Lila Glow Glass
// ══════════════════════════════════
let dgDocs     = JSON.parse(localStorage.getItem('dg_docs') || '[]');
let dgCurrentId = null;
let dgTags     = [];
let dgPages    = [{ id:'p1', title:'Seite 1', sections:[] }];
let dgActivePage = 0;
let dgSecCounter = 0;
let dgTocHidden  = new Set(); // anchors hidden from TOC

// ── Render doc list ──
function dgRenderDocList() {
  const list = document.getElementById('dg-doc-list'); if (!list) return;
  const q = (document.getElementById('dg-search')?.value||'').toLowerCase();
  const filtered = dgDocs.filter(d => (d.title||'').toLowerCase().includes(q));
  list.innerHTML = filtered.length === 0
    ? '<div style="padding:10px 14px;font-size:11px;color:rgba(168,85,247,0.4)">Keine Anleitungen.</div>'
    : filtered.map(d => `<div class="dg-doc-item ${d.id===dgCurrentId?'dg-active':''}" onclick="dgLoad('${d.id}')">
        <div class="dg-doc-name">${dgEsc(d.title||'Ohne Titel')}</div>
        <div class="dg-doc-meta">${d.date||''} · ${d.pages?.length||1} Seite(n)</div>
      </div>`).join('');
}
function dgFilterDocs() { dgRenderDocList(); }

// ── Pages bar ──
function dgRenderPagesBar() {
  const bar = document.getElementById('dg-pages-bar'); if (!bar) return;
  bar.innerHTML = dgPages.map((p,i) => `
    <div class="dg-page-tab ${i===dgActivePage?'dg-page-active':''}" onclick="dgSwitchPage(${i})">
      ${dgEsc(p.title||'Seite '+(i+1))}
      <span class="dg-page-tab-del" onclick="event.stopPropagation();dgDeletePage(${i})">✕</span>
    </div>`).join('') +
    '<button class="dg-add-page" onclick="dgAddPage()">＋ Seite</button>';
}

function dgAddPage() {
  const n = dgPages.length + 1;
  dgPages.push({ id:'p'+Date.now(), title:'Seite '+n, sections:[] });
  dgActivePage = dgPages.length - 1;
  dgRenderPagesBar();
  dgRenderEditor();
  dgMarkUnsaved();
}

function dgDeletePage(idx) {
  if (dgPages.length <= 1) { dgShowToast('Mindestens eine Seite erforderlich.'); return; }
  dgPages.splice(idx, 1);
  if (dgActivePage >= dgPages.length) dgActivePage = dgPages.length - 1;
  dgRenderPagesBar();
  dgRenderEditor();
  dgMarkUnsaved();
}

function dgSwitchPage(idx) {
  dgCollectCurrentPage(); // save before switching
  dgActivePage = idx;
  dgRenderPagesBar();
  dgRenderEditor();
}

// ── Editor ──
function dgRenderEditor() {
  const scroll = document.getElementById('dg-editor-scroll'); if (!scroll) return;
  const page = dgPages[dgActivePage];

  // page title editable in tab — but also on the A4 itself? No — keep it simple
  scroll.innerHTML = '';
  const a4 = document.createElement('div');
  a4.className = 'dg-a4';
  a4.id = 'dg-a4-current';

  // Title
  a4.innerHTML = `
    <input class="dg-title" id="dg-doc-title" type="text" placeholder="Titel der Anleitung…" value="${dgEsc(page._docTitle||document.getElementById('dg-doc-title-hidden')?.value||'')}" oninput="dgMarkUnsaved()">

    <div class="dg-meta-strip">
      <div class="dg-mf"><div class="dg-ml">Autor</div><input class="dg-mi" id="dg-author" type="text" placeholder="Max Muster" value="${dgEsc(page._author||dgPages[0]._author||'')}" oninput="dgMarkUnsaved()"></div>
      <div class="dg-mf"><div class="dg-ml">Datum</div><input class="dg-mi" id="dg-date" type="date" value="${dgEsc(page._date||dgPages[0]._date||new Date().toISOString().split('T')[0])}" oninput="dgMarkUnsaved()"></div>
      <div class="dg-mf"><div class="dg-ml">Version</div><input class="dg-mi" id="dg-version" type="text" placeholder="1.0" value="${dgEsc(page._version||dgPages[0]._version||'')}" oninput="dgMarkUnsaved()"></div>
      <div class="dg-mf"><div class="dg-ml">Kategorie</div>
        <select class="dg-ms" id="dg-cat" onchange="dgMarkUnsaved()">
          <option value="">—</option>
          ${['Netzwerk','Windows Server','Linux / Ubuntu','Sicherheit','Virtualisierung','Skripte','Sonstiges'].map(c=>`<option ${(page._cat||dgPages[0]._cat||'')==c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="dg-mf"><div class="dg-ml">Status</div>
        <select class="dg-ms" id="dg-status-sel" onchange="dgMarkUnsaved()">
          ${['Entwurf','In Review','Abgeschlossen'].map(s=>`<option ${(page._status||dgPages[0]._status||'Entwurf')==s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="dg-tags-wrap" id="dg-tags-wrap">
      ${dgTags.map((t,i)=>`<span class="dg-tag">${dgEsc(t)}<span class="dg-tag-x" onclick="dgRemoveTag(${i})">✕</span></span>`).join('')}
      <input class="dg-tag-inp" id="dg-tag-inp" placeholder="Tag + Enter…" onkeydown="dgAddTag(event)">
    </div>

    <div class="dg-sections" id="dg-sections"></div>

    <div class="dg-adder">
      <button class="dg-add-btn" onclick="dgAddSection('text')">＋ Text</button>
      <button class="dg-add-btn" onclick="dgAddSection('cmd')">＋ Terminal</button>
      <button class="dg-add-btn" onclick="dgAddSection('screenshot')">＋ Screenshot</button>
      <button class="dg-add-btn" onclick="dgAddSection('steps')">＋ Schritte</button>
      <button class="dg-add-btn" onclick="dgAddSection('note')">＋ Hinweis</button>
    </div>`;

  scroll.appendChild(a4);

  // Render existing sections for this page
  dgSecCounter = 0;
  (page.sections||[]).forEach(s => dgAddSection(s.type, s));
}

// ── Collect current page data before switching ──
function dgCollectCurrentPage() {
  const page = dgPages[dgActivePage]; if (!page) return;
  page._docTitle = document.getElementById('dg-doc-title')?.value || '';
  page._author   = document.getElementById('dg-author')?.value || '';
  page._date     = document.getElementById('dg-date')?.value || '';
  page._version  = document.getElementById('dg-version')?.value || '';
  page._cat      = document.getElementById('dg-cat')?.value || '';
  page._status   = document.getElementById('dg-status-sel')?.value || 'Entwurf';
  page.title     = 'Seite ' + (dgActivePage+1);
  page.sections  = dgCollectSections();
}

function dgCollectSections() {
  const secs = [];
  document.querySelectorAll('#dg-sections [data-dg-id]').forEach(el => {
    const type = el.dataset.dgType, id = el.dataset.dgId;
    const s = { type, id };
    if (type==='text') { s.title=el.querySelector('.dg-sec-title')?.value||''; s.content=el.querySelector('.dg-ta')?.value||''; }
    else if (type==='cmd') {
      s.title=el.querySelector('.dg-sec-title')?.value||'';
      s.label=el.querySelector('.dg-lbl-inp')?.value||'';
      s.commands=[...el.querySelectorAll('[data-cmd-row]')].map(row=>({
        cmd: row.querySelector('.dg-cmd-ta')?.value||'',
        out: row.nextElementSibling?.classList.contains('dg-out-wrap') ? row.nextElementSibling.querySelector('.dg-out-ta')?.value||'' : ''
      }));
    }
    else if (type==='screenshot') { s.title=el.querySelector('.dg-sec-title')?.value||''; s.caption=el.querySelector('.dg-caption')?.value||''; s.imgData=el.querySelector('.dg-sz img')?.src||''; }
    else if (type==='steps') { s.title=el.querySelector('.dg-sec-title')?.value||''; s.steps=[...el.querySelectorAll('.dg-step-ta')].map(t=>t.value); }
    else if (type==='note') { s.title=el.querySelector('.dg-sec-title')?.value||''; s.level=el.querySelector('.dg-note-sel')?.value||'info'; s.content=el.querySelector('.dg-ta')?.value||''; }
    secs.push(s);
  });
  return secs;
}

// ── Sections ──
function dgAddSection(type, data={}) {
  const id = data.id||('dg_'+(++dgSecCounter));
  const container = document.getElementById('dg-sections'); if (!container) return;
  const wrap = document.createElement('div');
  wrap.dataset.dgId = id; wrap.dataset.dgType = type; wrap.className = 'dg-block';
  const icons  = {text:'TXT',cmd:'CMD',screenshot:'IMG',steps:'STP',note:'INF'};
  const labels = {text:'Textblock',cmd:'Terminal',screenshot:'Screenshot',steps:'Schritte',note:'Hinweis'};
  let body = '';
  if (type==='text') {
    body=`<div class="dg-block-body"><input class="dg-sec-title" type="text" placeholder="Abschnittstitel…" value="${dgEsc(data.title||'')}" oninput="dgMarkUnsaved()"><textarea class="dg-ta" placeholder="Text…" oninput="dgMarkUnsaved();dgAR(this)">${dgEsc(data.content||'')}</textarea></div>`;
  } else if (type==='cmd') {
    // commands is array of {cmd, out} pairs
    const cmds = data.commands?.length ? data.commands : [{cmd: data.command||'', out: data.output||''}];
    const cmdRowsHtml = cmds.map((c,i) => `
      <div class="dg-cmd-row" data-cmd-row>
        <span class="dg-prompt">$</span>
        <textarea class="dg-cmd-ta" rows="1" placeholder="Befehl…" oninput="dgMarkUnsaved();dgAR(this)">${dgEsc(c.cmd||'')}</textarea>
        <button class="dg-cmd-row-del" onclick="this.closest('[data-cmd-row]').remove();dgMarkUnsaved()" title="Entfernen" style="background:none;border:none;color:rgba(168,85,247,0.3);cursor:pointer;font-size:12px;padding:2px 4px;transition:color .15s;" onmouseover="this.style.color='#f87171'" onmouseout="this.style.color='rgba(168,85,247,0.3)'">✕</button>
      </div>
      ${c.out ? `<div class="dg-out-wrap"><textarea class="dg-out-ta" rows="1" placeholder="Ausgabe…" oninput="dgMarkUnsaved();dgAR(this)">${dgEsc(c.out)}</textarea></div>` : ''}
    `).join('');
    body=`<div class="dg-block-body"><input class="dg-sec-title" type="text" placeholder="Abschnittstitel…" value="${dgEsc(data.title||'')}" oninput="dgMarkUnsaved()">
      <div class="dg-terminal" id="dg-term-${id}">
        <div class="dg-term-bar">
          <div class="dg-dot dg-dot-r"></div><div class="dg-dot dg-dot-y"></div><div class="dg-dot dg-dot-g"></div>
          <div class="dg-term-title" id="dg-tlbl-${id}">${dgEsc(data.label||'Terminal')}</div>
          <button class="dg-copy-btn" onclick="dgCopyAll('${id}')">Kopieren</button>
        </div>
        <div style="padding:4px 12px 0 12px">
          <input class="dg-lbl-inp" type="text" placeholder="Label (z.B. Ubuntu / root)" value="${dgEsc(data.label||'')}" oninput="dgMarkUnsaved();document.getElementById('dg-tlbl-${id}').textContent=this.value||'Terminal'">
        </div>
        <div class="dg-cmd-rows" id="dg-cmd-rows-${id}">${cmdRowsHtml}</div>
        <div style="padding:4px 12px 10px;display:flex;gap:6px;">
          <button onclick="dgAddCmdRow('dg-cmd-rows-${id}')" style="background:none;border:1px dashed rgba(168,85,247,0.25);border-radius:5px;color:rgba(168,85,247,0.5);font-size:10px;padding:3px 10px;cursor:pointer;transition:all .2s;font-family:\'IBM Plex Mono\',monospace;" onmouseover="this.style.borderColor='#a855f7';this.style.color='#c084fc'" onmouseout="this.style.borderColor='rgba(168,85,247,0.25)';this.style.color='rgba(168,85,247,0.5)'">＋ Befehl</button>
          <button onclick="dgAddCmdRowWithOut('dg-cmd-rows-${id}')" style="background:none;border:1px dashed rgba(52,211,153,0.2);border-radius:5px;color:rgba(52,211,153,0.4);font-size:10px;padding:3px 10px;cursor:pointer;transition:all .2s;font-family:\'IBM Plex Mono\',monospace;" onmouseover="this.style.borderColor='#34d399';this.style.color='#34d399'" onmouseout="this.style.borderColor='rgba(52,211,153,0.2)';this.style.color='rgba(52,211,153,0.4)'">＋ Befehl + Ausgabe</button>
        </div>
      </div></div>`;
  } else if (type==='screenshot') {
    body=`<div class="dg-block-body"><input class="dg-sec-title" type="text" placeholder="Abschnittstitel…" value="${dgEsc(data.title||'')}" oninput="dgMarkUnsaved()">
      <div class="dg-sz" id="dg-sz-${id}"><div class="dg-sz-icon">IMG</div><div class="dg-sz-txt">Screenshot hochladen</div><input type="file" accept="image/*" onchange="dgLoadImg('${id}',this)"></div>
      <input class="dg-caption" type="text" placeholder="Bildunterschrift…" value="${dgEsc(data.caption||'')}" oninput="dgMarkUnsaved()"></div>`;
  } else if (type==='steps') {
    const sh=(data.steps?.length?data.steps:['']).map((s,i)=>dgStepRow(i+1,s)).join('');
    body=`<div class="dg-block-body"><input class="dg-sec-title" type="text" placeholder="Abschnittstitel…" value="${dgEsc(data.title||'')}" oninput="dgMarkUnsaved()">
      <div id="dg-sl-${id}">${sh}</div>
      <button class="dg-add-btn" style="margin-top:6px" onclick="dgAddStep('dg-sl-${id}')">＋ Schritt</button></div>`;
  } else if (type==='note') {
    const lvl=data.level||'info';
    body=`<div class="dg-block-body">
      <div style="display:flex;gap:10px;margin-bottom:8px;align-items:flex-end">
        <div style="flex:1"><div class="dg-ml" style="font-size:7pt;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#7c3aed;margin-bottom:3px">Titel</div><input class="dg-mi" style="border:none;border-bottom:1px solid rgba(124,58,237,0.15);outline:none;width:100%;font-size:9pt;color:#2d0b5a;background:transparent;padding:2px 0;" type="text" placeholder="Hinweistitel…" value="${dgEsc(data.title||'')}" oninput="dgMarkUnsaved()"></div>
        <select class="dg-ms" style="border:none;border-bottom:1px solid rgba(124,58,237,0.15);outline:none;font-size:9pt;color:#2d0b5a;background:transparent;padding:2px 0;cursor:pointer;" onchange="dgUpdateNote(this,'${id}')">
          <option value="info" ${lvl==='info'?'selected':''}>ℹ️ Info</option>
          <option value="warn" ${lvl==='warn'?'selected':''}>⚠️ Warnung</option>

        </select>
      </div>
      <div class="dg-note-${lvl}" id="dg-nb-${id}"><textarea class="dg-ta" style="background:transparent" placeholder="Hinweistext…" oninput="dgMarkUnsaved();dgAR(this)">${dgEsc(data.content||'')}</textarea></div>
    </div>`;
  }
  wrap.innerHTML=`<div class="dg-block-hdr"><div class="dg-block-lbl">${icons[type]} ${labels[type]}</div><button class="dg-del" onclick="this.closest('[data-dg-id]').remove();dgMarkUnsaved()">🗑</button></div>${body}`;

function dgStepRow(n,v=''){return`<div class="dg-step-row"><div class="dg-step-num">${n}</div><textarea class="dg-step-ta" placeholder="Schritt…" oninput="dgMarkUnsaved();dgAR(this)">${dgEsc(v)}</textarea><button class="dg-del" onclick="const l=this.closest('[id^=dg-sl]')||this.closest('.dg-block-body').querySelector('[id^=dg-sl]');this.closest('.dg-step-row').remove();l&&l.querySelectorAll('.dg-step-num').forEach((n,i)=>n.textContent=i+1);dgMarkUnsaved()">✕</button></div>`;}
function dgAddStep(listId){const l=document.getElementById(listId);if(!l)return;const n=l.querySelectorAll('.dg-step-row').length+1;l.insertAdjacentHTML('beforeend',dgStepRow(n));dgMarkUnsaved();}
function dgUpdateNote(sel,id){const b=document.getElementById('dg-nb-'+id);if(b){b.className='dg-note-'+sel.value;}dgMarkUnsaved();}

// ── Tags ──
function dgAddTag(e){if(e.key==='Enter'||e.key===','){e.preventDefault();const v=e.target.value.trim().replace(',','');if(v&&!dgTags.includes(v)){dgTags.push(v);dgRefreshTags();}else e.target.value='';}}
function dgRemoveTag(i){dgTags.splice(i,1);dgRefreshTags();}
function dgRefreshTags(){const w=document.getElementById('dg-tags-wrap');if(!w)return;w.innerHTML=dgTags.map((t,i)=>`<span class="dg-tag">${dgEsc(t)}<span class="dg-tag-x" onclick="dgRemoveTag(${i})">✕</span></span>`).join('')+'<input class="dg-tag-inp" id="dg-tag-inp" placeholder="Tag + Enter…" onkeydown="dgAddTag(event)">';}

// ── New / Load / Save ──
function dgNew(){
  dgCurrentId=null; dgTags=[]; dgActivePage=0; dgSecCounter=0; dgTocHidden=new Set();
  dgPages=[{id:'p1',title:'Seite 1',sections:[]}];
  dgMarkUnsaved(); dgRenderPagesBar(); dgRenderEditor(); dgRenderDocList();
}

function dgLoad(id){
  const doc=dgDocs.find(d=>d.id===id);if(!doc)return;
  dgCurrentId=id; dgTags=doc.tags||[]; dgActivePage=0; dgTocHidden=new Set();
  dgPages=doc.pages||[{id:'p1',title:'Seite 1',sections:[]}];
  dgRenderPagesBar(); dgRenderEditor();
  document.getElementById('dg-status').textContent='✔ Gespeichert';
  dgRenderDocList();
}

function dgSave(){
  dgCollectCurrentPage();
  const id=dgCurrentId||Date.now().toString(); dgCurrentId=id;
  const title=document.getElementById('dg-doc-title')?.value||dgPages[0]._docTitle||'Ohne Titel';
  const doc={id,title,tags:[...dgTags],pages:JSON.parse(JSON.stringify(dgPages)),savedAt:new Date().toISOString(),date:document.getElementById('dg-date')?.value||''};
  const i=dgDocs.findIndex(d=>d.id===id);
  if(i>=0)dgDocs[i]=doc;else dgDocs.unshift(doc);
  localStorage.setItem('dg_docs',JSON.stringify(dgDocs));
  document.getElementById('dg-status').textContent='✔ Gespeichert';
  dgRenderDocList(); dgShowToast('Gespeichert!');
}

function dgMarkUnsaved(){
  const s=document.getElementById('dg-status');
  if(s) s.textContent='● Ungespeichert';
  // slight delay so DOM has updated before measuring
  clearTimeout(dgMarkUnsaved._t);
  dgMarkUnsaved._t = setTimeout(dgCheckAutoPage, 300);
}

// ── View ──
function dgSetView(v){
  const es=document.getElementById('dg-editor-scroll');
  const ps=document.getElementById('dg-preview-scroll');
  const be=document.getElementById('dg-btn-ed');
  const bp=document.getElementById('dg-btn-pr');
  if(!es||!ps)return;
  if(v==='editor'){es.classList.remove('dg-hidden');ps.classList.remove('dg-prev-on');be?.classList.add('dg-von');bp?.classList.remove('dg-von');}
  else{dgCollectCurrentPage();es.classList.add('dg-hidden');ps.classList.add('dg-prev-on');be?.classList.remove('dg-von');bp?.classList.add('dg-von');dgRenderPreview();}
}

function dgRenderPreview(){
  const ps=document.getElementById('dg-preview-scroll');if(!ps)return;
  const nc={info:'#eff6ff',warn:'#fffbeb',ok:'#f0fdf4'};
  const nb={info:'#60a5fa',warn:'#fbbf24',ok:'#34d399'};
  const ni={info:'ℹ️',warn:'⚠️',ok:'✅'};
  const icons={text:'',cmd:'',screenshot:'',steps:'',note:''};

  // ── Build flat TOC entries across all pages ──
  const tocEntries = [];
  dgPages.forEach((page, pi) => {
    const pageLabel = page._docTitle || ('Seite ' + (pi+1));
    tocEntries.push({ label: pageLabel, anchor: 'dg-pg-'+pi, pageNum: pi+1, type: 'page' });
    (page.sections||[]).forEach((s,si) => {
      if (s.title) {
        tocEntries.push({
          label: (icons[s.type]||'') + s.title,
          anchor: 'dg-sec-'+pi+'-'+si,
          pageNum: pi+1,
          type: 'section'
        });
      }
    });
  });

  // ── TOC A4 page ──
  const docTitle = dgPages[0]?._docTitle || 'Ohne Titel';
  const showToc = document.getElementById('dg-toc-toggle')?.checked !== false;
  const hasHidden = dgTocHidden.size > 0;
  const visibleEntries = tocEntries.filter(e => !dgTocHidden.has(e.anchor));
  const tocHtml = showToc ? `<div class="dg-toc-a4">
    <div class="dg-toc-heading" style="display:flex;align-items:center;justify-content:space-between;">
      <span>Inhaltsverzeichnis</span>
      ${hasHidden ? `<button onclick="dgTocHidden.clear();dgRenderPreview()" style="font-size:9pt;background:none;border:1px solid rgba(124,58,237,0.3);border-radius:5px;color:rgba(124,58,237,0.6);padding:2px 9px;cursor:pointer;font-family:'IBM Plex Mono',monospace;transition:all .15s;" onmouseover="this.style.color='#7c3aed';this.style.borderColor='#7c3aed'" onmouseout="this.style.color='rgba(124,58,237,0.6)';this.style.borderColor='rgba(124,58,237,0.3)'">Alle einblenden</button>` : ''}
    </div>
    <div style="font-size:8.5pt;color:rgba(124,58,237,0.4);margin-bottom:14px;font-family:'IBM Plex Mono',monospace">${dgEsc(docTitle)}</div>
    ${visibleEntries.map(e => `
      <div class="dg-toc-entry ${e.type==='section'?'dg-toc-sub':''}" style="display:flex;align-items:baseline;gap:0;">
        <a href="#${e.anchor}" style="flex-shrink:0;max-width:60%">${dgEsc(e.label)}</a>
        <span class="dg-toc-dots"></span>
        <span class="dg-toc-page">Seite ${e.pageNum}</span>
        <button onclick="dgTocHidden.add('${e.anchor}');dgRenderPreview()" title="Aus Inhaltsverzeichnis ausblenden" style="margin-left:10px;flex-shrink:0;background:none;border:none;color:rgba(124,58,237,0.25);cursor:pointer;font-size:11px;padding:0 3px;line-height:1;transition:color .15s;" onmouseover="this.style.color='#dc2626'" onmouseout="this.style.color='rgba(124,58,237,0.25)'">✕</button>
      </div>`).join('')}
    ${visibleEntries.length===0?'<div style="color:rgba(124,58,237,0.3);font-size:10pt">Alle Einträge ausgeblendet. <button onclick="dgTocHidden.clear();dgRenderPreview()" style="background:none;border:none;color:#7c3aed;cursor:pointer;font-size:10pt;text-decoration:underline;padding:0">Zurücksetzen</button></div>':''}
  </div>` : '';

  // ── Content pages ──
  const pagesHtml = dgPages.map((page,pi)=>{
    const title = page._docTitle || 'Ohne Titel';
    const secs = (page.sections||[]).map((s,si)=>{
      const anchorId = `dg-sec-${pi}-${si}`;
      const titleHtml = s.title ? `<div class="dg-prev-sec-title" id="${anchorId}">${dgEsc(s.title)}</div>` : '';
      if(s.type==='text')   return titleHtml+`<div class="dg-prev-text">${dgEsc(s.content)}</div>`;
      if(s.type==='cmd') {
        const cmds = s.commands?.length ? s.commands : (s.command ? [{cmd:s.command,out:s.output||''}] : []);
        const cmdLines = cmds.map(c=>'$ '+dgEsc(c.cmd)+(c.out?'\n'+dgEsc(c.out):'')).join('\n');
        return titleHtml+`<div class="dg-prev-cmd">${cmdLines}</div>`;
      }
      if(s.type==='screenshot') return titleHtml+(s.imgData?`<img class="dg-prev-img" src="${s.imgData}">`:'')+(s.caption?`<div class="dg-prev-caption">${dgEsc(s.caption)}</div>`:'');
      if(s.type==='steps')  return titleHtml+(s.steps||[]).map((st,i)=>`<div class="dg-step-row" style="color:#1a0535"><div class="dg-step-num">${i+1}</div><div class="dg-prev-text" style="padding-top:1px">${dgEsc(st)}</div></div>`).join('');
      if(s.type==='note')   return `<div style="background:${nc[s.level]};border-left:3px solid ${nb[s.level]};border-radius:4px;padding:9px 12px;margin:4px 0" id="${anchorId}">${s.title?`<div style="font-weight:700;font-size:10pt;margin-bottom:4px">${ni[s.level]} ${dgEsc(s.title)}</div>`:''}<div class="dg-prev-text" style="font-size:9.5pt">${dgEsc(s.content)}</div></div>`;
      return '';
    }).join('');
    return`<div class="dg-prev-a4" id="dg-pg-${pi}">
      <div class="dg-prev-title">${dgEsc(title)}</div>
      <div class="dg-prev-meta">${[page._author?dgEsc(page._author):'',page._date?page._date:'',page._version?'v'+dgEsc(page._version):'',page._cat?dgEsc(page._cat):''].filter(Boolean).join('&nbsp;&nbsp;·&nbsp;&nbsp;')}</div>
      ${dgTags.length?`<div class="dg-prev-tags">${dgTags.map(t=>`<span class="dg-tag">${dgEsc(t)}</span>`).join('')}</div>`:''}
      ${secs||'<div style="color:rgba(124,58,237,0.3);font-size:10pt">Noch keine Inhalte.</div>'}
    </div>`;
  }).join('<div class="dg-prev-pagesep">— ∙ —</div>');

  ps.innerHTML = (showToc ? tocHtml + '<div class="dg-prev-pagesep">— ∙ —</div>' : '') + pagesHtml;
}

// ── Auto page break ──
// A4 at 96dpi: 297mm ≈ 1122px. We track filled height and auto-split.
const DG_A4_H_PX = 1100; // safe threshold in px before new page
function dgCheckAutoPage() {
  const a4 = document.getElementById('dg-a4-current'); if (!a4) return;
  // if content exceeds A4 height, offer to add new page
  const h = a4.scrollHeight;
  const indicator = document.getElementById('dg-page-overflow-hint');
  if (h > DG_A4_H_PX) {
    if (!indicator) {
      const hint = document.createElement('div');
      hint.id = 'dg-page-overflow-hint';
      hint.style.cssText = 'margin-top:10px;padding:8px 14px;background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.3);border-radius:7px;font-size:10.5pt;color:#c084fc;display:flex;align-items:center;gap:10px;font-family:\'IBM Plex Sans\',sans-serif;';
      hint.innerHTML = '📄 <span>Die Seite ist voll — Inhalt überläuft die A4-Höhe.</span> <button onclick="dgAddPage()" style="margin-left:auto;padding:4px 12px;border:none;border-radius:6px;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;font-size:10pt;cursor:pointer;">＋ Neue Seite</button>';
      a4.appendChild(hint);
    }
  } else if (indicator) {
    indicator.remove();
  }
}
function dgEsc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let sbBlocks = [];          // flat list of block data objects
let sbDragType = null;      // palette drag type

// ── Language helpers ──
const SB_LANG = {

    for:     (v,l) => [`foreach ($${v} in ${l}) {`, '}'],

    func:    (n) => [`function ${n} {`, '}'],

    echo:    (t) => `print("${t}")`,
    cmd:     (c) => `import subprocess\nsubprocess.run("${c}", shell=True)`,
    if:      (c) => [`if ${c}:`, ''],
    elif:    (c) => [`elif ${c}:`],
    else:    ()  => ['else:'],
    for:     (v,l) => [`for ${v} in ${l}:`, ''],
    while:   (c) => [`while ${c}:`, ''],
    func:    (n) => [`def ${n}():`, ''],
    pipe:    (a,b) => `# pipe: ${a} | ${b}`,

    for:     (v,l) => [`FOR %%${v} IN (${l}) DO (`, ')'  ],

    func:    (n) => [`:${n}`, 'GOTO :EOF'],

};

function sbLang() { return document.getElementById('sb-lang')?.value || 'bash'; }

// ── Block data defaults ──
function sbDefaultBlock(type) {
  const id = 'sb_' + (++sbIdCtr);
  const base = { id, type, children: [] };
  const d = {
    cmd:     { ...base, cmd: '' },
    echo:    { ...base, text: '' },
    var:     { ...base, name: 'VAR', value: '' },
    comment: { ...base, text: '' },
    if:      { ...base, cond: '', children: [], elseChildren: [] },
    elif:    { ...base, cond: '' },
    else:    { ...base },
    for:     { ...base, varName: 'i', list: '1 2 3', children: [] },
    while:   { ...base, cond: 'true', children: [] },
    func:    { ...base, name: 'myFunc', children: [] },
    pipe:    { ...base, left: '', right: '' },
    exit:    { ...base, code: '0' },
  };
  return d[type] || base;
}

// ── Palette drag ──
function sbPilDrag(e, type) {
  sbDragType = type;
  sbDragId   = null;
  e.dataTransfer.effectAllowed = 'copy';
  e.dataTransfer.setData('text/plain', type);
}

// ── Canvas drag ──
function sbBlockDragStart(e, id) {
  sbDragId   = id;
  sbDragType = null;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  setTimeout(() => {
    const el = document.querySelector(`[data-sbid="${id}"]`);
    if (el) el.classList.add('sb-cb-drag');
  }, 0);
}

function sbBlockDragEnd(e) {
  document.querySelectorAll('.sb-cb-drag').forEach(el => el.classList.remove('sb-cb-drag'));
  sbDragId = sbDragType = null;
}

function sbCvsDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = sbDragType ? 'copy' : 'move';
  document.getElementById('sb-canvas').classList.add('sb-dz-active');
}
function sbCvsDragLeave(e) {
  if (!document.getElementById('sb-canvas').contains(e.relatedTarget))
    document.getElementById('sb-canvas').classList.remove('sb-dz-active');
}

function sbCvsDrop(e) {
  e.preventDefault();
  document.getElementById('sb-canvas').classList.remove('sb-dz-active');
  if (sbDragType) {
    // from palette → add new block
    const b = sbDefaultBlock(sbDragType);
    // find drop position based on clientY
    const canvas = document.getElementById('sb-canvas');
    const siblings = [...canvas.querySelectorAll(':scope > .sb-cb')];
    let insertBefore = null;
    for (const s of siblings) {
      const r = s.getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) { insertBefore = s.dataset.sbid; break; }
    }
    if (insertBefore) {
      const idx = sbBlocks.findIndex(x => x.id === insertBefore);
      sbBlocks.splice(idx, 0, b);
    } else {
      sbBlocks.push(b);
    }
  } else if (sbDragId) {
    // reorder
    const canvas = document.getElementById('sb-canvas');
    const siblings = [...canvas.querySelectorAll(':scope > .sb-cb')];
    let insertBefore = null;
    for (const s of siblings) {
      if (s.dataset.sbid === sbDragId) continue;
      const r = s.getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) { insertBefore = s.dataset.sbid; break; }
    }
    const fromIdx = sbBlocks.findIndex(x => x.id === sbDragId);
    const [moved] = sbBlocks.splice(fromIdx, 1);
    if (insertBefore) {
      const toIdx = sbBlocks.findIndex(x => x.id === insertBefore);
      sbBlocks.splice(toIdx, 0, moved);
    } else {
      sbBlocks.push(moved);
    }
  }
  sbDragType = sbDragId = null;
  sbRenderCanvas();
  sbUpdateCode();
}

// ── Render canvas ──
function sbRenderCanvas() {
  const canvas = document.getElementById('sb-canvas');
  const empty  = document.getElementById('sb-empty');
  if (!canvas) return;

  // Remove all existing blocks (keep empty div)
  [...canvas.querySelectorAll('.sb-cb')].forEach(el => el.remove());

  if (sbBlocks.length === 0) {
    if (empty) empty.style.display = '';
    return;
  }
  if (empty) empty.style.display = 'none';

  sbBlocks.forEach((b, i) => {
    const el = sbBuildBlockEl(b);
    canvas.appendChild(el);
  });
}

function sbBuildBlockEl(b) {
  const colMap = {
    cmd:'pc', echo:'pe', var:'pv', comment:'pco',
    if:'pi', elif:'pei', else:'pel',
    for:'pf', while:'pw', func:'pfn', pipe:'pp', exit:'px'
  };
  const labelMap = {
    cmd:'Befehl', echo:'Ausgabe', var:'Variable', comment:'Kommentar',
    if:'If', elif:'Elif / ElseIf', else:'Else',
    for:'For', while:'While', func:'Funktion', pipe:'Pipe', exit:'Exit'
  };

  const wrap = document.createElement('div');
  wrap.className = `sb-cb ${colMap[b.type]||'pc'}`;
  wrap.dataset.sbid = b.id;
  wrap.draggable = true;
  wrap.addEventListener('dragstart', e => sbBlockDragStart(e, b.id));
  wrap.addEventListener('dragend',   sbBlockDragEnd);

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'sb-cbh';
  hdr.innerHTML = `<span class="sb-cbt">${labelMap[b.type]||b.type}</span>
    <div class="sb-cba">
      <button class="sb-cbab" onclick="sbMoveBlock('${b.id}',-1)" title="Hoch">↑</button>
      <button class="sb-cbab" onclick="sbMoveBlock('${b.id}',1)"  title="Runter">↓</button>
      <button class="sb-cbab" onclick="sbDeleteBlock('${b.id}')" title="Löschen" style="color:#f87171">✕</button>
    </div>`;
  wrap.appendChild(hdr);

  // Body
  const body = document.createElement('div');
  body.className = 'sb-cbb';
  body.innerHTML = sbBuildBodyHTML(b);
  wrap.appendChild(body);

  // nested children area for if/for/while/func
  if (['if','for','while','func'].includes(b.type)) {
    const nest = document.createElement('div');
    nest.className = 'sb-nested';
    nest.dataset.parentid = b.id;
    nest.innerHTML = `<div class="sb-nested-lbl">INHALT</div>`;
    if (!b.children?.length) {
      nest.innerHTML += `<div class="sb-nested-empty">— Blöcke hierher ziehen —</div>`;
    } else {
      b.children.forEach(ch => {
        const cel = sbBuildBlockEl(ch);
        cel.style.marginBottom = '4px';
        nest.appendChild(cel);
      });
    }
    nest.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); nest.style.borderColor='rgba(168,85,247,.4)'; });
    nest.addEventListener('dragleave', e => { nest.style.borderColor=''; });
    nest.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation();
      nest.style.borderColor='';
      const parentId = nest.dataset.parentid;
      const parent = sbFindBlock(parentId);
      if (!parent) return;
      if (sbDragType) {
        const nb = sbDefaultBlock(sbDragType);
        parent.children = parent.children || [];
        parent.children.push(nb);
      } else if (sbDragId && sbDragId !== parentId) {
        // move from top-level or another parent
        const moved = sbRemoveBlock(sbDragId);
        if (moved) { parent.children = parent.children||[]; parent.children.push(moved); }
      }
      sbDragType=sbDragId=null;
      sbRenderCanvas(); sbUpdateCode();
    });
    body.appendChild(nest);
  }

  // else-children for if
  if (b.type === 'if') {
    const enest = document.createElement('div');
    enest.className = 'sb-nested';
    enest.dataset.parentid = b.id;
    enest.dataset.nesttype = 'else';
    enest.innerHTML = `<div class="sb-nested-lbl">ELSE-INHALT</div>`;
    if (!b.elseChildren?.length) {
      enest.innerHTML += `<div class="sb-nested-empty">— Optional —</div>`;
    } else {
      b.elseChildren.forEach(ch => { const cel=sbBuildBlockEl(ch); cel.style.marginBottom='4px'; enest.appendChild(cel); });
    }
    body.appendChild(enest);
  }

  // Wire inputs to update data
  setTimeout(() => sbWireInputs(wrap, b), 0);
  return wrap;
}

function sbBuildBodyHTML(b) {
  const lang = sbLang();
  const ph = {
    bash:{ cond:'[ $VAR -eq 0 ]', forvar:'i', forlist:'1 2 3', whcond:'true', pipe_l:'ls', pipe_r:'grep txt' },
    powershell:{ cond:'$x -eq 0', forvar:'item', forlist:'$array', whcond:'$true', pipe_l:'Get-Process', pipe_r:'Where-Object' },
    python:{ cond:'x == 0', forvar:'i', forlist:'range(10)', whcond:'True', pipe_l:'cmd', pipe_r:'grep' },
    batch:{ cond:'%VAR%==0', forvar:'F', forlist:'*.txt', whcond:'1==1', pipe_l:'dir', pipe_r:'findstr' },
  }[lang] || {};

  const t = b.type;
  if (t==='cmd')     return `<div class="sb-row"><span class="sb-lbl">Befehl</span><input class="sb-inp sb-d" data-field="cmd"     placeholder="z.B. ls -la" value="${sbEsc(b.cmd||'')}"></div>`;
  if (t==='echo')    return `<div class="sb-row"><span class="sb-lbl">Text</span><input class="sb-inp sb-d" data-field="text"    placeholder="Hallo Welt" value="${sbEsc(b.text||'')}"></div>`;
  if (t==='var')     return `<div class="sb-row"><span class="sb-lbl">Name</span><input class="sb-inp sb-d" data-field="name"    placeholder="VARNAME" value="${sbEsc(b.name||'VAR')}" style="width:90px"></div><div class="sb-row"><span class="sb-lbl">Wert</span><input class="sb-inp sb-d" data-field="value"   placeholder="wert" value="${sbEsc(b.value||'')}"></div>`;
  if (t==='comment') return `<div class="sb-row"><span class="sb-lbl">Text</span><input class="sb-inp sb-d" data-field="text"    placeholder="Kommentar…" value="${sbEsc(b.text||'')}"></div>`;
  if (t==='if'||t==='elif') return `<div class="sb-row"><span class="sb-lbl">Bedingung</span><input class="sb-inp sb-d" data-field="cond"    placeholder="${sbEsc(ph.cond)}" value="${sbEsc(b.cond||'')}"></div>`;
  if (t==='else')    return `<div class="sb-row" style="color:rgba(248,113,113,.5);font-size:10px;padding:2px 0">Else-Block — kein Inhalt nötig</div>`;
  if (t==='for')     return `<div class="sb-row"><span class="sb-lbl">Variable</span><input class="sb-inp sb-d" data-field="varName" placeholder="${sbEsc(ph.forvar)}" value="${sbEsc(b.varName||'i')}" style="width:70px"></div><div class="sb-row"><span class="sb-lbl">Liste</span><input class="sb-inp sb-d" data-field="list"    placeholder="${sbEsc(ph.forlist)}" value="${sbEsc(b.list||'')}"></div>`;
  if (t==='while')   return `<div class="sb-row"><span class="sb-lbl">Bedingung</span><input class="sb-inp sb-d" data-field="cond"    placeholder="${sbEsc(ph.whcond)}" value="${sbEsc(b.cond||'')}"></div>`;
  if (t==='func')    return `<div class="sb-row"><span class="sb-lbl">Name</span><input class="sb-inp sb-d" data-field="name"    placeholder="meineFunktion" value="${sbEsc(b.name||'myFunc')}"></div>`;
  if (t==='pipe')    return `<div class="sb-row"><span class="sb-lbl">Links</span><input class="sb-inp sb-d" data-field="left"    placeholder="${sbEsc(ph.pipe_l)}" value="${sbEsc(b.left||'')}"></div><div class="sb-row"><span class="sb-lbl">Rechts</span><input class="sb-inp sb-d" data-field="right"   placeholder="${sbEsc(ph.pipe_r)}" value="${sbEsc(b.right||'')}"></div>`;
  if (t==='exit')    return `<div class="sb-row"><span class="sb-lbl">Code</span><input class="sb-inp sb-d" data-field="code"    placeholder="0" value="${sbEsc(b.code||'0')}" style="width:60px"></div>`;
  return '';
}

function sbWireInputs(el, b) {
  el.querySelectorAll('input.sb-d').forEach(inp => {
    inp.addEventListener('input', () => {
      b[inp.dataset.field] = inp.value;
      sbUpdateCode();
    });
  });
}

// ── Block utilities ──
function sbFindBlock(id, arr) {
  arr = arr || sbBlocks;
  for (const b of arr) {
    if (b.id === id) return b;
    if (b.children?.length) { const f=sbFindBlock(id,b.children); if(f)return f; }
    if (b.elseChildren?.length) { const f=sbFindBlock(id,b.elseChildren); if(f)return f; }
  }
  return null;
}
function sbRemoveBlock(id, arr) {
  arr = arr || sbBlocks;
  for (let i=0;i<arr.length;i++) {
    if (arr[i].id===id) { const [r]=arr.splice(i,1); return r; }
    if (arr[i].children?.length) { const r=sbRemoveBlock(id,arr[i].children); if(r)return r; }
    if (arr[i].elseChildren?.length) { const r=sbRemoveBlock(id,arr[i].elseChildren); if(r)return r; }
  }
  return null;
}
function sbMoveBlock(id, dir) {
  const idx = sbBlocks.findIndex(x=>x.id===id);
  if (idx===-1) return;
  const ni = idx+dir;
  if (ni<0||ni>=sbBlocks.length) return;
  [sbBlocks[idx],sbBlocks[ni]]=[sbBlocks[ni],sbBlocks[idx]];
  sbRenderCanvas(); sbUpdateCode();
}
function sbDeleteBlock(id) {
  sbRemoveBlock(id); sbRenderCanvas(); sbUpdateCode();
}
function sbClearCanvas() {
  sbBlocks=[]; sbRenderCanvas(); sbUpdateCode();
}

// ── Code generation ──
function sbUpdateCode() {
  const code = sbGenCode(sbBlocks, sbLang(), 0);
  const pre = document.getElementById('sb-code');
  if (pre) pre.textContent = code;
  sbColorize();
}
function sbGenCode(blocks, lang, depth) {
  const L = SB_LANG[lang];
  const ind = L.indent.repeat(depth);
  let out = '';
  if (depth===0 && L.shebang) out = L.shebang + '\n';

  for (const b of blocks) {
    const t = b.type;
    if (t==='comment') { out += ind + L.comment(b.text||'') + '\n'; }
    else if (t==='var')  { out += ind + L.var(b.name||'VAR', b.value||'') + '\n'; }
    else if (t==='echo') { out += ind + L.echo(b.text||'') + '\n'; }
    else if (t==='cmd')  { out += ind + L.cmd(b.cmd||'') + '\n'; }
    else if (t==='pipe') { out += ind + L.pipe(b.left||'', b.right||'') + '\n'; }
    else if (t==='exit') { out += ind + L.exit(b.code||'0') + '\n'; }
    else if (t==='if') {
      const [open,close] = L.if(b.cond||'condition');
      out += ind + open + '\n';
      if (b.children?.length) out += sbGenCode(b.children, lang, depth+1);
      else out += ind + L.indent + L.comment('Inhalt hier') + '\n';
      if (b.elseChildren?.length) {
        const [,ec]=L.if('x'); // get closing token
        out += ind + (lang==='bash'?'else':lang==='powershell'?'} else {':lang==='python'?'else:':'') + '\n';
        out += sbGenCode(b.elseChildren, lang, depth+1);
      }
      if (close) out += ind + close + '\n';
    }
    else if (t==='elif') {
      const [open] = L.elif(b.cond||'condition');
      out += ind + open + '\n';
    }
    else if (t==='else') {
      const [open] = L.else();
      if (open) out += ind + open + '\n';
    }
    else if (t==='for') {
      const [open,close] = L.for(b.varName||'i', b.list||'list');
      out += ind + open + '\n';
      if (b.children?.length) out += sbGenCode(b.children, lang, depth+1);
      else out += ind + L.indent + L.comment('Schleifeninhalt') + '\n';
      if (close) out += ind + close + '\n';
    }
    else if (t==='while') {
      const [open,close] = L.while(b.cond||'true');
      out += ind + open + '\n';
      if (b.children?.length) out += sbGenCode(b.children, lang, depth+1);
      else out += ind + L.indent + L.comment('Schleifeninhalt') + '\n';
      if (close) out += ind + close + '\n';
    }
    else if (t==='func') {
      const [open,close] = L.func(b.name||'myFunc');
      out += ind + open + '\n';
      if (b.children?.length) out += sbGenCode(b.children, lang, depth+1);
      else out += ind + L.indent + L.comment('Funktionsinhalt') + '\n';
      if (close) out += ind + close + '\n';
    }
    out += '\n';
  }
  return out;
}

function sbColorize() {
  // simple keyword highlight via DOM
  const pre = document.getElementById('sb-code');
  if (!pre) return;
  const raw = pre.textContent;
  // highlight with span colors
  const colored = raw
    .replace(/(&lt;|&gt;|&amp;)/g, m => m)
    .replace(/(^|\n)(#[^\n]*)/g, '$1<span style="color:#94a3b8">$2</span>')
    .replace(/\b(if|elif|else|fi|then|for|while|do|done|in|function|def|return|exit|echo|print|foreach|Write-Host|REM|ECHO|GOTO|SET|CALL)\b/g,
      '<span style="color:#fbbf24">$1</span>')
    .replace(/\$\w+/g, '<span style="color:#34d399">$&</span>')
    .replace(/("[^"]*")/g, '<span style="color:#86efac">$1</span>')
    .replace(/\b(\d+)\b/g, '<span style="color:#38bdf8">$1</span>');
  pre.innerHTML = colored;
}

// ── Run (simulated) ──
function sbRun() {
  const out = document.getElementById('sb-out');
  const code = sbGenCode(sbBlocks, sbLang(), 0);
  if (!code.trim().replace(/#!/,'').trim()) {
    out.innerHTML = '<span class="ts">— Kein Code vorhanden —</span>';
    return;
  }
  const lines = code.split('\n');
  out.innerHTML = '';
  const lang = sbLang();
  const vars = {};
  let output = '';

  const append = (txt, cls) => {
    output += `<span class="${cls||'to'}">${sbEsc(txt)}\n</span>`;
  };

  append(`[${lang}] Script wird ausgeführt (simuliert)…`, 'ts');

  // Simple simulation
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith('REM') || trimmed==='#!/bin/bash' || trimmed==='#!/usr/bin/env python3' || trimmed==='@echo off') continue;

    // Variable assignment
    const vaM = trimmed.match(/^(\w+)="?([^"]*)"?$/) || trimmed.match(/^\$(\w+)\s*=\s*"?([^"]*)"?/) || trimmed.match(/^SET\s+(\w+)=(.*)$/i);
    if (vaM) { vars[vaM[1]] = vaM[2]; continue; }

    // Echo/print
    let echoM = trimmed.match(/^echo\s+"?(.+)"?$/i) || trimmed.match(/^Write-Host\s+"?(.+)"?/i) || trimmed.match(/^print\("(.+)"\)/) || trimmed.match(/^ECHO\s+(.+)/i);
    if (echoM) {
      let txt = echoM[1].replace(/\$(\w+)/g, (_,k)=>vars[k]||`$${k}`).replace(/\$\{(\w+)\}/g,(_,k)=>vars[k]||k);
      append(txt, 'to');
      continue;
    }

    // exit
    if (trimmed.match(/^exit\s*\d*/i)||trimmed.match(/^sys\.exit/)) {
      const code = trimmed.match(/\d+/)?.[0]||'0';
      append(`[Prozess beendet mit Code ${code}]`, 'ts');
      break;
    }

    // Show other lines dimmed
    append(`  ${trimmed}`, 'ts');
  }

  append('\n[Fertig]', 'ts');
  out.innerHTML = output;
  out.scrollTop = out.scrollHeight;
}

// ── Terminal input ──
function sbTermKey(e) {
  const inp = document.getElementById('sb-tin');
  const out = document.getElementById('sb-out');
  if (e.key === 'ArrowUp') { if (sbHistIdx < sbHistory.length-1) { sbHistIdx++; inp.value=sbHistory[sbHistIdx]; } return; }
  if (e.key === 'ArrowDown') { if (sbHistIdx > 0) { sbHistIdx--; inp.value=sbHistory[sbHistIdx]; } else {sbHistIdx=-1;inp.value='';} return; }
  if (e.key !== 'Enter') return;
  const cmd = inp.value.trim();
  if (!cmd) return;
  sbHistory.unshift(cmd); sbHistIdx=-1;
  inp.value = '';

  // Append prompt + command
  out.innerHTML += `<span class="tp">$ ${sbEsc(cmd)}</span>\n`;

  // Simulate common commands
  const lang = sbLang();
  let response = '';
  const c = cmd.toLowerCase();
  if (c==='clear'||c==='cls') { out.innerHTML=''; return; }
  else if (c.startsWith('echo ')) response = cmd.slice(5).replace(/"/g,'');
  else if (c==='ls'||c==='dir') response = 'datei1.txt  datei2.sh  ordner/  skript.py';
  else if (c==='pwd') response = '/home/benutzer/scripts';
  else if (c==='whoami') response = 'benutzer';
  else if (c==='date') response = new Date().toString();
  else if (c==='uname -a'||c==='uname') response = 'Linux simterm 5.15.0 #1 SMP x86_64 GNU/Linux';
  else if (c==='ps'||c==='ps aux') response = '  PID TTY\n 1234 pts/0\n 5678 pts/0';
  else if (c.startsWith('cat ')) response = `[Inhalt von "${cmd.slice(4)}" nicht verfügbar in Simulation]`;
  else if (c.startsWith('cd ')) response = '';
  else if (c==='help') response = 'Verfügbar: echo, ls, dir, pwd, whoami, date, uname, ps, cat, cd, clear, help';
  else response = `bash: ${cmd.split(' ')[0]}: Befehl nicht gefunden (Simulation)`;

  if (response) out.innerHTML += `<span class="to">${sbEsc(response)}</span>\n`;
  out.scrollTop = out.scrollHeight;
}

function sbCopyCode() {
  const code = document.getElementById('sb-code')?.textContent || '';
  navigator.clipboard.writeText(code).then(() => {
    const s = document.getElementById('sb-status');
    if(s){s.textContent='✓ Kopiert!';setTimeout(()=>s.textContent='Bereit',2000);}
  });
}

function sbExport() {
  const code = document.getElementById('sb-code')?.textContent || '';
  const ext = {bash:'sh',powershell:'ps1',python:'py',batch:'bat'}[sbLang()];
  const blob = new Blob([code],{type:'text/plain'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='script.'+ext; a.click();
}

function sbEsc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── show() hook for M122 ──
function dgToggleSidebar(){
  const sb = document.getElementById('dg-sidebar');
  const btn = document.getElementById('dg-sb-toggle');
  if (!sb||!btn) return;
  const closed = sb.classList.toggle('dg-sb-closed');
  btn.textContent = closed ? '›' : '‹';
  btn.title = closed ? 'Ablage einblenden' : 'Ablage ausblenden';
}


// ── Auto-init on load ──
window.addEventListener('load', () => {
  dgRenderDocList();
  if (dgDocs.length > 0) dgLoad(dgDocs[0].id);
  else { dgRenderPagesBar(); dgRenderEditor(); }
});
